<!-- Widget إحصائيات -->
<div class="text-center">
    <div class="stat-value text-{{ widget.color }}">
        {{ data.value|default:"0" }}
    </div>
    <div class="stat-label text-muted">{{ data.label|default:widget.name }}</div>
    {% if data.change_percent %}
    <div class="stat-change {% if data.change_percent > 0 %}positive{% else %}negative{% endif %}">
        <i class="fas {% if data.change_percent > 0 %}fa-arrow-up{% else %}fa-arrow-down{% endif %}"></i>
        {{ data.change_percent|floatformat:1 }}%
    </div>
    {% endif %}
</div>
