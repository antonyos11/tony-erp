"""
Locust configuration file
ملف تكوين Locust لاختبار الأداء
"""

# Host configuration
host = "http://localhost:8000"

# User classes to use (can be overridden with --class-picker)
# Classes to run, in format ClassName:weight
user_classes = [
    ("AuthenticatedUser", 60),      # 60% مستخدمين عاديين
    ("APIUser", 25),                # 25% مستخدمي API
    ("HeavyOperationsUser", 10),   # 10% عمليات ثقيلة
    ("SequentialUser", 5),          # 5% مستخدمين متسلسلين
]

# Default test configuration
users = 50          # عدد المستخدمين الافتراضي
spawn_rate = 5      # معدل إضافة المستخدمين (users/second)
run_time = "5m"     # مدة الاختبار الافتراضية

# Web UI configuration
web_host = "0.0.0.0"
web_port = 8089

# Logging
loglevel = "INFO"
logfile = "load_tests/locust.log"

# CSV output
csv = "load_tests/results"

# HTML report
html = "load_tests/report.html"
