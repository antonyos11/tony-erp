{% extends 'base.html' %}
{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>
            <i class="bi bi-{% if competitor %}pencil{% else %}plus-circle{% endif %} me-2"></i>
            {{ page_title }}
        </h2>
        <a href="{% url 'competitive_intelligence:competitor_list' %}" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> العودة
        </a>
    </div>

    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">اسم المنافس *</label>
                        <input type="text" name="name" class="form-control" 
                               value="{{ competitor.name|default:'' }}" required>
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label class="form-label">الموقع الإلكتروني</label>
                        <input type="url" name="website" class="form-control" 
                               value="{{ competitor.website|default:'' }}">
                    </div>
                </div>
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">الصناعة</label>
                        <input type="text" name="industry" class="form-control" 
                               value="{{ competitor.industry|default:'' }}">
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label class="form-label">مستوى التهديد</label>
                        <select name="threat_level" class="form-select">
                            <option value="low" {% if competitor.threat_level == 'low' %}selected{% endif %}>منخفض</option>
                            <option value="medium" {% if competitor.threat_level == 'medium' %}selected{% endif %}>متوسط</option>
                            <option value="high" {% if competitor.threat_level == 'high' %}selected{% endif %}>عالي</option>
                        </select>
                    </div>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">الوصف</label>
                    <textarea name="description" class="form-control" rows="3">{{ competitor.description|default:'' }}</textarea>
                </div>
                
                {% if competitor %}
                <div class="mb-3 form-check">
                    <input type="checkbox" name="is_active" class="form-check-input" id="is_active" {% if competitor.is_active %}checked{% endif %}>
                    <label class="form-check-label" for="is_active">نشط</label>
                </div>
                {% endif %}
                
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-circle"></i> 
                        {% if competitor %}تحديث{% else %}حفظ{% endif %}
                    </button>
                    <a href="{% url 'competitive_intelligence:competitor_list' %}" class="btn btn-secondary">
                        <i class="bi bi-x-circle"></i> إلغاء
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
