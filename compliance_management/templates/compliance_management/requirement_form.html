{% extends 'base.html' %}
{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-{% if requirement %}pencil{% else %}plus-circle{% endif %} me-2"></i>{{ page_title }}</h2>
        <a href="{% url 'compliance_management:requirement_list' %}" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> العودة
        </a>
    </div>

    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">الكود *</label>
                        <input type="text" name="code" class="form-control" 
                               value="{{ requirement.code|default:'' }}" required>
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label class="form-label">التصنيف</label>
                        <select name="category" class="form-select">
                            <option value="regulatory">تنظيمي</option>
                            <option value="legal">قانوني</option>
                            <option value="industry">صناعي</option>
                        </select>
                    </div>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">الاسم *</label>
                    <input type="text" name="name" class="form-control" 
                           value="{{ requirement.name|default:'' }}" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">الوصف</label>
                    <textarea name="description" class="form-control" rows="4">{{ requirement.description|default:'' }}</textarea>
                </div>
                
                {% if requirement %}
                <div class="mb-3 form-check">
                    <input type="checkbox" name="is_active" class="form-check-input" id="is_active" {% if requirement.is_active %}checked{% endif %}>
                    <label class="form-check-label" for="is_active">نشط</label>
                </div>
                {% endif %}
                
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-circle"></i> 
                        {% if requirement %}تحديث{% else %}حفظ{% endif %}
                    </button>
                    <a href="{% url 'compliance_management:requirement_list' %}" class="btn btn-secondary">
                        <i class="bi bi-x-circle"></i> إلغاء
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
