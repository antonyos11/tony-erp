{% extends 'base.html' %}
{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-plus-circle me-2"></i>{{ page_title }}</h2>
        <a href="{% url 'warranty_management:claim_list' %}" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> العودة
        </a>
    </div>

    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">الضمان *</label>
                        <select name="warranty" class="form-select" required>
                            <option value="">اختر الضمان</option>
                            {% for w in warranties %}
                            <option value="{{ w.id }}">{{ w.warranty_number }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label class="form-label">رقم المطالبة *</label>
                        <input type="text" name="claim_number" class="form-control" required>
                    </div>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">وصف المشكلة *</label>
                    <textarea name="description" class="form-control" rows="4" required></textarea>
                </div>
                
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-circle"></i> تقديم المطالبة
                    </button>
                    <a href="{% url 'warranty_management:claim_list' %}" class="btn btn-secondary">
                        <i class="bi bi-x-circle"></i> إلغاء
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
