{% extends 'base.html' %}
{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>
            <i class="bi bi-{% if warranty %}pencil{% else %}plus-circle{% endif %} me-2"></i>
            {{ page_title }}
        </h2>
        <a href="{% url 'warranty_management:warranty_list' %}" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> العودة
        </a>
    </div>

    {% if messages %}
    {% for message in messages %}
    <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    {% endfor %}
    {% endif %}

    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">رقم الضمان *</label>
                        <input type="text" name="warranty_number" class="form-control" 
                               value="{{ warranty.warranty_number|default:'' }}" required>
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label class="form-label">نوع الضمان *</label>
                        <select name="warranty_type" class="form-select" required>
                            <option value="standard" {% if warranty.warranty_type == 'standard' %}selected{% endif %}>قياسي</option>
                            <option value="extended" {% if warranty.warranty_type == 'extended' %}selected{% endif %}>ممتد</option>
                            <option value="limited" {% if warranty.warranty_type == 'limited' %}selected{% endif %}>محدود</option>
                        </select>
                    </div>
                </div>
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">تاريخ البداية *</label>
                        <input type="date" name="start_date" class="form-control" 
                               value="{{ warranty.start_date|date:'Y-m-d'|default:'' }}" required>
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label class="form-label">تاريخ الانتهاء *</label>
                        <input type="date" name="end_date" class="form-control" 
                               value="{{ warranty.end_date|date:'Y-m-d'|default:'' }}" required>
                    </div>
                </div>
                
                {% if warranty %}
                <div class="mb-3">
                    <label class="form-label">الحالة</label>
                    <select name="status" class="form-select">
                        <option value="active" {% if warranty.status == 'active' %}selected{% endif %}>نشط</option>
                        <option value="expired" {% if warranty.status == 'expired' %}selected{% endif %}>منتهي</option>
                        <option value="cancelled" {% if warranty.status == 'cancelled' %}selected{% endif %}>ملغي</option>
                    </select>
                </div>
                {% endif %}
                
                <div class="mb-3">
                    <label class="form-label">ملاحظات</label>
                    <textarea name="notes" class="form-control" rows="3">{{ warranty.notes|default:'' }}</textarea>
                </div>
                
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-circle"></i> 
                        {% if warranty %}تحديث{% else %}حفظ{% endif %}
                    </button>
                    <a href="{% url 'warranty_management:warranty_list' %}" class="btn btn-secondary">
                        <i class="bi bi-x-circle"></i> إلغاء
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
