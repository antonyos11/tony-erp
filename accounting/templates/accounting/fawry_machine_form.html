{% extends 'base.html' %}
{% load static %}
{% load i18n %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-header bg-warning text-dark">
                    <h4 class="mb-0">
                        <i class="bi bi-phone-fill me-2"></i>
                        {{ title }}
                    </h4>
                </div>
                
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="row g-3">
                            <!-- الاسم -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">اسم الماكينة <span class="text-danger">*</span></label>
                                <input type="text" name="name" class="form-control" required 
                                       value="{{ machine.name|default:'' }}" 
                                       placeholder="مثال: فوري - المعرض الرئيسي">
                            </div>
                            
                            <!-- الكود -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">الكود <span class="text-danger">*</span></label>
                                <input type="text" name="code" class="form-control" required 
                                       value="{{ machine.code|default:'' }}" 
                                       placeholder="مثال: FWR001">
                            </div>
                            
                            <!-- رقم الماكينة -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">رقم الماكينة <span class="text-danger">*</span></label>
                                <input type="text" name="machine_id" class="form-control" required 
                                       value="{{ machine.machine_id|default:'' }}" 
                                       placeholder="الرقم الفريد للماكينة">
                            </div>
                            
                            <!-- رقم الهاتف -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">رقم الهاتف المربوط</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                                    <input type="tel" name="phone_number" class="form-control"
                                           value="{{ machine.phone_number|default:'' }}" 
                                           placeholder="01xxxxxxxxx">
                                </div>
                            </div>
                            
                            <!-- الموقع -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">الموقع</label>
                                <input type="text" name="location" class="form-control" 
                                       value="{{ machine.location|default:'' }}" 
                                       placeholder="مثال: الكاشير الأمامي">
                            </div>
                            
                            <!-- المعرض -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">المعرض / الفرع</label>
                                <select name="showroom" class="form-select">
                                    <option value="">-- اختياري --</option>
                                    {% for showroom in showrooms %}
                                    <option value="{{ showroom.id }}" 
                                            {% if machine.showroom_id == showroom.id %}selected{% endif %}>
                                        {{ showroom.name }}
                                    </option>
                                    {% endfor %}
                                </select>
                            </div>
                            
                            <!-- المسؤول -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">المسؤول</label>
                                <select name="responsible_person" class="form-select">
                                    <option value="">-- اختياري --</option>
                                    {% for user in users %}
                                    <option value="{{ user.id }}" 
                                            {% if machine.responsible_person_id == user.id %}selected{% endif %}>
                                        {{ user.get_full_name|default:user.username }}
                                    </option>
                                    {% endfor %}
                                </select>
                            </div>
                            
                            <!-- نسبة العمولة -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">نسبة العمولة %</label>
                                <div class="input-group">
                                    <input type="number" name="commission_rate" step="0.01" class="form-control" 
                                           value="{{ machine.commission_rate|default:'0.00' }}" 
                                           placeholder="0.00">
                                    <span class="input-group-text">%</span>
                                </div>
                            </div>
                            
                            <!-- الرصيد الحالي -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">الرصيد الحالي</label>
                                <input type="number" name="current_balance" step="0.01" class="form-control" 
                                       value="{{ machine.current_balance|default:'0.00' }}" 
                                       placeholder="0.00">
                            </div>
                            
                            <!-- الحساب المحاسبي المرتبط -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">الحساب المحاسبي المرتبط</label>
                                <select name="linked_account" class="form-select">
                                    <option value="">-- اختياري --</option>
                                    {% for ledger in ledger_accounts %}
                                    <option value="{{ ledger.id }}" 
                                            {% if machine.linked_account_id == ledger.id %}selected{% endif %}>
                                        {{ ledger.code }} - {{ ledger.name }}
                                    </option>
                                    {% endfor %}
                                </select>
                            </div>
                            
                            <!-- الحالة -->
                            <div class="col-md-12">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="is_active" id="is_active"
                                           {% if not machine or machine.is_active %}checked{% endif %}>
                                    <label class="form-check-label fw-bold" for="is_active">
                                        نشط
                                    </label>
                                </div>
                            </div>
                            
                            <!-- الملاحظات -->
                            <div class="col-12">
                                <label class="form-label fw-bold">ملاحظات</label>
                                <textarea name="notes" class="form-control" rows="3" 
                                          placeholder="أي ملاحظات إضافية...">{{ machine.notes|default:'' }}</textarea>
                            </div>
                        </div>
                        
                        <hr class="my-4">
                        
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'accounting:fawry_machines_list' %}" class="btn btn-secondary">
                                <i class="bi bi-arrow-right me-1"></i> إلغاء
                            </a>
                            <button type="submit" class="btn btn-success btn-lg">
                                <i class="bi bi-check-circle me-1"></i> حفظ
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
