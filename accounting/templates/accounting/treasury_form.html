{% extends 'base.html' %}
{% load static %}
{% load i18n %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <div class="card shadow-sm">
                <div class="card-header bg-success text-white">
                    <h4 class="mb-0">
                        <i class="bi bi-safe me-2"></i>
                        {{ title }}
                    </h4>
                </div>
                
                <div class="card-body">
                    <form method="post" class="needs-validation" novalidate>
                        {% csrf_token %}
                        
                        <div class="row g-3">
                            <!-- اسم الخزينة -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">
                                    <i class="bi bi-safe text-success me-1"></i>
                                    اسم الخزينة <span class="text-danger">*</span>
                                </label>
                                <input type="text" name="name" class="form-control" 
                                       value="{{ treasury.name|default:'' }}" required
                                       placeholder="مثال: الخزينة الرئيسية">
                                <div class="invalid-feedback">اسم الخزينة مطلوب</div>
                            </div>
                            
                            <!-- الكود -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">
                                    <i class="bi bi-hash text-success me-1"></i>
                                    كود الخزينة <span class="text-danger">*</span>
                                </label>
                                <input type="text" name="code" class="form-control" 
                                       value="{{ treasury.code|default:'' }}" required
                                       placeholder="مثال: MAIN-SAFE">
                                <div class="invalid-feedback">كود الخزينة مطلوب</div>
                            </div>
                            
                            <!-- رقم الهاتف -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">
                                    <i class="bi bi-telephone text-success me-1"></i>
                                    رقم الهاتف
                                </label>
                                <input type="tel" name="phone_number" class="form-control" 
                                       value="{{ treasury.phone_number|default:'' }}"
                                       placeholder="رقم هاتف المسؤول">
                            </div>
                            
                            <!-- المسؤول -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">
                                    <i class="bi bi-person text-success me-1"></i>
                                    المسؤول عن الخزينة
                                </label>
                                <select name="responsible_person" class="form-select">
                                    <option value="">-- اختر المسؤول --</option>
                                    {% for user in users %}
                                    <option value="{{ user.id }}" 
                                            {% if treasury.responsible_person_id == user.id %}selected{% endif %}>
                                        {{ user.get_full_name|default:user.username }}
                                    </option>
                                    {% endfor %}
                                </select>
                            </div>
                            
                            <!-- المعرض/الفرع -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">
                                    <i class="bi bi-building text-success me-1"></i>
                                    المعرض/الفرع
                                </label>
                                <select name="showroom" class="form-select">
                                    <option value="">-- اختر المعرض --</option>
                                    {% for showroom in showrooms %}
                                    <option value="{{ showroom.id }}" 
                                            {% if treasury.showroom_id == showroom.id %}selected{% endif %}>
                                        {{ showroom.name }}
                                    </option>
                                    {% endfor %}
                                </select>
                            </div>
                            
                            <!-- الرصيد الحالي -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">
                                    <i class="bi bi-cash-stack text-success me-1"></i>
                                    الرصيد الحالي
                                </label>
                                <div class="input-group">
                                    <input type="number" name="current_balance" class="form-control" 
                                           value="{{ treasury.current_balance|default:'0' }}"
                                           step="0.01" min="0">
                                    <span class="input-group-text">ج.م</span>
                                </div>
                            </div>
                            
                            <!-- الموقع -->
                            <div class="col-12">
                                <label class="form-label fw-bold">
                                    <i class="bi bi-geo-alt text-success me-1"></i>
                                    الموقع
                                </label>
                                <textarea name="location" class="form-control" rows="2"
                                          placeholder="موقع الخزينة أو الوصف">{{ treasury.location|default:'' }}</textarea>
                            </div>
                            
                            <!-- الحالة -->
                            <div class="col-12">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" name="is_active" 
                                           id="is_active" {% if treasury.is_active or not treasury %}checked{% endif %}>
                                    <label class="form-check-label" for="is_active">
                                        <i class="bi bi-check-circle text-success me-1"></i>
                                        نشطة
                                    </label>
                                </div>
                            </div>
                        </div>
                        
                        <hr class="my-4">
                        
                        <!-- أزرار الإجراءات -->
                        <div class="d-flex gap-2 justify-content-end">
                            <a href="{% url 'accounting:treasuries_list' %}" class="btn btn-secondary">
                                <i class="bi bi-x-circle me-1"></i> إلغاء
                            </a>
                            <button type="submit" class="btn btn-success">
                                <i class="bi bi-check-circle me-1"></i>
                                {% if treasury %}تحديث{% else %}حفظ{% endif %}
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// Bootstrap form validation
(function () {
    'use strict'
    var forms = document.querySelectorAll('.needs-validation')
    Array.prototype.slice.call(forms).forEach(function (form) {
        form.addEventListener('submit', function (event) {
            if (!form.checkValidity()) {
                event.preventDefault()
                event.stopPropagation()
            }
            form.classList.add('was-validated')
        }, false)
    })
})()
</script>
{% endblock %}
