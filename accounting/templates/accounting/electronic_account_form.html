{% extends 'base.html' %}
{% load static %}
{% load i18n %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">
                        <i class="bi bi-wallet2 me-2"></i>
                        {{ title }}
                    </h4>
                </div>
                
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="row g-3">
                            <!-- الاسم -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">اسم الحساب <span class="text-danger">*</span></label>
                                <input type="text" name="name" class="form-control" required 
                                       value="{{ account.name|default:'' }}" 
                                       placeholder="مثال: فودافون كاش - الحساب الرئيسي">
                            </div>
                            
                            <!-- الكود -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">الكود <span class="text-danger">*</span></label>
                                <input type="text" name="code" class="form-control" required 
                                       value="{{ account.code|default:'' }}" 
                                       placeholder="مثال: VC001">
                            </div>
                            
                            <!-- نوع الحساب -->
                            <div class="col-md-12">
                                <label class="form-label fw-bold">نوع الحساب <span class="text-danger">*</span></label>
                                <select name="account_type" class="form-select" required>
                                    <option value="">-- اختر النوع --</option>
                                    <option value="instapay" {% if account.account_type == 'instapay' %}selected{% endif %}>إنستاباي</option>
                                    <option value="vodafone_cash" {% if account.account_type == 'vodafone_cash' %}selected{% endif %}>فودافون كاش</option>
                                    <option value="orange_cash" {% if account.account_type == 'orange_cash' %}selected{% endif %}>أورانج كاش</option>
                                    <option value="etisalat_cash" {% if account.account_type == 'etisalat_cash' %}selected{% endif %}>اتصالات كاش</option>
                                    <option value="we_pay" {% if account.account_type == 'we_pay' %}selected{% endif %}>وي باي</option>
                                    <option value="paypal" {% if account.account_type == 'paypal' %}selected{% endif %}>باي بال</option>
                                    <option value="paymob" {% if account.account_type == 'paymob' %}selected{% endif %}>بايموب</option>
                                    <option value="fawry" {% if account.account_type == 'fawry' %}selected{% endif %}>فوري</option>
                                    <option value="other" {% if account.account_type == 'other' %}selected{% endif %}>أخرى</option>
                                </select>
                            </div>
                            
                            <!-- رقم الهاتف -->
                            <div class="col-md-12">
                                <label class="form-label fw-bold">
                                    <i class="bi bi-phone me-1"></i>
                                    رقم الهاتف / رقم الموبايل <span class="text-danger">*</span>
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                                    <input type="tel" name="phone_number" class="form-control" required
                                           value="{{ account.phone_number|default:'' }}" 
                                           placeholder="مثال: 01012345678 أو 01201234567"
                                           pattern="[0-9]{11}"
                                           maxlength="11">
                                </div>
                                <small class="text-muted">
                                    <i class="bi bi-info-circle me-1"></i>
                                    رقم الهاتف المرتبط بالمحفظة الإلكترونية (11 رقم)
                                </small>
                            </div>
                            
                            <!-- البريد الإلكتروني -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">البريد الإلكتروني</label>
                                <input type="email" name="email" class="form-control" 
                                       value="{{ account.email|default:'' }}" 
                                       placeholder="example@email.com">
                            </div>
                            
                            <!-- معرف الحساب -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">معرف الحساب</label>
                                <input type="text" name="account_id" class="form-control" 
                                       value="{{ account.account_id|default:'' }}" 
                                       placeholder="رقم الحساب أو المعرف الفريد">
                            </div>
                            
                            <!-- الرصيد الحالي -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">الرصيد الحالي</label>
                                <input type="number" name="current_balance" step="0.01" class="form-control" 
                                       value="{{ account.current_balance|default:'0.00' }}" 
                                       placeholder="0.00">
                            </div>
                            
                            <!-- الحساب المحاسبي المرتبط -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">الحساب المحاسبي المرتبط</label>
                                <select name="linked_account" class="form-select">
                                    <option value="">-- اختياري --</option>
                                    {% for ledger in ledger_accounts %}
                                    <option value="{{ ledger.id }}" 
                                            {% if account.linked_account_id == ledger.id %}selected{% endif %}>
                                        {{ ledger.code }} - {{ ledger.name }}
                                    </option>
                                    {% endfor %}
                                </select>
                            </div>
                            
                            <!-- الحالة -->
                            <div class="col-md-12">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="is_active" id="is_active"
                                           {% if not account or account.is_active %}checked{% endif %}>
                                    <label class="form-check-label fw-bold" for="is_active">
                                        نشط
                                    </label>
                                </div>
                            </div>
                            
                            <!-- الملاحظات -->
                            <div class="col-12">
                                <label class="form-label fw-bold">ملاحظات</label>
                                <textarea name="notes" class="form-control" rows="3" 
                                          placeholder="أي ملاحظات إضافية...">{{ account.notes|default:'' }}</textarea>
                            </div>
                        </div>
                        
                        <hr class="my-4">
                        
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'accounting:electronic_accounts_list' %}" class="btn btn-secondary">
                                <i class="bi bi-arrow-right me-1"></i> إلغاء
                            </a>
                            <button type="submit" class="btn btn-success btn-lg">
                                <i class="bi bi-check-circle me-1"></i> حفظ
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
