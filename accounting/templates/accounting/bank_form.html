{% extends 'base.html' %}
{% load static %}
{% load i18n %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <div class="card shadow-sm">
                <div class="card-header bg-info text-white">
                    <h4 class="mb-0">
                        <i class="bi bi-bank me-2"></i>
                        {{ title }}
                    </h4>
                </div>
                
                <div class="card-body">
                    <form method="post" class="needs-validation" novalidate>
                        {% csrf_token %}
                        
                        <div class="row g-3">
                            <!-- اسم البنك -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">
                                    <i class="bi bi-bank text-info me-1"></i>
                                    اسم البنك <span class="text-danger">*</span>
                                </label>
                                <input type="text" name="name" class="form-control" 
                                       value="{{ bank.name|default:'' }}" required
                                       placeholder="مثال: البنك الأهلي المصري">
                                <div class="invalid-feedback">اسم البنك مطلوب</div>
                            </div>
                            
                            <!-- الكود -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">
                                    <i class="bi bi-hash text-info me-1"></i>
                                    كود البنك <span class="text-danger">*</span>
                                </label>
                                <input type="text" name="code" class="form-control" 
                                       value="{{ bank.code|default:'' }}" required
                                       placeholder="مثال: NBE">
                                <div class="invalid-feedback">كود البنك مطلوب</div>
                            </div>
                            
                            <!-- رقم الحساب -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">
                                    <i class="bi bi-credit-card text-info me-1"></i>
                                    رقم الحساب البنكي
                                </label>
                                <input type="text" name="account_number" class="form-control" 
                                       value="{{ bank.account_number|default:'' }}"
                                       placeholder="رقم الحساب البنكي">
                            </div>
                            
                            <!-- SWIFT Code -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">
                                    <i class="bi bi-globe text-info me-1"></i>
                                    كود SWIFT
                                </label>
                                <input type="text" name="swift_code" class="form-control" 
                                       value="{{ bank.swift_code|default:'' }}"
                                       placeholder="SWIFT/BIC Code">
                            </div>
                            
                            <!-- رقم الهاتف -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">
                                    <i class="bi bi-telephone text-info me-1"></i>
                                    رقم الهاتف
                                </label>
                                <input type="tel" name="phone" class="form-control" 
                                       value="{{ bank.phone|default:'' }}"
                                       placeholder="رقم هاتف البنك">
                            </div>
                            
                            <!-- البريد الإلكتروني -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">
                                    <i class="bi bi-envelope text-info me-1"></i>
                                    البريد الإلكتروني
                                </label>
                                <input type="email" name="email" class="form-control" 
                                       value="{{ bank.email|default:'' }}"
                                       placeholder="البريد الإلكتروني">
                            </div>
                            
                            <!-- مسؤول الاتصال -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">
                                    <i class="bi bi-person text-info me-1"></i>
                                    مسؤول الاتصال
                                </label>
                                <input type="text" name="contact_person" class="form-control" 
                                       value="{{ bank.contact_person|default:'' }}"
                                       placeholder="اسم مسؤول الاتصال">
                            </div>
                            
                            <!-- الرصيد الحالي -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">
                                    <i class="bi bi-cash-stack text-info me-1"></i>
                                    الرصيد الحالي
                                </label>
                                <div class="input-group">
                                    <input type="number" name="current_balance" class="form-control" 
                                           value="{{ bank.current_balance|default:'0' }}"
                                           step="0.01" min="0">
                                    <span class="input-group-text">ج.م</span>
                                </div>
                            </div>
                            
                            <!-- العنوان -->
                            <div class="col-12">
                                <label class="form-label fw-bold">
                                    <i class="bi bi-geo-alt text-info me-1"></i>
                                    العنوان
                                </label>
                                <textarea name="address" class="form-control" rows="2"
                                          placeholder="عنوان فرع البنك">{{ bank.address|default:'' }}</textarea>
                            </div>
                            
                            <!-- الحالة -->
                            <div class="col-12">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" name="is_active" 
                                           id="is_active" {% if bank.is_active or not bank %}checked{% endif %}>
                                    <label class="form-check-label" for="is_active">
                                        <i class="bi bi-check-circle text-success me-1"></i>
                                        نشط
                                    </label>
                                </div>
                            </div>
                        </div>
                        
                        <hr class="my-4">
                        
                        <!-- أزرار الإجراءات -->
                        <div class="d-flex gap-2 justify-content-end">
                            <a href="{% url 'accounting:banks_list' %}" class="btn btn-secondary">
                                <i class="bi bi-x-circle me-1"></i> إلغاء
                            </a>
                            <button type="submit" class="btn btn-info">
                                <i class="bi bi-check-circle me-1"></i>
                                {% if bank %}تحديث{% else %}حفظ{% endif %}
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// Bootstrap form validation
(function () {
    'use strict'
    var forms = document.querySelectorAll('.needs-validation')
    Array.prototype.slice.call(forms).forEach(function (form) {
        form.addEventListener('submit', function (event) {
            if (!form.checkValidity()) {
                event.preventDefault()
                event.stopPropagation()
            }
            form.classList.add('was-validated')
        }, false)
    })
})()
</script>
{% endblock %}
