{% extends 'base.html' %}
{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-plus-circle me-2"></i>{{ page_title }}</h2>
        <a href="{% url 'customer_profitability:analysis_list' %}" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> العودة
        </a>
    </div>

    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">تاريخ التحليل *</label>
                        <input type="date" name="analysis_date" class="form-control" required>
                    </div>
                </div>
                
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">إجمالي الإيرادات *</label>
                        <input type="number" name="total_revenue" class="form-control" step="0.01" required>
                    </div>
                    
                    <div class="col-md-4 mb-3">
                        <label class="form-label">إجمالي التكاليف *</label>
                        <input type="number" name="total_costs" class="form-control" step="0.01" required>
                    </div>
                    
                    <div class="col-md-4 mb-3">
                        <label class="form-label">القيمة الدائمة للعميل</label>
                        <input type="number" name="lifetime_value" class="form-control" step="0.01" value="0">
                    </div>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">ملاحظات</label>
                    <textarea name="notes" class="form-control" rows="3"></textarea>
                </div>
                
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-circle"></i> حفظ التحليل
                    </button>
                    <a href="{% url 'customer_profitability:analysis_list' %}" class="btn btn-secondary">
                        <i class="bi bi-x-circle"></i> إلغاء
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
