{% extends 'base.html' %}
{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>
            <i class="bi bi-{% if license %}pencil{% else %}plus-circle{% endif %} me-2"></i>
            {{ page_title }}
        </h2>
        <a href="{% url 'license_management:license_list' %}" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> العودة
        </a>
    </div>

    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">رقم الترخيص *</label>
                        <input type="text" name="license_number" class="form-control" 
                               value="{{ license.license_number|default:'' }}" required>
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label class="form-label">نوع الترخيص *</label>
                        <select name="license_type" class="form-select" required>
                            <option value="business" {% if license.license_type == 'business' %}selected{% endif %}>تجاري</option>
                            <option value="health" {% if license.license_type == 'health' %}selected{% endif %}>صحي</option>
                            <option value="industrial" {% if license.license_type == 'industrial' %}selected{% endif %}>صناعي</option>
                            <option value="food" {% if license.license_type == 'food' %}selected{% endif %}>غذائي</option>
                            <option value="environmental" {% if license.license_type == 'environmental' %}selected{% endif %}>بيئي</option>
                            <option value="safety" {% if license.license_type == 'safety' %}selected{% endif %}>سلامة</option>
                            <option value="other" {% if license.license_type == 'other' %}selected{% endif %}>أخرى</option>
                        </select>
                    </div>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">اسم الترخيص *</label>
                    <input type="text" name="name" class="form-control" 
                           value="{{ license.name|default:'' }}" required>
                </div>
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">تاريخ الإصدار *</label>
                        <input type="date" name="issue_date" class="form-control" 
                               value="{{ license.issue_date|date:'Y-m-d'|default:'' }}" required>
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label class="form-label">تاريخ الانتهاء *</label>
                        <input type="date" name="expiry_date" class="form-control" 
                               value="{{ license.expiry_date|date:'Y-m-d'|default:'' }}" required>
                    </div>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">الجهة المصدرة</label>
                    <input type="text" name="issuing_authority" class="form-control" 
                           value="{{ license.issuing_authority|default:'' }}">
                </div>
                
                {% if license %}
                <div class="mb-3">
                    <label class="form-label">الحالة</label>
                    <select name="status" class="form-select">
                        <option value="active" {% if license.status == 'active' %}selected{% endif %}>نشط</option>
                        <option value="expired" {% if license.status == 'expired' %}selected{% endif %}>منتهي</option>
                        <option value="suspended" {% if license.status == 'suspended' %}selected{% endif %}>موقوف</option>
                        <option value="pending_renewal" {% if license.status == 'pending_renewal' %}selected{% endif %}>معلق التجديد</option>
                    </select>
                </div>
                {% endif %}
                
                <div class="mb-3">
                    <label class="form-label">ملاحظات</label>
                    <textarea name="notes" class="form-control" rows="3">{{ license.notes|default:'' }}</textarea>
                </div>
                
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-circle"></i> 
                        {% if license %}تحديث{% else %}حفظ{% endif %}
                    </button>
                    <a href="{% url 'license_management:license_list' %}" class="btn btn-secondary">
                        <i class="bi bi-x-circle"></i> إلغاء
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
