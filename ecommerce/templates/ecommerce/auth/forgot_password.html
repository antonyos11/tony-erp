{% extends 'ecommerce/auth/base_auth.html' %}
{% load static i18n %}

{% block title %}نسيت كلمة المرور{% endblock %}

{% block content %}
<div class="auth-title">
    <h2>نسيت كلمة المرور؟</h2>
    <p>أدخل بريدك الإلكتروني وسنرسل لك رابط إعادة تعيين كلمة المرور</p>
</div>

<form method="post" action="{% url 'ecommerce:forgot_password' %}">
    {% csrf_token %}
    
    <div class="form-floating">
        <input type="email" class="form-control" id="email" name="email" 
               placeholder="البريد الإلكتروني" required>
        <label for="email"><i class="fas fa-envelope me-2"></i>البريد الإلكتروني</label>
    </div>
    
    <button type="submit" class="btn btn-primary w-100 mt-3">
        <i class="fas fa-paper-plane me-2"></i>
        إرسال رابط إعادة التعيين
    </button>
</form>

<div class="auth-footer">
    تذكرت كلمة المرور؟
    <a href="{% url 'ecommerce:customer_login' %}">
        تسجيل الدخول
    </a>
</div>
{% endblock %}
