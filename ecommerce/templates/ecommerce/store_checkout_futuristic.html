{% extends 'ecommerce/store_base_futuristic.html' %}
{% load static %}

{% block content %}
<div class="container-fluid-immersive py-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <!-- Glowing Timeline -->
            <div class="d-flex justify-content-between position-relative mb-5 px-5">
                <div class="position-absolute top-50 start-0 w-100 bg-glass" style="height: 2px; z-index: 0;"></div>
                <div class="position-absolute top-50 start-0 bg-gold" style="width: 50%; height: 2px; z-index: 0; box-shadow: 0 0 10px var(--accent-gold);"></div>
                
                <div class="position-relative z-1 text-center">
                    <div class="bg-gold rounded-circle d-flex align-items-center justify-content-center text-dark fw-bold mb-2 shadow-glow" style="width: 40px; height: 40px;">1</div>
                    <small class="text-gold">السلة</small>
                </div>
                <div class="position-relative z-1 text-center">
                    <div class="bg-gold rounded-circle d-flex align-items-center justify-content-center text-dark fw-bold mb-2 shadow-glow" style="width: 40px; height: 40px;">2</div>
                    <small class="text-gold">البيانات</small>
                </div>
                <div class="position-relative z-1 text-center">
                    <div class="bg-dark border border-secondary rounded-circle d-flex align-items-center justify-content-center text-secondary mb-2" style="width: 40px; height: 40px;">3</div>
                    <small class="text-muted">الدفع</small>
                </div>
            </div>

            <div class="glass-card p-5">
                <h3 class="text-white mb-4 text-center">النفق الآمن</h3>
                
                <form action="{% url 'ecommerce:place_order' %}" method="post" id="checkoutForm">
                    {% csrf_token %}
                    
                    <div class="row g-4">
                        <div class="col-md-6">
                            <label class="form-label text-gold small text-uppercase">الاسم الكامل</label>
                            <input type="text" name="customer_name" class="form-control futuristic-input" required value="{{ request.user.get_full_name }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-gold small text-uppercase">البريد الإلكتروني</label>
                            <input type="email" name="customer_email" class="form-control futuristic-input" required value="{{ request.user.email }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-gold small text-uppercase">رقم الهاتف</label>
                            <input type="tel" name="customer_phone" class="form-control futuristic-input" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-gold small text-uppercase">المدينة</label>
                            <select name="shipping_city" class="form-select futuristic-input" required>
                                <option value="">اختر الوجهة...</option>
                                <option value="Cairo">القاهرة</option>
                                <option value="Giza">الجيزة</option>
                                <option value="Alex">الإسكندرية</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label text-gold small text-uppercase">العنوان التفصيلي</label>
                            <textarea name="shipping_address" class="form-control futuristic-input" rows="2" required placeholder="يرجى كتابة العنوان بدقة لضمان دقة الهبوط"></textarea>
                        </div>
                        
                        <div class="col-12 pt-4">
                            <label class="form-label text-gold small text-uppercase mb-3">طريقة الدفع</label>
                            <div class="row g-3">
                                <div class="col-md-4">
                                    <input type="radio" class="btn-check" name="payment_method" id="cod" value="cod" checked>
                                    <label class="btn btn-outline-light w-100 py-3 rounded-3 border-opacity-25 payment-tile" for="cod">
                                        <i class="bi bi-cash-stack fs-3 d-block mb-2"></i>
                                        الدفع عند الاستلام
                                    </label>
                                </div>
                                <div class="col-md-4">
                                    <input type="radio" class="btn-check" name="payment_method" id="card" value="card">
                                    <label class="btn btn-outline-light w-100 py-3 rounded-3 border-opacity-25 payment-tile" for="card">
                                        <i class="bi bi-credit-card fs-3 d-block mb-2"></i>
                                        بطاقة ائتمان
                                    </label>
                                </div>
                                <div class="col-md-4">
                                    <input type="radio" class="btn-check" name="payment_method" id="wallet" value="wallet">
                                    <label class="btn btn-outline-light w-100 py-3 rounded-3 border-opacity-25 payment-tile" for="wallet">
                                        <i class="bi bi-wallet2 fs-3 d-block mb-2"></i>
                                        محفظة إلكترونية
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="mt-5 border-top border-secondary pt-4">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h5 class="text-white m-0">الإجمالي النهائي</h5>
                            <h3 class="text-gold m-0">{{ total }} ج.م</h3>
                        </div>
                        
                        <button type="submit" class="btn btn-glow w-100 py-3 fs-5 rounded-pill position-relative overflow-hidden">
                            <span class="position-relative z-1">تأكيد الطلب وبدء الشحن</span>
                            <div class="position-absolute top-0 start-0 w-100 h-100 bg-white opacity-25" style="transform: skewX(-20deg) translateX(-150%); animation: shine 3s infinite;"></div>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
    .futuristic-input {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: white;
        border-radius: 10px;
        padding: 12px;
        transition: all 0.3s;
    }
    .futuristic-input:focus {
        background: rgba(255, 255, 255, 0.1);
        border-color: var(--accent-bio);
        box-shadow: 0 0 15px rgba(78, 205, 196, 0.2);
        color: white;
        outline: none;
    }
    .payment-tile:hover, .btn-check:checked + .payment-tile {
        background: rgba(212, 175, 55, 0.1);
        border-color: var(--accent-gold);
        box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
    }
    @keyframes shine {
        0% { transform: skewX(-20deg) translateX(-150%); }
        20% { transform: skewX(-20deg) translateX(150%); }
        100% { transform: skewX(-20deg) translateX(150%); }
    }
</style>
{% endblock %}
