<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غير متصل - متجر Tony</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            direction: rtl;
        }
        
        .offline-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .offline-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        
        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 15px;
        }
        
        p {
            color: #666;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        
        .retry-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 18px;
            cursor: pointer;
            transition: transform 0.3s;
        }
        
        .retry-btn:hover {
            transform: translateY(-2px);
        }
        
        .retry-btn:active {
            transform: translateY(0);
        }
        
        .cached-items {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        
        .cached-items h3 {
            color: #333;
            font-size: 16px;
            margin-bottom: 15px;
        }
        
        .cached-link {
            display: block;
            padding: 10px 15px;
            background: #f8f9fa;
            border-radius: 10px;
            margin: 8px 0;
            color: #667eea;
            text-decoration: none;
            transition: background 0.3s;
        }
        
        .cached-link:hover {
            background: #e9ecef;
        }
        
        .tips {
            margin-top: 30px;
            text-align: right;
            font-size: 14px;
            color: #888;
        }
        
        .tips li {
            margin: 8px 0;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">📵</div>
        <h1>أنت غير متصل بالإنترنت</h1>
        <p>يبدو أن اتصالك بالإنترنت مقطوع. تحقق من اتصالك وحاول مرة أخرى.</p>
        
        <button class="retry-btn" onclick="window.location.reload()">
            🔄 حاول مجدداً
        </button>
        
        <div class="cached-items" id="cachedItems" style="display: none;">
            <h3>📱 صفحات محفوظة يمكنك زيارتها:</h3>
            <div id="cachedLinks"></div>
        </div>
        
        <div class="tips">
            <h4>💡 نصائح:</h4>
            <ul>
                <li>تأكد من تفعيل Wi-Fi أو بيانات الموبايل</li>
                <li>جرب إيقاف وتشغيل وضع الطيران</li>
                <li>ابتعد عن المناطق ضعيفة التغطية</li>
            </ul>
        </div>
    </div>
    
    <script>
        // Check for cached pages
        if ('caches' in window) {
            caches.open('tony-store-dynamic-v2').then(cache => {
                cache.keys().then(keys => {
                    if (keys.length > 0) {
                        const container = document.getElementById('cachedItems');
                        const linksDiv = document.getElementById('cachedLinks');
                        
                        container.style.display = 'block';
                        
                        keys.slice(0, 5).forEach(request => {
                            const url = new URL(request.url);
                            const link = document.createElement('a');
                            link.href = url.pathname;
                            link.className = 'cached-link';
                            link.textContent = url.pathname.replace('/ecommerce/', '') || 'الرئيسية';
                            linksDiv.appendChild(link);
                        });
                    }
                });
            });
        }
        
        // Auto-retry when online
        window.addEventListener('online', () => {
            window.location.reload();
        });
    </script>
</body>
</html>
