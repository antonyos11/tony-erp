{% extends 'base.html' %}
{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>
            <i class="bi bi-{% if campaign %}pencil{% else %}plus-circle{% endif %} me-2"></i>
            {{ page_title }}
        </h2>
        <a href="{% url 'marketing_campaigns:campaign_list' %}" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> العودة
        </a>
    </div>

    {% if messages %}
    {% for message in messages %}
    <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    {% endfor %}
    {% endif %}

    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">اسم الحملة *</label>
                        <input type="text" name="name" class="form-control" 
                               value="{{ campaign.name|default:'' }}" required>
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label class="form-label">نوع الحملة *</label>
                        <select name="campaign_type" class="form-select" required>
                            {% for key, label in campaign_types %}
                            <option value="{{ key }}" {% if campaign.campaign_type == key %}selected{% endif %}>{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">تاريخ البداية *</label>
                        <input type="datetime-local" name="start_date" class="form-control" 
                               value="{{ campaign.start_date|date:'Y-m-d\TH:i'|default:'' }}" required>
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label class="form-label">تاريخ النهاية</label>
                        <input type="datetime-local" name="end_date" class="form-control" 
                               value="{{ campaign.end_date|date:'Y-m-d\TH:i'|default:'' }}">
                    </div>
                </div>
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">الميزانية</label>
                        <input type="number" name="budget" class="form-control" step="0.01" 
                               value="{{ campaign.budget|default:'0' }}">
                    </div>
                    
                    {% if campaign %}
                    <div class="col-md-6 mb-3">
                        <label class="form-label">الحالة</label>
                        <select name="status" class="form-select">
                            {% for key, label in status_choices %}
                            <option value="{{ key }}" {% if campaign.status == key %}selected{% endif %}>{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    {% endif %}
                </div>
                
                <div class="mb-3">
                    <label class="form-label">الوصف</label>
                    <textarea name="description" class="form-control" rows="3">{{ campaign.description|default:'' }}</textarea>
                </div>
                
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-circle"></i> 
                        {% if campaign %}تحديث{% else %}حفظ{% endif %}
                    </button>
                    <a href="{% url 'marketing_campaigns:campaign_list' %}" class="btn btn-secondary">
                        <i class="bi bi-x-circle"></i> إلغاء
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
