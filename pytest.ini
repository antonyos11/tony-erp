[pytest]
DJANGO_SETTINGS_MODULE = accountant_pro.settings

# Test discovery - يشمل كل من مجلد tests/ وملفات الاختبار في التطبيقات
testpaths = tests api accounting accounts core ecommerce hr inventory sales purchases production partners reports showrooms pos fleet crm approvals notifications woocommerce_integration fixed_assets taxes quick_access maintenance attendance mattress_builder product_reviews projects shipment_tracking dashboard
python_files = tests.py tests_*.py test_*.py
python_classes = Test*

# Collect tests from app directories too
# ملاحظة: collect_ignore_glob غير صالح في pytest.ini - يُضبط في conftest.py

# The folder tests/integration currently contains manual QA scripts (side-effectful).
# Keep them out of the default suite until they are converted to proper isolated tests.
norecursedirs = tests/integration .git __pycache__ node_modules venv .venv

# Test execution options
addopts = 
    -ra
    --strict-markers
    --showlocals
    --tb=short
    --maxfail=5
    -p no:warnings

# Parallel execution (use -n auto to enable)
# Run with: pytest -n auto

# Test markers
markers =
    unit: Unit tests for individual components
    integration: Integration tests across modules
    api: API endpoint tests
    performance: Performance and load tests
    slow: Tests that take significant time to run
    smoke: Quick smoke tests for basic functionality
    security: Security-related tests
    p0: Priority 0 - Critical tests (must pass)
    p1: Priority 1 - High priority tests
    p2: Priority 2 - Medium priority tests
    p3: Priority 3 - Low priority tests

# Timeout for individual tests (prevent hanging)
timeout = 300

# Django configuration
django_find_project = false
pythonpath = .

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning
