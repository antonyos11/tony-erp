{% extends 'base.html' %}
{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>
            <i class="bi bi-{% if complaint %}pencil{% else %}plus-circle{% endif %} me-2"></i>
            {{ page_title }}
        </h2>
        <a href="{% url 'complaint_management:complaint_list' %}" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> العودة
        </a>
    </div>

    {% if messages %}
    {% for message in messages %}
    <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    {% endfor %}
    {% endif %}

    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">رقم الشكوى *</label>
                        <input type="text" name="complaint_number" class="form-control" 
                               value="{{ complaint.complaint_number|default:'' }}" required>
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label class="form-label">الأولوية *</label>
                        <select name="priority" class="form-select" required>
                            <option value="low" {% if complaint.priority == 'low' %}selected{% endif %}>منخفضة</option>
                            <option value="medium" {% if complaint.priority == 'medium' %}selected{% endif %}>متوسطة</option>
                            <option value="high" {% if complaint.priority == 'high' %}selected{% endif %}>عالية</option>
                            <option value="critical" {% if complaint.priority == 'critical' %}selected{% endif %}>حرجة</option>
                        </select>
                    </div>
                </div>
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">التصنيف</label>
                        <select name="category" class="form-select">
                            <option value="service" {% if complaint.category == 'service' %}selected{% endif %}>خدمة</option>
                            <option value="product" {% if complaint.category == 'product' %}selected{% endif %}>منتج</option>
                            <option value="delivery" {% if complaint.category == 'delivery' %}selected{% endif %}>توصيل</option>
                            <option value="billing" {% if complaint.category == 'billing' %}selected{% endif %}>فواتير</option>
                            <option value="other" {% if complaint.category == 'other' %}selected{% endif %}>أخرى</option>
                        </select>
                    </div>
                    
                    {% if complaint %}
                    <div class="col-md-6 mb-3">
                        <label class="form-label">الحالة</label>
                        <select name="status" class="form-select">
                            <option value="open" {% if complaint.status == 'open' %}selected{% endif %}>مفتوحة</option>
                            <option value="in_progress" {% if complaint.status == 'in_progress' %}selected{% endif %}>قيد المعالجة</option>
                            <option value="resolved" {% if complaint.status == 'resolved' %}selected{% endif %}>تم الحل</option>
                            <option value="closed" {% if complaint.status == 'closed' %}selected{% endif %}>مغلقة</option>
                        </select>
                    </div>
                    {% endif %}
                </div>
                
                <div class="mb-3">
                    <label class="form-label">الموضوع *</label>
                    <input type="text" name="subject" class="form-control" 
                           value="{{ complaint.subject|default:'' }}" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">وصف الشكوى *</label>
                    <textarea name="description" class="form-control" rows="4" required>{{ complaint.description|default:'' }}</textarea>
                </div>
                
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-circle"></i> 
                        {% if complaint %}تحديث{% else %}تسجيل{% endif %}
                    </button>
                    <a href="{% url 'complaint_management:complaint_list' %}" class="btn btn-secondary">
                        <i class="bi bi-x-circle"></i> إلغاء
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
