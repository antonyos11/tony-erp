apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tony-erp-ingress
  namespace: tony-erp
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - tony-erp.yourdomain.com
    secretName: tony-erp-tls
  rules:
  - host: tony-erp.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: django-service
            port:
              number: 8000
