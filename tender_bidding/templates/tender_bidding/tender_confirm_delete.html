{% extends 'base.html' %}
{% block title %}حذف المناقصة{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-danger">
                <div class="card-header bg-danger text-white">
                    <h5 class="mb-0"><i class="bi bi-exclamation-triangle me-2"></i>تأكيد الحذف</h5>
                </div>
                <div class="card-body text-center py-5">
                    <i class="bi bi-trash display-1 text-danger mb-3"></i>
                    <h4>هل أنت متأكد من حذف هذه المناقصة؟</h4>
                    <p class="text-muted mb-4">
                        <strong>{{ tender.reference_number }}</strong> - {{ tender.title }}
                    </p>
                    <p class="text-danger">
                        <i class="bi bi-exclamation-circle"></i>
                        هذا الإجراء لا يمكن التراجع عنه وسيتم حذف جميع العطاءات المرتبطة
                    </p>
                    
                    <form method="post" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger btn-lg">
                            <i class="bi bi-trash"></i> نعم، احذف
                        </button>
                        <a href="{% url 'tender_bidding:tender_list' %}" class="btn btn-secondary btn-lg">
                            <i class="bi bi-x-circle"></i> إلغاء
                        </a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
