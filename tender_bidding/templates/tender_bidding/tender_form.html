{% extends 'base.html' %}
{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-plus-circle me-2"></i>{{ page_title }}</h2>
        <a href="{% url 'tender_bidding:tender_list' %}" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> العودة للقائمة
        </a>
    </div>

    {% if messages %}
    {% for message in messages %}
    <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    {% endfor %}
    {% endif %}

    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">الرقم المرجعي <span class="text-danger">*</span></label>
                        <input type="text" name="reference_number" class="form-control" 
                               value="{{ tender.reference_number|default:'' }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">العنوان <span class="text-danger">*</span></label>
                        <input type="text" name="title" class="form-control" 
                               value="{{ tender.title|default:'' }}" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">الوصف</label>
                    <textarea name="description" class="form-control" rows="4">{{ tender.description|default:'' }}</textarea>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">الاتجاه</label>
                        <select name="direction" class="form-select">
                            {% for value, label in direction_choices %}
                            <option value="{{ value }}" {% if tender.direction == value %}selected{% endif %}>{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">نوع المناقصة</label>
                        <select name="tender_type" class="form-select">
                            {% for value, label in tender_types %}
                            <option value="{{ value }}" {% if tender.tender_type == value %}selected{% endif %}>{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">الحالة</label>
                        <select name="status" class="form-select">
                            {% for value, label in status_choices %}
                            <option value="{{ value }}" {% if tender.status == value %}selected{% endif %}>{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">الجهة المصدرة</label>
                        <input type="text" name="issuing_organization" class="form-control" 
                               value="{{ tender.issuing_organization|default:'' }}">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">الموعد النهائي للتقديم <span class="text-danger">*</span></label>
                        <input type="datetime-local" name="submission_deadline" class="form-control" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">القيمة التقديرية</label>
                        <input type="number" name="estimated_value" class="form-control" step="0.01"
                               value="{{ tender.estimated_value|default:0 }}">
                    </div>
                </div>

                <hr>
                
                <div class="d-flex justify-content-end gap-2">
                    <a href="{% url 'tender_bidding:tender_list' %}" class="btn btn-secondary">إلغاء</a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-circle"></i> 
                        {% if tender %}تحديث{% else %}حفظ{% endif %}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
