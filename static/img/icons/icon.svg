<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#0f2439"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f5c4"/>
      <stop offset="100%" style="stop-color:#00d4aa"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  
  <!-- Main Icon - Building/ERP Symbol -->
  <g transform="translate(256, 256)">
    <!-- Central building -->
    <rect x="-80" y="-100" width="160" height="180" rx="10" fill="url(#accentGrad)"/>
    
    <!-- Windows -->
    <rect x="-55" y="-75" width="30" height="25" rx="3" fill="#1e3a5f"/>
    <rect x="-10" y="-75" width="30" height="25" rx="3" fill="#1e3a5f"/>
    <rect x="25" y="-75" width="30" height="25" rx="3" fill="#1e3a5f"/>
    
    <rect x="-55" y="-35" width="30" height="25" rx="3" fill="#1e3a5f"/>
    <rect x="-10" y="-35" width="30" height="25" rx="3" fill="#1e3a5f"/>
    <rect x="25" y="-35" width="30" height="25" rx="3" fill="#1e3a5f"/>
    
    <rect x="-55" y="5" width="30" height="25" rx="3" fill="#1e3a5f"/>
    <rect x="-10" y="5" width="30" height="25" rx="3" fill="#1e3a5f"/>
    <rect x="25" y="5" width="30" height="25" rx="3" fill="#1e3a5f"/>
    
    <!-- Door -->
    <rect x="-20" y="45" width="40" height="35" rx="5" fill="#1e3a5f"/>
    
    <!-- Side buildings -->
    <rect x="-140" y="-40" width="50" height="120" rx="8" fill="rgba(0, 212, 170, 0.6)"/>
    <rect x="90" y="-40" width="50" height="120" rx="8" fill="rgba(0, 212, 170, 0.6)"/>
    
    <!-- Connecting lines -->
    <line x1="-90" y1="20" x2="-80" y2="20" stroke="#00d4aa" stroke-width="4"/>
    <line x1="80" y1="20" x2="90" y2="20" stroke="#00d4aa" stroke-width="4"/>
  </g>
  
  <!-- Arabic Text "الشامل" -->
  <text x="256" y="440" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle" direction="rtl">الشامل</text>
</svg>
