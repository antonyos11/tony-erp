version: '3.8'

services:
  # قاعدة البيانات PostgreSQL
  db:
    image: postgres:15
    container_name: tony_erp_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tony_erb}
      POSTGRES_USER: ${POSTGRES_USER:-tony}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-strong_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tony}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis للكاش والمهام
  redis:
    image: redis:7-alpine
    container_name: tony_erp_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # تطبيق Django الرئيسي
  web:
    build: .
    container_name: tony_erp_web
    restart: unless-stopped
    environment:
      - DEBUG=${DEBUG:-0}
      - DJANGO_SETTINGS_MODULE=accountant_pro.settings_prod
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - PROD_ALLOWED_HOSTS=${PROD_ALLOWED_HOSTS}
      - DB_ENGINE=postgresql
      - POSTGRES_DB=${POSTGRES_DB:-tony_erb}
      - POSTGRES_USER=${POSTGRES_USER:-tony}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-strong_password}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/1}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
    ports:
      - "8000:8000"
    volumes:
      - ./media:/app/media
      - ./logs:/app/logs
      - ./backups:/app/backups
      - ./staticfiles:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "manage.py", "health_check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: >
      sh -c "
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput &&
        python manage.py system_self_check &&
        gunicorn accountant_pro.wsgi:application --bind 0.0.0.0:8000 --workers 3
      "

  # Celery Worker للمهام الخلفية
  celery_worker:
    build: .
    container_name: tony_erp_celery_worker
    restart: unless-stopped
    environment:
      - DEBUG=${DEBUG:-0}
      - DJANGO_SETTINGS_MODULE=accountant_pro.settings_prod
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - PROD_ALLOWED_HOSTS=${PROD_ALLOWED_HOSTS}
      - DB_ENGINE=postgresql
      - POSTGRES_DB=${POSTGRES_DB:-tony_erb}
      - POSTGRES_USER=${POSTGRES_USER:-tony}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-strong_password}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/1}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./media:/app/media
      - ./logs:/app/logs
      - ./backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A accountant_pro worker --loglevel=info

  # Celery Beat للمهام المجدولة
  celery_beat:
    build: .
    container_name: tony_erp_celery_beat
    restart: unless-stopped
    environment:
      - DEBUG=${DEBUG:-0}
      - DJANGO_SETTINGS_MODULE=accountant_pro.settings_prod
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - PROD_ALLOWED_HOSTS=${PROD_ALLOWED_HOSTS}
      - DB_ENGINE=postgresql
      - POSTGRES_DB=${POSTGRES_DB:-tony_erb}
      - POSTGRES_USER=${POSTGRES_USER:-tony}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-strong_password}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/1}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./media:/app/media
      - ./logs:/app/logs
      - ./backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A accountant_pro beat --loglevel=info

  # Flower لمراقبة Celery
  flower:
    build: .
    container_name: tony_erp_flower
    restart: unless-stopped
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      - redis
    command: celery -A accountant_pro flower --port=5555

  # Prometheus للمراقبة
  prometheus:
    image: prom/prometheus:latest
    container_name: tony_erp_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      - web
    profiles:
      - monitoring

  # Grafana للمراقبة المرئية
  grafana:
    image: grafana/grafana:latest
    container_name: tony_erp_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin123}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    profiles:
      - monitoring

  # Nginx (اختياري للإنتاج)
  nginx:
    image: nginx:alpine
    container_name: tony_erp_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/docker.conf:/etc/nginx/nginx.conf
      - ./staticfiles:/var/www/static
      - ./media:/var/www/media
    depends_on:
      - web
    profiles:
      - production

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  default:
    driver: bridge