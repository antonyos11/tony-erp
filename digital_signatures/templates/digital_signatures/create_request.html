{% extends 'base.html' %}
{% load static %}

{% block title %}طلب توقيع جديد{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0">
                        <i class="fas fa-file-signature"></i> طلب توقيع جديد
                    </h5>
                </div>
                <div class="card-body">
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label">العنوان *</label>
                            <input type="text" name="title" class="form-control" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">الوصف</label>
                            <textarea name="description" class="form-control" rows="3"></textarea>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">المستند *</label>
                            <input type="file" name="document" class="form-control" accept=".pdf,.doc,.docx" required>
                            <small class="text-muted">PDF, DOC, DOCX</small>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">الأولوية</label>
                            <select name="priority" class="form-select">
                                <option value="low">منخفضة</option>
                                <option value="normal" selected>عادية</option>
                                <option value="high">عالية</option>
                                <option value="urgent">عاجلة</option>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">رسالة للموقعين</label>
                            <textarea name="message" class="form-control" rows="2"></textarea>
                        </div>
                        
                        <!-- الموقعون -->
                        <div class="mb-4">
                            <label class="form-label">الموقعون *</label>
                            <div id="signers-container">
                                <div class="input-group mb-2 signer-row">
                                    <span class="input-group-text">1</span>
                                    <input type="email" name="signers[]" class="form-control" 
                                           placeholder="البريد الإلكتروني" required>
                                    <button type="button" class="btn btn-outline-danger remove-signer" disabled>
                                        <i class="fas fa-times"></i>
                                    </button>
                                </div>
                            </div>
                            <button type="button" class="btn btn-sm btn-outline-primary" onclick="addSigner()">
                                <i class="fas fa-plus"></i> إضافة موقع
                            </button>
                        </div>
                        
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-paper-plane"></i> إرسال للتوقيع
                            </button>
                            <a href="{% url 'digital_signatures:dashboard' %}" class="btn btn-outline-secondary">إلغاء</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let signerCount = 1;

function addSigner() {
    signerCount++;
    const container = document.getElementById('signers-container');
    const row = document.createElement('div');
    row.className = 'input-group mb-2 signer-row';
    row.innerHTML = `
        <span class="input-group-text">${signerCount}</span>
        <input type="email" name="signers[]" class="form-control" placeholder="البريد الإلكتروني" required>
        <button type="button" class="btn btn-outline-danger remove-signer" onclick="removeSigner(this)">
            <i class="fas fa-times"></i>
        </button>
    `;
    container.appendChild(row);
    updateRemoveButtons();
}

function removeSigner(btn) {
    btn.closest('.signer-row').remove();
    updateNumbers();
    updateRemoveButtons();
}

function updateNumbers() {
    document.querySelectorAll('.signer-row').forEach((row, index) => {
        row.querySelector('.input-group-text').textContent = index + 1;
    });
    signerCount = document.querySelectorAll('.signer-row').length;
}

function updateRemoveButtons() {
    const rows = document.querySelectorAll('.signer-row');
    rows.forEach(row => {
        row.querySelector('.remove-signer').disabled = rows.length === 1;
    });
}
</script>
{% endblock %}
