<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8"/>
<style>
  @page {
    size: A4;
    margin: 1.5cm;
    @frame header {
      -pdf-frame-content: header-content;
      top: 0.5cm; left: 1cm; right: 1cm; height: 2.5cm;
    }
    @frame footer {
      -pdf-frame-content: footer-content;
      bottom: 0.5cm; left: 1cm; right: 1cm; height: 1cm;
    }
  }
  body { font-family: 'Arial', 'Helvetica', sans-serif; font-size: 10pt; direction: rtl; color: #222; }
  #header-content { text-align: center; border-bottom: 2px solid #1F3864; padding-bottom: 5px; }
  #header-content h1 { font-size: 14pt; color: #1F3864; margin: 0; }
  #header-content p { font-size: 8pt; color: #666; margin: 2px 0; }
  #footer-content { text-align: center; font-size: 8pt; color: #888; border-top: 1px solid #ccc; padding-top: 3px; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  thead th { background-color: #1F3864; color: white; padding: 7px 5px; text-align: center; font-size: 9pt; border: 1px solid #ccc; }
  tbody tr:nth-child(even) { background-color: #EBF3FB; }
  tbody tr:nth-child(odd)  { background-color: #FFFFFF; }
  tbody td { padding: 6px 5px; text-align: right; font-size: 9pt; border: 1px solid #ddd; }
  .total-row td { font-weight: bold; background-color: #D6E4F7 !important; }
</style>
</head>
<body>
<div id="header-content">
  <h1>RITA ERP — {{ title }}</h1>
  <p>تاريخ التصدير: {{ generated_at }}</p>
</div>
<div id="footer-content">
  RITA ERP — نظام تخطيط موارد الإنتاج | صفحة <pdf:pagenumber/> من <pdf:pagecount/>
</div>

<table>
  <thead>
    <tr>
      <th style="width:40px;">#</th>
      {% for header in headers %}
        <th>{{ header }}</th>
      {% endfor %}
    </tr>
  </thead>
  <tbody>
    {% for row in rows %}
      <tr>
        <td style="text-align:center;">{{ forloop.counter }}</td>
        {% for cell in row %}
          <td>{{ cell }}</td>
        {% endfor %}
      </tr>
    {% empty %}
      <tr><td colspan="{{ headers|length|add:1 }}" style="text-align:center; color:#888;">لا توجد بيانات</td></tr>
    {% endfor %}
  </tbody>
</table>
</body>
</html>
