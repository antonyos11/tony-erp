{% extends 'base.html' %}
{% load static %}

{% block title %}اختصارات لوحة المفاتيح{% endblock %}

{% block extra_css %}
<style>
  .shortcuts-container {
    max-width: 1000px;
    margin: 0 auto;
  }

  .shortcut-category {
    background: white;
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }

  .shortcut-category h3 {
    color: #007bff;
    border-bottom: 2px solid #007bff;
    padding-bottom: 10px;
    margin-bottom: 15px;
  }

  .shortcut-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px;
    border-bottom: 1px solid #eee;
  }

  .shortcut-row:last-child {
    border-bottom: none;
  }

  .shortcut-keys {
    background: #f5f5f5;
    border-radius: 5px;
    padding: 8px 12px;
    font-family: monospace;
    font-weight: bold;
    color: #333;
    min-width: 150px;
    text-align: center;
  }

  .shortcut-action {
    flex: 1;
    margin: 0 20px;
    color: #666;
  }

  .search-box {
    margin: 20px 0;
  }

  .search-box input {
    border: 2px solid #ddd;
    border-radius: 5px;
    padding: 12px;
    font-size: 16px;
    width: 100%;
  }

  .search-box input:focus {
    outline: none;
    border-color: #007bff;
    box-shadow: 0 0 0 3px rgba(0,123,255,0.1);
  }

  .filter-buttons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }

  .filter-buttons button {
    border: 1px solid #ddd;
    background: white;
    padding: 8px 15px;
    border-radius: 5px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .filter-buttons button:hover,
  .filter-buttons button.active {
    background: #007bff;
    color: white;
    border-color: #007bff;
  }

  .print-btn {
    margin: 20px 0;
  }

  .tip-box {
    background: #d4edda;
    border-left: 4px solid #28a745;
    padding: 15px;
    border-radius: 5px;
    margin: 20px 0;
  }
</style>
{% endblock %}

{% block content %}
<div class="shortcuts-container">
  <!-- رأس الصفحة -->
  <div class="mb-4">
    <h1>⌨️ اختصارات لوحة المفاتيح</h1>
    <p class="text-muted">استخدم هذه الاختصارات لتسريع عملك</p>
  </div>

  <!-- نصيحة -->
  <div class="tip-box">
    <strong>💡 نصيحة:</strong> اضغط <kbd>Ctrl+Shift+K</kbd> في أي وقت لعرض هذه الصفحة
  </div>

  <!-- البحث -->
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="ابحث عن اختصار...">
  </div>

  <!-- فلاتر التصنيفات -->
  <div class="filter-buttons">
    <button class="filter-btn active" data-category="all">الكل</button>
    <button class="filter-btn" data-category="global">عامة</button>
    <button class="filter-btn" data-category="forms">نماذج</button>
    <button class="filter-btn" data-category="tables">جداول</button>
    <button class="filter-btn" data-category="pos">نقاط البيع</button>
  </div>

  <!-- زر الطباعة -->
  <div class="text-end print-btn">
    <button class="btn btn-primary" onclick="window.print()">
      <i class="fas fa-print"></i> طباعة
    </button>
  </div>

  <!-- الاختصارات -->
  <div id="shortcutsContainer"></div>
</div>

<script>
const shortcuts = {
  global: [
    { keys: 'Ctrl+Shift+K', action: 'إظهار/إخفاء اختصارات لوحة المفاتيح' },
    { keys: 'Ctrl+/', action: 'البحث السريع' },
    { keys: 'Alt+1', action: 'الذهاب للرئيسية' },
    { keys: 'Alt+S', action: 'الذهاب للمبيعات' },
    { keys: 'Alt+I', action: 'الذهاب للمخزون' },
    { keys: 'Alt+P', action: 'الذهاب للمشتريات' },
    { keys: 'Alt+A', action: 'الذهاب للمحاسبة' },
    { keys: 'Escape', action: 'إغلاق النوافذ المنبثقة' },
  ],
  forms: [
    { keys: 'Ctrl+S', action: 'حفظ' },
    { keys: 'Ctrl+Enter', action: 'حفظ وإغلاق' },
    { keys: 'Tab', action: 'الحقل التالي' },
    { keys: 'Shift+Tab', action: 'الحقل السابق' },
    { keys: 'F2', action: 'تعديل' },
  ],
  tables: [
    { keys: '↑/↓', action: 'التنقل بين الصفوف' },
    { keys: 'Enter', action: 'فتح التفاصيل' },
    { keys: 'Delete', action: 'حذف (إذا مسموح)' },
    { keys: 'Ctrl+A', action: 'تحديد الكل' },
    { keys: 'Ctrl+C', action: 'نسخ' },
  ],
  pos: [
    { keys: 'F1', action: 'بحث منتج' },
    { keys: 'F4', action: 'فتح الآلة الحاسبة' },
    { keys: 'F8', action: 'تعليق الفاتورة' },
    { keys: 'F12', action: 'إنهاء البيع' },
    { keys: 'Ctrl+P', action: 'طباعة' },
  ]
};

const categoryNames = {
  global: '🌍 اختصارات عامة',
  forms: '📝 نماذج الإدخال',
  tables: '📊 الجداول',
  pos: '🛒 نقاط البيع'
};

let currentFilter = 'all';

function renderShortcuts(filter = 'all') {
  const container = document.getElementById('shortcutsContainer');
  container.innerHTML = '';

  const categoriesToShow = filter === 'all' ? Object.keys(shortcuts) : [filter];

  categoriesToShow.forEach(category => {
    const categoryDiv = document.createElement('div');
    categoryDiv.className = 'shortcut-category';

    let html = `<h3>${categoryNames[category] || category}</h3>`;

    shortcuts[category].forEach(shortcut => {
      html += `
        <div class="shortcut-row shortcut-item" data-keys="${shortcut.keys}" data-action="${shortcut.action}">
          <div class="shortcut-keys">${shortcut.keys}</div>
          <div class="shortcut-action">${shortcut.action}</div>
        </div>
      `;
    });

    categoryDiv.innerHTML = html;
    container.appendChild(categoryDiv);
  });
}

function filterShortcuts(query) {
  const items = document.querySelectorAll('.shortcut-item');
  let visibleCount = 0;

  items.forEach(item => {
    const keys = item.dataset.keys.toLowerCase();
    const action = item.dataset.action.toLowerCase();
    const matches = keys.includes(query) || action.includes(query);

    item.style.display = matches ? '' : 'none';
    if (matches) visibleCount++;
  });

  if (visibleCount === 0) {
    const container = document.getElementById('shortcutsContainer');
    container.innerHTML += '<div class="alert alert-info">لا توجد نتائج</div>';
  }
}

// حدث البحث
document.getElementById('searchInput').addEventListener('input', function() {
  const query = this.value.toLowerCase();
  if (query === '') {
    renderShortcuts(currentFilter);
  } else {
    renderShortcuts('all');
    filterShortcuts(query);
  }
});

// حدث الفلاتر
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    currentFilter = this.dataset.category;
    renderShortcuts(currentFilter);
    document.getElementById('searchInput').value = '';
  });
});

// تحميل البيانات عند فتح الصفحة
renderShortcuts();

// اختصار لوحة المفاتيح Ctrl+Shift+K
document.addEventListener('keydown', function(e) {
  if (e.ctrlKey && e.shiftKey && e.key === 'K') {
    e.preventDefault();
    // يمكن فتح هذه الصفحة في نافذة منبثقة
    window.location.href = '/dashboard/shortcuts/';
  }
});
</script>
{% endblock %}
