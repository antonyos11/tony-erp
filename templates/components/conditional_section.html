{% comment %}
Conditional Section Component
قسم يظهر أو يختفي حسب الصلاحيات
{% endcomment %}

{% if can_view %}
<div class="card section-{{ section_id }}" id="section-{{ section_id }}">
    <div class="card-header">
        <h5>{{ title }}</h5>
    </div>
    <div class="card-body">
        {{ content }}
    </div>
</div>
{% endif %}
