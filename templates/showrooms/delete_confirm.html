{% extends 'base_v2.html' %}
{% load static %}
{% block title %}تأكيد الحذف{% endblock %}
{% block extra_css %}
<style>
    .confirm-card{max-width:500px;margin:80px auto;background:#fff;border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,.1);overflow:hidden}
    .confirm-header{background:linear-gradient(135deg,#ff416c,#ff4b2b);color:#fff;padding:30px;text-align:center}
    .confirm-body{padding:30px;text-align:center}
    .warning-icon{font-size:4rem;color:#ff4b2b;margin-bottom:20px}
</style>
{% endblock %}
{% block content %}
<div class="confirm-card">
    <div class="confirm-header"><h3><i class="bi bi-exclamation-triangle me-2"></i>تأكيد الحذف</h3></div>
    <div class="confirm-body">
        <div class="warning-icon"><i class="bi bi-trash3"></i></div>
        <h5>هل أنت متأكد من حذف هذا العنصر؟</h5>
        <p class="text-muted">لا يمكن التراجع عن هذا الإجراء</p>
        <div class="d-flex gap-3 justify-content-center mt-4">
            <a href="javascript:history.back()" class="btn btn-secondary px-4">إلغاء</a>
            <form method="post" style="display:inline">{% csrf_token %}<button type="submit" class="btn btn-danger px-4">حذف</button></form>
        </div>
    </div>
</div>
{% endblock %}
