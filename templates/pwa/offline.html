<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563eb">
    <title>غير متصل - Tony ERP</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/pwa/mobile-first.css' %}">
    <style>
        body {
            margin: 0;
            font-family: 'Tajawal', 'Cairo', sans-serif;
            background: var(--pwa-bg);
            color: var(--pwa-text);
            direction: rtl;
        }
        .offline-wrap {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
        .offline-icon { font-size: 5rem; margin-bottom: 20px; animation: pulse 2s infinite; }
        .offline-title { font-size: 1.8rem; font-weight: 700; margin-bottom: 12px; }
        .offline-msg { color: var(--pwa-text-muted); font-size: 1rem; max-width: 340px; margin-bottom: 28px; line-height: 1.7; }
        .btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 12px 28px; border-radius: 8px; font-size: 1rem;
            font-weight: 600; cursor: pointer; border: none;
            text-decoration: none; transition: all .2s; margin: 6px;
            font-family: inherit;
            min-height: 44px;
        }
        .btn-primary { background: #2563eb; color: #fff; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-secondary { background: var(--pwa-border); color: var(--pwa-text); }
        .cached-list { margin-top: 36px; width: 100%; max-width: 380px; text-align: right; }
        .cached-list h3 { font-size: .9rem; color: var(--pwa-text-muted); margin-bottom: 12px; }
        .cached-link {
            display: flex; align-items: center; gap: 12px;
            padding: 13px 16px; background: var(--pwa-surface);
            border-radius: 8px; margin-bottom: 8px;
            color: var(--pwa-text); text-decoration: none;
            box-shadow: 0 1px 3px rgba(0,0,0,.08);
            transition: all .2s;
        }
        .cached-link:hover { background: #2563eb; color: #fff; }
        .cached-link span { font-size: 1.2rem; }
        .reconnected {
            position: fixed; top: 0; left: 0; right: 0;
            padding: 10px; background: #16a34a; color: #fff;
            text-align: center; font-weight: 600; font-size: .9rem;
            transform: translateY(-100%); transition: transform .3s;
            z-index: 999;
        }
        .reconnected.show { transform: translateY(0); }
        @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.4 } }
    </style>
</head>
<body>

<div class="reconnected" id="reconnected-banner">✅ تم استعادة الاتصال! جاري التحديث...</div>

<div class="offline-wrap">
    <div class="offline-icon">📡</div>
    <h1 class="offline-title">لا يوجد اتصال بالإنترنت</h1>
    <p class="offline-msg">تحقق من اتصالك بالإنترنت أو شبكة Wi-Fi وأعد المحاولة.</p>

    <div>
        <button class="btn btn-primary" id="retry-btn" onclick="retryNow()">🔄 إعادة المحاولة</button>
        <button class="btn btn-secondary" onclick="history.back()">← رجوع</button>
    </div>

    <div class="cached-list">
        <h3>📱 الصفحات المتاحة بدون إنترنت</h3>
        <a href="/" class="cached-link"><span>🏠</span> الصفحة الرئيسية</a>
        <a href="/inventory/" class="cached-link"><span>📦</span> المخزون</a>
        <a href="/sales/" class="cached-link"><span>💼</span> المبيعات</a>
        <a href="/purchases/" class="cached-link"><span>🛒</span> المشتريات</a>
        <a href="/hr/" class="cached-link"><span>👥</span> الموارد البشرية</a>
        <a href="/reports/" class="cached-link"><span>📊</span> التقارير</a>
    </div>
</div>

<script>
    async function retryNow() {
        const btn = document.getElementById('retry-btn');
        btn.disabled = true;
        btn.innerHTML = '<span class="pwa-spinner"></span> جاري الفحص...';

        try {
            await fetch('/health/', { method: 'HEAD', cache: 'no-store' });
            showReconnected();
        } catch {
            btn.disabled = false;
            btn.textContent = '🔄 إعادة المحاولة';
            if ('vibrate' in navigator) navigator.vibrate([80, 40, 80]);
        }
    }

    function showReconnected() {
        document.getElementById('reconnected-banner').classList.add('show');
        setTimeout(() => window.location.replace(
            document.referrer || '/'
        ), 1500);
    }

    window.addEventListener('online', () => {
        fetch('/health/', { method: 'HEAD', cache: 'no-store' })
            .then(showReconnected).catch(() => {});
    });

    // فحص تلقائي كل 8 ثوانٍ
    setInterval(() => {
        if (navigator.onLine) {
            fetch('/health/', { method: 'HEAD', cache: 'no-store' })
                .then(showReconnected).catch(() => {});
        }
    }, 8000);
</script>
</body>
</html>
