{% extends "base.html" %}
{% load i18n %}
{% load static %}

{% block title %}إنشاء قائمة مواد جديدة{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header">
                    <h5 class="mb-0">
                        <i class="bi bi-plus-circle me-2"></i>
                        {{ page_title }}
                    </h5>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label">المنتج <span class="text-danger">*</span></label>
                            <select name="product" class="form-select" required>
                                <option value="">-- اختر المنتج --</option>
                                {% for product in products %}
                                <option value="{{ product.id }}">{{ product.name }} ({{ product.sku|default:"-" }})</option>
                                {% endfor %}
                            </select>
                            <div class="form-text">اختر المنتج النهائي الذي تريد إنشاء قائمة مواد له</div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">ملاحظات</label>
                            <textarea name="notes" class="form-control" rows="3" 
                                      placeholder="ملاحظات إضافية..."></textarea>
                        </div>
                        
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg me-1"></i>
                                إنشاء قائمة المواد
                            </button>
                            <a href="{% url 'inventory:bom_list' %}" class="btn btn-secondary">
                                إلغاء
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
