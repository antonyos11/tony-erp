{% extends 'base_v2.html' %}
{% block extra_css %}
<style>
    .confirm-card { background: white; border-radius: 12px; padding: 40px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); max-width: 500px; margin: 0 auto; text-align: center; }
    .warning-icon { font-size: 48px; color: #dc3545; }
</style>
{% endblock %}
{% block content %}
<div class="container-fluid">
    <div class="confirm-card">
        <div class="warning-icon mb-3"><i class="bi bi-trash"></i></div>
        <h5 class="mb-3">{{ page_title }}</h5>
        <p class="text-muted">هل أنت متأكد من حذف <strong>{{ object_name }}</strong>؟</p>
        <p class="text-danger small">هذا الإجراء لا يمكن التراجع عنه.</p>
        <form method="post" class="mt-4">
            {% csrf_token %}
            <div class="d-flex gap-2 justify-content-center">
                <button type="submit" class="btn btn-danger px-4"><i class="bi bi-trash me-1"></i>حذف</button>
                <a href="{{ cancel_url }}" class="btn btn-light px-4">إلغاء</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
