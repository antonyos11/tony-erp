{% extends BASE_TEMPLATE %}
{% block content %}
<h2>{{ title }}</h2>
<p><a class="btn btn-primary" href="{% url 'inventory:count_create' %}">جلسة جرد جديدة</a></p>
<table class="table table-striped">
  <thead>
    <tr><th>الرقم</th><th>الموقع</th><th>التاريخ</th><th>الحالة</th><th></th></tr>
  </thead>
  <tbody>
  {% for r in items %}
  <tr>
    <td>{{ r.number }}</td>
    <td>{{ r.location }}</td>
    <td>{{ r.count_date }}</td>
    <td>{{ r.get_status_display }}</td>
    <td><a href="{% url 'inventory:count_detail' r.id %}">فتح</a></td>
  </tr>
  {% empty %}
  <tr><td colspan="5">لا توجد جلسات</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
