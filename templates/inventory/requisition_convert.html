{% extends BASE_TEMPLATE %}
{% block content %}
<h2>{{ title }}</h2>
<p class="text-muted">اختر مخزن الصرف وخيارات التحويل، ثم أنشئ إذن الصرف كمسودة.</p>
<form method="post" class="row g-3">{% csrf_token %}
  <div class="col-md-6">
    <label class="form-label">المخزن</label>
    <select name="location" class="form-select" required>
      {% for loc in locations %}
      <option value="{{ loc.id }}">{{ loc.code }} - {{ loc.name }}{% if loc.is_default %} (افتراضي){% endif %}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-3">
    <label class="form-label">طريقة التخصيص</label>
    <select name="allocation_method" class="form-select">
      <option value="fifo">FIFO</option>
      <option value="lifo">LIFO</option>
    </select>
  </div>
  <div class="col-md-3">
    <label class="form-label">اسم المستلم (اختياري)</label>
    <input type="text" name="received_by_name" class="form-control" />
  </div>
  <div class="col-12">
    <button class="btn btn-warning" type="submit">إنشاء إذن الصرف</button>
    <a class="btn btn-outline-secondary" href="{% url 'inventory:requisition_detail' requisition.id %}">عودة</a>
  </div>
</form>

<hr/>
<h5 class="mt-3">بنود الطلب</h5>
<table class="table table-sm">
  <thead><tr><th>المنتج</th><th>الكمية</th></tr></thead>
  <tbody>
    {% for i in requisition.items.all %}
    <tr><td>{{ i.product }}</td><td>{{ i.quantity }}</td></tr>
    {% empty %}
    <tr><td colspan="2">لا توجد بنود</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
