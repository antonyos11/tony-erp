{% load static %}
<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <title>طباعة ملصق {{ product.sku }}</title>
  <style>
    @page {
      size: var(--label-w, 50mm) var(--label-h, 30mm);
      margin: 0;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #fff;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .label-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2mm;
    }
    .label-wrapper img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      image-rendering: optimizeQuality;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
  </style>
</head>
<body style="--label-w: { label_width_mm|default:50 }}mm; --label-h: { label_height_mm|default:30 }mm;" onload="window.print(); setTimeout(() => window.close(), 600);">
  <div class="label-wrapper">
    <img src="{{ label_image }}" alt="{ product.name }">
  </div>
</body>
</html>
