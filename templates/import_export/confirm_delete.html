{% extends BASE_TEMPLATE %}
{% load i18n %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">
            <i class="bi bi-exclamation-triangle text-warning me-2"></i>
            {{ title }}
        </h1>
        <a href="{{ request.META.HTTP_REFERER|default:'/' }}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-right me-1"></i> {% trans "إلغاء" %}
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body text-center py-5">
            <i class="bi bi-trash display-1 text-danger mb-3"></i>
            <h4>{% trans "هل أنت متأكد من الحذف؟" %}</h4>
            <p class="text-muted mb-4">
                {% trans "سيتم حذف" %}: <strong>{{ object }}</strong>
            </p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger btn-lg">
                    <i class="bi bi-trash me-1"></i> {% trans "نعم، احذف" %}
                </button>
                <a href="{{ request.META.HTTP_REFERER|default:'/' }}" class="btn btn-secondary btn-lg ms-2">
                    {% trans "إلغاء" %}
                </a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
