{% extends BASE_TEMPLATE %}
{% block title %}تقارير CRM{% endblock %}
{% block content %}
<div class="container-fluid py-3">
  <h2 class="mb-3"><i class="bi bi-bar-chart-line me-2"></i>تقارير CRM</h2>
  <div class="row g-3">
    {% for r in reports %}
    <div class="col-md-6 col-lg-4">
      <div class="card h-100">
        <div class="card-body d-flex flex-column">
          <div class="d-flex align-items-center mb-2">
            <i class="bi {{ r.icon }} fs-4 text-primary ms-2"></i>
            <h5 class="card-title mb-0">{{ r.name }}</h5>
          </div>
          <p class="text-muted small">—</p>
          <div class="mt-auto">
            <a href="{% url r.url %}" class="btn btn-outline-primary">فتح التقرير</a>
          </div>
        </div>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
