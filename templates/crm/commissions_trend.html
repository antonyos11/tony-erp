{% extends BASE_TEMPLATE %}
{% block title %}اتجاه العمولات{% endblock %}
{% block content %}
<div class="container-fluid py-3">
  <h2 class="mb-3"><i class="bi bi-graph-up-arrow me-2"></i>اتجاه العمولات شهرياً</h2>

  <form method="get" class="row g-3 align-items-end mb-3">
    <div class="col-md-3">
      <label class="form-label">من تاريخ</label>
      <input type="date" class="form-control" name="start" value="{{ start }}">
    </div>
    <div class="col-md-3">
      <label class="form-label">إلى تاريخ</label>
      <input type="date" class="form-control" name="end" value="{{ end }}">
    </div>
    <div class="col-md-3">
      <button class="btn btn-primary w-100" type="submit">تطبيق</button>
    </div>
    <div class="col-md-3">
      <a class="btn btn-outline-secondary w-100" href="?{% if start %}start={{ start }}&{% endif %}{% if end %}end={{ end }}&{% endif %}export=csv">تصدير CSV</a>
    </div>
  </form>

  <div class="card">
    <div class="card-body">
      <canvas id="commissionsTrend" height="120"></canvas>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  (function(){
    const labels = {{ labels|safe }};
    const datasets = {{ datasets|safe }};
    const ctx = document.getElementById('commissionsTrend');
    if (ctx) {
      new Chart(ctx, {
        type: 'bar',
        data: { labels, datasets },
        options: {
          responsive: true,
          interaction: { mode: 'index', intersect: false },
          scales: { y: { beginAtZero: true } },
          plugins: { legend: { position: 'bottom' } }
        }
      });
    }
  })();
</script>
{% endblock %}
