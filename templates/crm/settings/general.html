{% extends BASE_TEMPLATE %}
{% load static %}

{% block title %}الإعدادات العامة{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row mb-4">
        <div class="col-12">
            <h4 class="mb-0"><i class="fas fa-cog text-primary"></i> الإعدادات العامة</h4>
        </div>
    </div>
    
    <form method="post">
        {% csrf_token %}
        <div class="row">
            <div class="col-md-6">
                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-header bg-transparent">
                        <h6 class="mb-0"><i class="fas fa-building text-primary"></i> معلومات الشركة</h6>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="company_name" class="form-label">اسم الشركة</label>
                            <input type="text" class="form-control" id="company_name" name="company_name" 
                                   value="{{ settings.company_name|default:'' }}">
                        </div>
                        <div class="mb-3">
                            <label for="company_phone" class="form-label">رقم الهاتف</label>
                            <input type="text" class="form-control" id="company_phone" name="company_phone" 
                                   value="{{ settings.company_phone|default:'' }}">
                        </div>
                        <div class="mb-3">
                            <label for="company_email" class="form-label">البريد الإلكتروني</label>
                            <input type="email" class="form-control" id="company_email" name="company_email" 
                                   value="{{ settings.company_email|default:'' }}">
                        </div>
                        <div class="mb-3">
                            <label for="company_address" class="form-label">العنوان</label>
                            <textarea class="form-control" id="company_address" name="company_address" rows="2">{{ settings.company_address|default:'' }}</textarea>
                        </div>
                    </div>
                </div>
                
                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-header bg-transparent">
                        <h6 class="mb-0"><i class="fas fa-bell text-warning"></i> إعدادات التنبيهات</h6>
                    </div>
                    <div class="card-body">
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="notify_new_customer" name="notify_new_customer" 
                                   {% if settings.notify_new_customer %}checked{% endif %}>
                            <label class="form-check-label" for="notify_new_customer">
                                تنبيه عند إضافة عميل جديد
                            </label>
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="notify_followup_due" name="notify_followup_due" 
                                   {% if settings.notify_followup_due %}checked{% endif %}>
                            <label class="form-check-label" for="notify_followup_due">
                                تنبيه المتابعات المستحقة
                            </label>
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="notify_contract_expiry" name="notify_contract_expiry" 
                                   {% if settings.notify_contract_expiry %}checked{% endif %}>
                            <label class="form-check-label" for="notify_contract_expiry">
                                تنبيه انتهاء العقود
                            </label>
                        </div>
                        <div class="mb-3">
                            <label for="contract_notify_days" class="form-label">أيام التنبيه قبل انتهاء العقد</label>
                            <input type="number" class="form-control" id="contract_notify_days" name="contract_notify_days" 
                                   value="{{ settings.contract_notify_days|default:'30' }}">
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-header bg-transparent">
                        <h6 class="mb-0"><i class="fas fa-users text-info"></i> إعدادات العملاء</h6>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="default_customer_status" class="form-label">الحالة الافتراضية للعميل الجديد</label>
                            <select class="form-select" id="default_customer_status" name="default_customer_status">
                                <option value="potential" {% if settings.default_customer_status == 'potential' %}selected{% endif %}>عميل محتمل</option>
                                <option value="active" {% if settings.default_customer_status == 'active' %}selected{% endif %}>عميل نشط</option>
                            </select>
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="require_customer_phone" name="require_customer_phone" 
                                   {% if settings.require_customer_phone %}checked{% endif %}>
                            <label class="form-check-label" for="require_customer_phone">
                                رقم الهاتف مطلوب
                            </label>
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="require_customer_email" name="require_customer_email" 
                                   {% if settings.require_customer_email %}checked{% endif %}>
                            <label class="form-check-label" for="require_customer_email">
                                البريد الإلكتروني مطلوب
                            </label>
                        </div>
                    </div>
                </div>
                
                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-header bg-transparent">
                        <h6 class="mb-0"><i class="fas fa-tasks text-success"></i> إعدادات المهام</h6>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="default_task_priority" class="form-label">الأولوية الافتراضية</label>
                            <select class="form-select" id="default_task_priority" name="default_task_priority">
                                <option value="low" {% if settings.default_task_priority == 'low' %}selected{% endif %}>منخفضة</option>
                                <option value="medium" {% if settings.default_task_priority == 'medium' %}selected{% endif %}>متوسطة</option>
                                <option value="high" {% if settings.default_task_priority == 'high' %}selected{% endif %}>عالية</option>
                            </select>
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="auto_assign_tasks" name="auto_assign_tasks" 
                                   {% if settings.auto_assign_tasks %}checked{% endif %}>
                            <label class="form-check-label" for="auto_assign_tasks">
                                تعيين المهام تلقائياً
                            </label>
                        </div>
                    </div>
                </div>
                
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-transparent">
                        <h6 class="mb-0"><i class="fas fa-file-contract text-primary"></i> إعدادات العقود</h6>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="contract_number_prefix" class="form-label">بادئة رقم العقد</label>
                            <input type="text" class="form-control" id="contract_number_prefix" name="contract_number_prefix" 
                                   value="{{ settings.contract_number_prefix|default:'CON-' }}">
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="auto_number_contracts" name="auto_number_contracts" 
                                   {% if settings.auto_number_contracts %}checked{% endif %}>
                            <label class="form-check-label" for="auto_number_contracts">
                                ترقيم العقود تلقائياً
                            </label>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row">
            <div class="col-12">
                <div class="d-flex justify-content-end">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> حفظ الإعدادات
                    </button>
                </div>
            </div>
        </div>
    </form>
</div>
{% endblock %}
