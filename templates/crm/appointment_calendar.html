{% extends BASE_TEMPLATE %}
{% load static %}

{% block title %}تقويم المواعيد{% endblock %}

{% block extra_css %}
<link href='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css' rel='stylesheet' />
<style>
    #calendar {
        max-width: 100%;
        margin: 0 auto;
    }
    .fc-event {
        cursor: pointer;
    }
    .status-scheduled { background-color: #17a2b8 !important; border-color: #17a2b8 !important; }
    .status-confirmed { background-color: #0d6efd !important; border-color: #0d6efd !important; }
    .status-completed { background-color: #198754 !important; border-color: #198754 !important; }
    .status-cancelled { background-color: #6c757d !important; border-color: #6c757d !important; }
</style>
{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row mb-4">
        <div class="col-12 d-flex justify-content-between align-items-center">
            <div>
                <h4 class="mb-0"><i class="fas fa-calendar-alt text-primary"></i> تقويم المواعيد</h4>
            </div>
            <div>
                <a href="{% url 'crm:appointment_list' %}" class="btn btn-outline-secondary me-2">
                    <i class="fas fa-list"></i> عرض القائمة
                </a>
                <a href="{% url 'crm:appointment_create' %}" class="btn btn-primary">
                    <i class="fas fa-plus"></i> موعد جديد
                </a>
            </div>
        </div>
    </div>
    
    <div class="card border-0 shadow-sm">
        <div class="card-body">
            <div id="calendar"></div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js'></script>
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales/ar.js'></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    var calendarEl = document.getElementById('calendar');
    var events = {{ events|safe }};
    
    var calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        locale: 'ar',
        direction: 'rtl',
        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek,timeGridDay,listWeek'
        },
        buttonText: {
            today: 'اليوم',
            month: 'شهر',
            week: 'أسبوع',
            day: 'يوم',
            list: 'قائمة'
        },
        events: events,
        eventClick: function(info) {
            window.location.href = '/crm/appointments/' + info.event.id + '/';
        }
    });
    
    calendar.render();
});
</script>
{% endblock %}
