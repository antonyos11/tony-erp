{% extends BASE_TEMPLATE %}

{% block title %}تأكيد حذف النشاط{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="card shadow-sm">
    <div class="card-body">
      <h5 class="mb-3">هل أنت متأكد من حذف النشاط "{{ activity.title }}"؟</h5>
      <form method="post">
        {% csrf_token %}
        <a href="{% url 'crm:activity_detail' activity.pk %}" class="btn btn-secondary">إلغاء</a>
        <button type="submit" class="btn btn-danger">حذف</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
