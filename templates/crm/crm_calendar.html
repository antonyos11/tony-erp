{% extends BASE_TEMPLATE %}
{% load static %}

{% block title %}التقويم{% endblock %}

{% block extra_css %}
<link href='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css' rel='stylesheet' />
<style>
    #calendar {
        max-width: 100%;
        margin: 0 auto;
    }
    .fc-event {
        cursor: pointer;
    }
    .task-pending { background-color: #ffc107 !important; border-color: #ffc107 !important; color: #212529 !important; }
    .task-in_progress { background-color: #17a2b8 !important; border-color: #17a2b8 !important; }
    .task-completed { background-color: #28a745 !important; border-color: #28a745 !important; }
    .appointment-scheduled { background-color: #17a2b8 !important; border-color: #17a2b8 !important; }
    .appointment-confirmed { background-color: #0d6efd !important; border-color: #0d6efd !important; }
    .appointment-completed { background-color: #28a745 !important; border-color: #28a745 !important; }
    .followup-pending { background-color: #fd7e14 !important; border-color: #fd7e14 !important; }
    .followup-completed { background-color: #28a745 !important; border-color: #28a745 !important; }
    
    .legend-item {
        display: inline-flex;
        align-items: center;
        margin-left: 15px;
    }
    .legend-color {
        width: 15px;
        height: 15px;
        border-radius: 3px;
        margin-left: 5px;
    }
</style>
{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row mb-4">
        <div class="col-12 d-flex justify-content-between align-items-center">
            <div>
                <h4 class="mb-0"><i class="fas fa-calendar-alt text-primary"></i> التقويم الشامل</h4>
                <p class="text-muted mb-0">عرض جميع الأحداث في مكان واحد</p>
            </div>
            <div>
                <a href="{% url 'crm:kanban_board' %}" class="btn btn-outline-info">
                    <i class="fas fa-columns"></i> لوحة كانبان
                </a>
            </div>
        </div>
    </div>
    
    <!-- Legend -->
    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body py-2">
            <div class="d-flex flex-wrap align-items-center">
                <span class="text-muted me-3">الدلالات:</span>
                <span class="legend-item">
                    <span class="legend-color" style="background-color: #17a2b8;"></span>
                    <small>المهام</small>
                </span>
                <span class="legend-item">
                    <span class="legend-color" style="background-color: #0d6efd;"></span>
                    <small>المواعيد</small>
                </span>
                <span class="legend-item">
                    <span class="legend-color" style="background-color: #fd7e14;"></span>
                    <small>المتابعات</small>
                </span>
            </div>
        </div>
    </div>
    
    <div class="card border-0 shadow-sm">
        <div class="card-body">
            <div id="calendar"></div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js'></script>
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales/ar.js'></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    var calendarEl = document.getElementById('calendar');
    var events = {{ events|safe }};
    
    var calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        locale: 'ar',
        direction: 'rtl',
        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek,timeGridDay,listWeek'
        },
        buttonText: {
            today: 'اليوم',
            month: 'شهر',
            week: 'أسبوع',
            day: 'يوم',
            list: 'قائمة'
        },
        events: events,
        eventClick: function(info) {
            var id = info.event.id;
            var type = info.event.extendedProps.type;
            var url = '/crm/';
            
            if (type === 'task') {
                url += 'tasks/' + id.replace('task_', '') + '/';
            } else if (type === 'appointment') {
                url += 'appointments/' + id.replace('apt_', '') + '/';
            } else if (type === 'followup') {
                url += 'followups/' + id.replace('followup_', '') + '/';
            }
            
            window.location.href = url;
        }
    });
    
    calendar.render();
});
</script>
{% endblock %}
