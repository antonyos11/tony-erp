{% extends BASE_TEMPLATE %}
{% load static %}

{% block title %}تقويم الأنشطة{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="mb-0"><i class="fas fa-calendar-alt me-2"></i> تقويم الأنشطة</h3>
    <a href="{% url 'crm:activity_create' %}" class="btn btn-success">
      <i class="fas fa-plus me-1"></i> نشاط جديد
    </a>
  </div>

  <div class="card">
    <div class="card-body">
      <pre class="mb-0">{{ calendar_events }}</pre>
      <!-- مبدئياً نعرض JSON، ويمكن لاحقاً ربط FullCalendar -->
    </div>
  </div>
</div>
{% endblock %}
