<!-- Widget لعرض رقم الفاتورة التالي -->
<div class="card border-0 shadow-sm hover-lift">
    <div class="card-header bg-gradient-primary text-white">
        <h6 class="mb-0">
            <i class="fas fa-hashtag me-2"></i>
            رقم الفاتورة التالي
        </h6>
    </div>
    <div class="card-body">
        <div class="row g-2">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center p-2 bg-light rounded">
                    <span class="text-muted small">مبيعات:</span>
                    <span class="badge bg-primary font-monospace" id="nextSalesNumber">...</span>
                </div>
            </div>
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center p-2 bg-light rounded">
                    <span class="text-muted small">ضريبية:</span>
                    <span class="badge bg-success font-monospace" id="nextTaxNumber">...</span>
                </div>
            </div>
        </div>
        <a href="{% url 'sales:next_invoice_numbers' %}" class="btn btn-sm btn-outline-primary w-100 mt-3">
            <i class="fas fa-eye me-1"></i>
            عرض كل الأرقام
        </a>
    </div>
</div>

<script>
// تحميل أرقام الفواتير التالية
fetch('{% url "sales:api_next_invoice_numbers" %}')
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            document.getElementById('nextSalesNumber').textContent = data.next_numbers.sales_invoice;
            document.getElementById('nextTaxNumber').textContent = data.next_numbers.tax_sales;
        }
    })
    .catch(error => console.error('خطأ في تحميل أرقام الفواتير:', error));
</script>

<style>
.hover-lift {
    transition: transform 0.3s ease;
}

.hover-lift:hover {
    transform: translateY(-5px);
}

.bg-gradient-primary {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
}

.font-monospace {
    font-family: 'Courier New', monospace;
    font-size: 0.85rem;
    letter-spacing: 1px;
}
</style>
