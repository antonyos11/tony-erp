{% extends BASE_TEMPLATE %}
{% block title %}تأكيد حذف فاتورة الشراء {{ bill.number }}{% endblock %}
{% block content %}
<div class="container py-4">
  <h1 class="h5 mb-3">تأكيد حذف فاتورة الشراء {{ bill.number }}</h1>
  <div class="alert alert-warning">
    سيتم تنفيذ حذف ناعم مع حفظ السبب واسم الموافق وتاريخه. يلزم موافقة المدير المالي/المدير العام.
  </div>
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">سبب الحذف</label>
      <textarea name="delete_reason" class="form-control" rows="3" required minlength="3" placeholder="اذكر سبباً واضحاً"></textarea>
    </div>
    <div class="mb-3">
      <label class="form-label">كلمة مرور الموافقة</label>
      <input type="password" name="confirm_password" class="form-control" required>
    </div>
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-danger"><i class="bi bi-trash"></i> تأكيد الحذف</button>
      <a href="{% url 'purchases:purchase_detail' bill.pk %}" class="btn btn-secondary">رجوع</a>
    </div>
  </form>
</div>
{% endblock %}
