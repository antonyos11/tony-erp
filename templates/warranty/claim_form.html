{% extends "base.html" %}
{% block title %}مطالبة ضمان — RITA ERP{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="mb-0"><i class="bi bi-exclamation-triangle me-2 text-warning"></i>تسجيل مطالبة ضمان</h4>
    <a href="{% url 'warranty:warranty_search' %}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-right me-1"></i>العودة
    </a>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">بطاقة الضمان <span class="text-danger">*</span></label>
                    {{ form.warranty }}
                </div>
                <div class="col-md-3">
                    <label class="form-label">تاريخ المطالبة <span class="text-danger">*</span></label>
                    {{ form.claim_date }}
                </div>
                <div class="col-md-3">
                    <label class="form-label">الحالة</label>
                    {{ form.status }}
                </div>
                <div class="col-12">
                    <label class="form-label">وصف المشكلة <span class="text-danger">*</span></label>
                    {{ form.issue_description }}
                </div>
                <div class="col-12">
                    <label class="form-label">الحل</label>
                    {{ form.resolution }}
                </div>
            </div>
            <div class="mt-4">
                <button type="submit" class="btn btn-warning">
                    <i class="bi bi-check-circle me-1"></i>حفظ المطالبة
                </button>
                <a href="{% url 'warranty:warranty_search' %}" class="btn btn-outline-secondary ms-2">إلغاء</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
