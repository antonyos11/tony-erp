<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tony ERP - خطأ في السيرفر</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            padding: 40px;
            max-width: 600px;
        }
        .error-code {
            font-size: 120px;
            font-weight: 700;
            color: #e94560;
            line-height: 1;
            margin-bottom: 10px;
        }
        .error-msg {
            font-size: 24px;
            margin-bottom: 20px;
            color: #ccc;
        }
        .error-detail {
            font-size: 16px;
            color: #888;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: #e94560;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            margin: 5px;
            transition: all 0.3s;
        }
        .btn:hover { background: #c0392b; transform: translateY(-2px); }
        .btn-outline {
            background: transparent;
            border: 2px solid #e94560;
        }
        .btn-outline:hover { background: #e94560; }
        .logo { font-size: 32px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Tony ERP</div>
        <div class="error-code">500</div>
        <div class="error-msg">حدث خطأ في السيرفر</div>
        <div class="error-detail">
            فريقنا التقني تم إبلاغه تلقائياً وسيتم إصلاح المشكلة في أقرب وقت.<br>
            يمكنك المحاولة مرة أخرى بعد لحظات.
        </div>
        <a href="/" class="btn">الصفحة الرئيسية</a>
        <a href="javascript:location.reload()" class="btn btn-outline">إعادة المحاولة</a>
    </div>
</body>
</html>
