<div id="globalToasts" aria-live="polite" aria-atomic="true"></div>
<script>
(function(){
  window.showToast = function(message, variant){
    variant = variant || 'info';
    var container = document.getElementById('globalToasts');
    if(!container) return;
    var id = 't'+Date.now();
    var html = '<div class="toast align-items-center text-bg-'+variant+' border-0 show" id="'+id+'" role="alert" aria-live="assertive" aria-atomic="true">'+
      '<div class="d-flex">'+
        '<div class="toast-body small">'+message+'</div>'+
        '<button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>'+
      '</div></div>';
    container.insertAdjacentHTML('beforeend', html);
    setTimeout(function(){ var el=document.getElementById(id); if(el){ var t=new bootstrap.Toast(el,{delay:4000}); t.show(); } },30);
  };
})();
</script>
