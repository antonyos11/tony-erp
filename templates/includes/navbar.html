{% load i18n tony_erb_tags %}
<nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom small" aria-label="Main navigation">
  <div class="container-fluid">
    <button class="btn btn-outline-secondary btn-sm me-2 d-lg-none" id="sidebarToggle2" aria-label="Toggle sidebar"><i class="bi bi-list"></i></button>
    <a class="navbar-brand fw-semibold" href="/">{{ SYSTEM_NAME }}</a>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        {% block navbar_extra_links %}{% endblock %}
      </ul>
      <ul class="navbar-nav ms-auto align-items-center gap-2">
        <li class="nav-item">
          <button id="themeToggle2" class="btn btn-sm btn-outline-primary rounded-pill" type="button" aria-label="Toggle Theme"><i class="bi bi-moon-stars" id="themeIcon2"></i></button>
        </li>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false"><i class="bi bi-translate"></i></a>
          <ul class="dropdown-menu dropdown-menu-end">
            <li>
              <form method="post" action="/i18n/setlang/" class="px-3 py-1">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ request.path }}">
                <button name="language" value="ar" class="dropdown-item{% if LANGUAGE_CODE == 'ar' %} active{% endif %}" type="submit">{% trans 'العربية' %}</button>
                <button name="language" value="en" class="dropdown-item{% if LANGUAGE_CODE == 'en' %} active{% endif %}" type="submit">{% trans 'English' %}</button>
              </form>
            </li>
          </ul>
        </li>
        {% user_menu %}
      </ul>
    </div>
  </div>
</nav>
