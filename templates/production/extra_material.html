{% extends 'base.html' %}
{% block title %}مواد إضافية — أمر الإنتاج {{ order.order_number }} — RITA ERP{% endblock %}
{% block breadcrumb_items %}
<li class="breadcrumb-item active">مواد إضافية</li>
{% endblock %}
{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold"><i class="bi bi-plus-square me-2 text-warning"></i>مواد إضافية — {{ order.order_number }}</h4>
    </div>
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3"><label class="form-label fw-semibold">المادة الخام <span class="text-danger">*</span></label><select name="material_id" class="form-select" required>{% for m in materials %}<option value="{{ m.pk }}">{{ m.name }}</option>{% endfor %}</select></div>
                        <div class="mb-3"><label class="form-label fw-semibold">الكمية <span class="text-danger">*</span></label><input type="number" name="quantity" class="form-control" step="0.01" min="0.01" required></div>
                        <div class="mb-4"><label class="form-label fw-semibold">السبب</label><textarea name="reason" class="form-control" rows="2"></textarea></div>
                        <div class="d-flex gap-2 justify-content-end">
                            <a href="javascript:history.back()" class="btn btn-outline-secondary">إلغاء</a>
                            <button type="submit" class="btn btn-warning fw-bold">إضافة المواد</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
