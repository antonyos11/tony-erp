{% extends 'base_v2.html' %}
{% load static %}
{% block title %}التحقق من الضمان{% endblock %}
{% block extra_css %}
<style>
    .verify-container{max-width:600px;margin:50px auto}
    .search-card{background:#fff;border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,.1);padding:30px;margin-bottom:30px}
    .result-card{background:#fff;border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,.1);overflow:hidden}
    .result-header{padding:25px;text-align:center}
    .result-header.valid{background:linear-gradient(135deg,#11998e,#38ef7d);color:#fff}
    .result-header.invalid{background:linear-gradient(135deg,#ff416c,#ff4b2b);color:#fff}
    .result-body{padding:25px}
    .info-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee}.info-row:last-child{border:none}
</style>
{% endblock %}
{% block content %}
<div class="verify-container">
    <div class="search-card">
        <h5 class="mb-3"><i class="bi bi-shield-check me-2"></i>التحقق من ضمان الوحدة</h5>
        <div class="input-group">
            <input type="text" class="form-control form-control-lg" placeholder="أدخل رقم الوحدة أو امسح الباركود">
            <button class="btn btn-primary"><i class="bi bi-search"></i></button>
        </div>
    </div>
    <div class="result-card">
        <div class="result-header valid"><i class="bi bi-check-circle" style="font-size:3rem"></i><h4 class="mt-2 mb-0">الضمان ساري</h4></div>
        <div class="result-body">
            <div class="info-row"><span>رقم الوحدة</span><strong>UN-2024-001</strong></div>
            <div class="info-row"><span>المنتج</span><strong>منتج A</strong></div>
            <div class="info-row"><span>تاريخ الشراء</span><strong>2024-06-15</strong></div>
            <div class="info-row"><span>انتهاء الضمان</span><strong>2026-06-15</strong></div>
            <div class="info-row"><span>المتبقي</span><strong class="text-success">18 شهر</strong></div>
        </div>
    </div>
</div>
{% endblock %}
