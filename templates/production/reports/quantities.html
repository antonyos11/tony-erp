{% extends 'base_v2.html' %}
{% load static %}
{% block title %}تقرير الكميات{% endblock %}
{% block extra_css %}
<style>
    .hero-section{background:linear-gradient(135deg,#11998e,#38ef7d);color:#fff;padding:40px 0;margin:-24px -24px 30px;border-radius:0 0 30px 30px}
    .data-table{background:#fff;border-radius:20px;box-shadow:0 5px 20px rgba(0,0,0,.08);overflow:hidden}
    .table{margin-bottom:0}.table thead th{background:#f8f9fa;padding:15px;font-weight:600}.table tbody td{padding:15px}
    .qty-produced{color:#28a745;font-weight:600}.qty-target{color:#6c757d}
    .progress{height:8px;border-radius:4px}
</style>
{% endblock %}
{% block content %}
<div class="hero-section">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div><h1><i class="bi bi-box-seam me-2"></i>تقرير الكميات</h1><p class="opacity-75 mb-0">كميات الإنتاج والمستهدفات</p></div>
            <button class="btn btn-light"><i class="bi bi-download me-1"></i>تصدير</button>
        </div>
    </div>
</div>
<div class="container">
    <div class="data-table">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead><tr><th>المنتج</th><th>المستهدف</th><th>المنتج</th><th>نسبة الإنجاز</th></tr></thead>
                <tbody>
                    <tr><td>منتج A</td><td class="qty-target">500</td><td class="qty-produced">485</td><td><div class="progress"><div class="progress-bar bg-success" style="width:97%"></div></div><small>97%</small></td></tr>
                    <tr><td>منتج B</td><td class="qty-target">350</td><td class="qty-produced">350</td><td><div class="progress"><div class="progress-bar bg-success" style="width:100%"></div></div><small>100%</small></td></tr>
                    <tr><td>منتج C</td><td class="qty-target">200</td><td class="qty-produced">165</td><td><div class="progress"><div class="progress-bar bg-warning" style="width:82%"></div></div><small>82%</small></td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
