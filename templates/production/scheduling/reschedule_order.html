{% extends 'base_v2.html' %}
{% load static %}
{% block title %}إعادة جدولة الأمر{% endblock %}
{% block extra_css %}
<style>
    .hero-section{background:linear-gradient(135deg,#ff9a56,#ff6b35);color:#fff;padding:40px 0;margin:-24px -24px 30px;border-radius:0 0 30px 30px}
    .schedule-card{background:#fff;border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,.1);padding:30px;max-width:700px;margin:0 auto}
    .order-info{background:#f8f9fa;border-radius:12px;padding:20px;margin-bottom:25px}
    .timeline{display:flex;justify-content:space-between;margin-bottom:25px}
    .timeline-item{text-align:center;flex:1}
    .timeline-dot{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-weight:600}
    .timeline-dot.old{background:#f8d7da;color:#721c24}.timeline-dot.new{background:#d4edda;color:#155724}
</style>
{% endblock %}
{% block content %}
<div class="hero-section">
    <div class="container">
        <h1><i class="bi bi-calendar-event me-2"></i>إعادة جدولة أمر الإنتاج</h1>
        <p class="opacity-75 mb-0">تعديل موعد تنفيذ الأمر</p>
    </div>
</div>
<div class="container">
    <div class="schedule-card">
        <div class="order-info">
            <div class="d-flex justify-content-between"><span>رقم الأمر</span><strong>PO-2024-045</strong></div>
            <div class="d-flex justify-content-between mt-2"><span>المنتج</span><strong>منتج A - 500 وحدة</strong></div>
        </div>
        <div class="timeline">
            <div class="timeline-item"><div class="timeline-dot old">قديم</div><small class="text-muted">25 ديسمبر</small></div>
            <div class="timeline-item"><i class="bi bi-arrow-left" style="font-size:2rem;color:#6c757d"></i></div>
            <div class="timeline-item"><div class="timeline-dot new">جديد</div><small class="text-muted">30 ديسمبر</small></div>
        </div>
        <div class="mb-3"><label class="form-label">التاريخ الجديد</label><input type="date" class="form-control" value="2024-12-30"></div>
        <div class="mb-3"><label class="form-label">سبب التأجيل</label><select class="form-select"><option>نقص مواد</option><option>عطل آلة</option><option>طلب العميل</option><option>أخرى</option></select></div>
        <div class="mb-3"><label class="form-label">ملاحظات</label><textarea class="form-control" rows="3"></textarea></div>
        <div class="d-flex gap-2"><a href="javascript:history.back()" class="btn btn-secondary flex-fill">إلغاء</a><button class="btn btn-warning flex-fill"><i class="bi bi-calendar-check me-1"></i>تأكيد التغيير</button></div>
    </div>
</div>
{% endblock %}
