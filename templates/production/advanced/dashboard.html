{% extends BASE_TEMPLATE %}
{% load i18n %}

{% block title %}لوحة التحكم المتقدمة{% endblock %}

{% block content %}
<div class="container-fluid">
    <h2 class="mb-4"><i class="bi bi-gear-wide-connected me-2"></i>لوحة التحكم المتقدمة</h2>
    <div class="row">
        <div class="col-md-4 mb-4">
            <div class="card bg-primary text-white h-100">
                <div class="card-body text-center">
                    <i class="bi bi-clipboard-data display-4"></i>
                    <h5 class="mt-3">أوامر العمل</h5>
                    <a href="{% url 'production:work_orders_list' %}" class="btn btn-light mt-2">عرض</a>
                </div>
            </div>
        </div>
        <div class="col-md-4 mb-4">
            <div class="card bg-success text-white h-100">
                <div class="card-body text-center">
                    <i class="bi bi-check2-circle display-4"></i>
                    <h5 class="mt-3">مراقبة الجودة</h5>
                    <a href="{% url 'production:quality_control' %}" class="btn btn-light mt-2">عرض</a>
                </div>
            </div>
        </div>
        <div class="col-md-4 mb-4">
            <div class="card bg-info text-white h-100">
                <div class="card-body text-center">
                    <i class="bi bi-graph-up-arrow display-4"></i>
                    <h5 class="mt-3">تحسين الإنتاج</h5>
                    <a href="{% url 'production:optimization' %}" class="btn btn-light mt-2">عرض</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
