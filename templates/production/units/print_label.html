{% extends 'base_v2.html' %}
{% load static %}
{% block title %}طباعة الملصق{% endblock %}
{% block extra_css %}
<style>
    .print-container{max-width:400px;margin:50px auto;background:#fff;border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,.1);padding:30px}
    .label-preview{border:2px dashed #dee2e6;border-radius:12px;padding:20px;margin-bottom:20px;text-align:center}
    .qr-code{width:120px;height:120px;background:#f8f9fa;margin:0 auto 15px;display:flex;align-items:center;justify-content:center;font-size:3rem;color:#6c757d;border-radius:8px}
    .unit-info{text-align:center}
    .unit-number{font-size:1.5rem;font-weight:700;color:#2c3e50}
</style>
{% endblock %}
{% block content %}
<div class="print-container">
    <h5 class="text-center mb-4"><i class="bi bi-printer me-2"></i>طباعة ملصق الوحدة</h5>
    <div class="label-preview">
        <div class="qr-code"><i class="bi bi-qr-code"></i></div>
        <div class="unit-info">
            <div class="unit-number">UN-2024-001</div>
            <p class="text-muted mb-1">منتج A - الإصدار 2.0</p>
            <small class="text-muted">تاريخ الإنتاج: 2024-12-28</small>
        </div>
    </div>
    <div class="mb-3"><label class="form-label">عدد النسخ</label><input type="number" class="form-control" value="1"></div>
    <div class="mb-3"><label class="form-label">حجم الملصق</label><select class="form-select"><option>صغير (5x3 سم)</option><option>متوسط (7x4 سم)</option><option>كبير (10x6 سم)</option></select></div>
    <button class="btn btn-primary w-100"><i class="bi bi-printer me-2"></i>طباعة</button>
</div>
{% endblock %}
