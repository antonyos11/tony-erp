{% load i18n %}
<!-- Widget: أفضل العملاء -->
<div class="card h-100">
    <div class="card-header bg-white py-2">
        <h6 class="mb-0"><i class="bi bi-star text-warning me-1"></i> أفضل العملاء</h6>
    </div>
    <div class="card-body p-0">
        {% if top_customers %}
        <ul class="list-group list-group-flush">
            {% for customer in top_customers %}
            <li class="list-group-item d-flex justify-content-between align-items-center py-2">
                <div>
                    <strong>{{ customer.name }}</strong>
                    <br><small class="text-muted">{{ customer.phone|default:"-" }}</small>
                </div>
                <span class="badge bg-success rounded-pill">{{ customer.total_value|floatformat:0 }}</span>
            </li>
            {% endfor %}
        </ul>
        {% else %}
        <div class="text-center py-4">
            <i class="bi bi-people text-muted"></i>
            <p class="small text-muted mb-0">لا توجد بيانات</p>
        </div>
        {% endif %}
    </div>
</div>
