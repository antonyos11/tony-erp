{% extends BASE_TEMPLATE %}
{% block title %}تأكيد حذف {{ partner.name }}{% endblock %}
{% block content %}
<div class="ds-card u-card mb-3 small">
  <div class="ds-card-header bg-danger text-white d-flex align-items-center gap-2">
    <i class="bi bi-exclamation-triangle"></i>
    <span class="fw-semibold">تأكيد حذف / إلغاء تفعيل الشريك</span>
  </div>
  <div class="ds-card-body">
    <p class="mb-3">هل أنت متأكد من رغبتك في إلغاء تفعيل الشريك <strong>{{ partner.name }}</strong>؟ لن تُحذف البيانات نهائياً ولكن سيصبح غير نشط.</p>
    <form method="post" class="d-flex gap-2">
      {% csrf_token %}
      <button type="submit" class="btn btn-sm btn-danger"><i class="bi bi-trash"></i> نعم، إلغاء التفعيل</button>
      <a href="{% url 'partners:partner_detail' partner.id %}" class="btn btn-sm btn-outline-secondary">رجوع</a>
    </form>
  </div>
</div>
{% endblock %}
