{% extends 'base_v2.html' %}
{% load static %}
{% block title %}رفع مستندات المورد{% endblock %}
{% block extra_css %}
<style>
    .hero-section{background:linear-gradient(135deg,#11998e,#38ef7d);color:#fff;padding:40px 0;margin:-24px -24px 30px;border-radius:0 0 30px 30px}
    .upload-card{background:#fff;border-radius:20px;padding:30px;box-shadow:0 5px 20px rgba(0,0,0,.08);max-width:600px;margin:0 auto}
    .upload-zone{border:2px dashed #dee2e6;border-radius:16px;padding:50px;text-align:center;cursor:pointer;transition:all .3s}.upload-zone:hover{border-color:#11998e;background:#f8f9fa}
    .upload-icon{font-size:3rem;color:#6c757d;margin-bottom:15px}
</style>
{% endblock %}
{% block content %}
<div class="hero-section">
    <div class="container">
        <h1><i class="bi bi-cloud-upload me-2"></i>رفع مستندات المورد</h1>
        <p class="opacity-75 mb-0">إضافة مستندات جديدة للمورد</p>
    </div>
</div>
<div class="container">
    <div class="upload-card">
        <h5 class="mb-4"><i class="bi bi-building me-2"></i>المورد: شركة التوريدات المتحدة</h5>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="mb-3"><label class="form-label">نوع المستند</label><select class="form-select"><option>السجل التجاري</option><option>شهادة الضريبة</option><option>عقد</option><option>أخرى</option></select></div>
            <div class="mb-3"><label class="form-label">الوصف</label><input type="text" class="form-control" placeholder="وصف المستند"></div>
            <div class="upload-zone mb-3"><div class="upload-icon"><i class="bi bi-file-earmark-arrow-up"></i></div><p class="mb-0">اسحب الملف هنا أو انقر للاختيار</p><input type="file" class="d-none"></div>
            <div class="text-end"><button type="submit" class="btn btn-success px-4"><i class="bi bi-upload me-1"></i>رفع المستند</button></div>
        </form>
    </div>
</div>
{% endblock %}
