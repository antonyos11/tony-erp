{% extends BASE_TEMPLATE %}
{% load static i18n %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-1">
                <i class="bi bi-file-earmark-plus"></i> إضافة مستند
            </h2>
            <p class="text-muted mb-0">{{ supplier.name }}</p>
        </div>
        <div>
            <a href="{% url 'partners:partner_edit' supplier.partner.pk %}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-right"></i> رجوع
            </a>
        </div>
    </div>

    <!-- Form -->
    <div class="card">
        <div class="card-body">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="row g-3">
                    <!-- نوع المستند -->
                    <div class="col-md-6">
                        <label class="form-label required">نوع المستند</label>
                        <select name="document_type" class="form-select" required>
                            <option value="">-- اختر نوع المستند --</option>
                            {% for value, label in document_types %}
                            <option value="{{ value }}">{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- رقم المستند -->
                    <div class="col-md-6">
                        <label class="form-label">رقم المستند</label>
                        <input type="text" name="document_number" class="form-control" 
                               placeholder="مثال: 1234567890">
                    </div>

                    <!-- العنوان -->
                    <div class="col-md-12">
                        <label class="form-label">عنوان المستند (اختياري)</label>
                        <input type="text" name="title" class="form-control" 
                               placeholder="مثال: السجل التجاري - الرياض">
                    </div>

                    <!-- تاريخ الإصدار -->
                    <div class="col-md-6">
                        <label class="form-label">تاريخ الإصدار</label>
                        <input type="date" name="issue_date" class="form-control">
                    </div>

                    <!-- تاريخ الانتهاء -->
                    <div class="col-md-6">
                        <label class="form-label">تاريخ الانتهاء</label>
                        <input type="date" name="expiry_date" class="form-control">
                    </div>

                    <!-- الملف -->
                    <div class="col-md-12">
                        <label class="form-label required">الملف</label>
                        <input type="file" name="file" class="form-control" required
                               accept=".pdf,.jpg,.jpeg,.png,.doc,.docx">
                        <small class="text-muted">
                            الصيغ المدعومة: PDF, JPG, PNG, DOC, DOCX (الحد الأقصى: 10 ميجابايت)
                        </small>
                    </div>

                    <!-- ملاحظات -->
                    <div class="col-md-12">
                        <label class="form-label">ملاحظات</label>
                        <textarea name="notes" class="form-control" rows="3" 
                                  placeholder="أي ملاحظات إضافية..."></textarea>
                    </div>
                </div>

                <!-- Buttons -->
                <div class="mt-4 d-flex justify-content-end gap-2">
                    <a href="{% url 'partners:partner_edit' supplier.partner.pk %}" class="btn btn-outline-secondary">
                        <i class="bi bi-x-lg"></i> إلغاء
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg"></i> حفظ المستند
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
.required::after {
    content: ' *';
    color: red;
}
</style>
{% endblock %}
