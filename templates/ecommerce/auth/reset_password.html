{% extends 'ecommerce/store_base_new.html' %}
{% load static %}
{% load i18n %}

{% block title %}{% trans "إعادة تعيين كلمة المرور" %}{% endblock %}

{% block content %}
<div class="container" style="max-width:540px;">
  <div class="card shadow-sm mt-4">
    <div class="card-body p-4">
      <div class="text-center mb-3">
        <div class="rounded-circle bg-warning-subtle text-warning d-inline-flex align-items-center justify-content-center" style="width:56px;height:56px;">
          <i class="bi bi-key fs-4"></i>
        </div>
        <h1 class="h5 mt-2 mb-1">{% trans "إعادة تعيين كلمة المرور" %}</h1>
        <p class="text-muted mb-0">{% trans "أدخل كلمة المرور الجديدة لتأكيد التغيير." %}</p>
      </div>
      <form method="post" class="d-grid gap-3">
        {% csrf_token %}
        <div>
          <label class="form-label">{% trans "كلمة المرور الجديدة" %}</label>
          <input type="password" class="form-control" name="password1" required>
        </div>
        <div>
          <label class="form-label">{% trans "تأكيد كلمة المرور" %}</label>
          <input type="password" class="form-control" name="password2" required>
        </div>
        <button class="btn btn-primary" type="submit"><i class="bi bi-check2-circle"></i> {% trans "حفظ الكلمة الجديدة" %}</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
