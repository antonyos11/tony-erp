{% extends "base.html" %}
{% block title %}إعدادات الإشعارات{% endblock %}

{% block content %}
<div class="container py-3" style="max-width: 600px;">
    <h4 class="mb-4">⚙️ إعدادات الإشعارات</h4>

    {% if messages %}
    {% for msg in messages %}
    <div class="alert alert-success alert-dismissible fade show">{{ msg }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
    {% endfor %}
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="card">
            <div class="card-header fw-bold">التنبيهات التي تريد استقبالها</div>
            <div class="card-body">
                <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" name="stock_alerts" id="stock_alerts" {% if settings.stock_alerts %}checked{% endif %}>
                    <label class="form-check-label" for="stock_alerts">📦 تنبيهات المخزون (مخزون منخفض ونافد)</label>
                </div>
                <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" name="invoice_alerts" id="invoice_alerts" {% if settings.invoice_alerts %}checked{% endif %}>
                    <label class="form-check-label" for="invoice_alerts">🧾 تنبيهات الفواتير (فواتير متأخرة)</label>
                </div>
                <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" name="production_alerts" id="production_alerts" {% if settings.production_alerts %}checked{% endif %}>
                    <label class="form-check-label" for="production_alerts">🏭 تنبيهات الإنتاج (أوامر متأخرة)</label>
                </div>
                <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" name="hr_alerts" id="hr_alerts" {% if settings.hr_alerts %}checked{% endif %}>
                    <label class="form-check-label" for="hr_alerts">👤 تنبيهات الموارد البشرية (إجازات وسلف)</label>
                </div>
                <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" name="financial_alerts" id="financial_alerts" {% if settings.financial_alerts %}checked{% endif %}>
                    <label class="form-check-label" for="financial_alerts">💰 تنبيهات مالية (شيكات وأقساط)</label>
                </div>
            </div>
        </div>

        <div class="card mt-3">
            <div class="card-header fw-bold">قنوات الإشعار</div>
            <div class="card-body">
                <div class="form-check form-switch mb-2">
                    <input class="form-check-input" type="checkbox" name="email_notifications" id="email_notifications" {% if settings.email_notifications %}checked{% endif %}>
                    <label class="form-check-label" for="email_notifications">📧 إشعارات بالبريد الإلكتروني</label>
                </div>
            </div>
        </div>

        <div class="mt-3 d-flex gap-2">
            <button type="submit" class="btn btn-primary">💾 حفظ الإعدادات</button>
            <a href="{% url 'notifications:notification_list' %}" class="btn btn-outline-secondary">رجوع</a>
        </div>
    </form>
</div>
{% endblock %}
