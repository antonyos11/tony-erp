{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container-fluid p-3">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-warning text-dark">
                    <h5 class="mb-0">{{ title }}</h5>
                </div>
                <div class="card-body">
                    <div class="alert alert-info mb-3">
                        <strong>المستخدم:</strong> {{ target_user.get_full_name|default:target_user.username }}
                        <br><strong>اسم الدخول:</strong> {{ target_user.username }}
                    </div>
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-bold">كلمة المرور الجديدة *</label>
                            <input type="password" name="new_password" class="form-control"
                                   minlength="8" required placeholder="8 أحرف على الأقل">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">تأكيد كلمة المرور *</label>
                            <input type="password" name="confirm_password" class="form-control" required>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-warning">تغيير كلمة المرور</button>
                            <a href="{% url 'core:user_detail' pk=target_user.pk %}" class="btn btn-secondary">إلغاء</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
