{% extends 'base.html' %}

{% block title %}تغيير كلمة المرور — RITA ERP{% endblock %}

{% block breadcrumb_items %}
<li class="breadcrumb-item"><a href="{% url 'core:my_profile' %}">ملفي الشخصي</a></li>
<li class="breadcrumb-item active">تغيير كلمة المرور</li>
{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-warning text-dark fw-bold">
                    <i class="bi bi-key me-2"></i>تغيير كلمة المرور
                </div>
                <div class="card-body p-4">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold">كلمة المرور الحالية</label>
                            <input type="password" name="old_password" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">كلمة المرور الجديدة</label>
                            <input type="password" name="new_password1" class="form-control" required minlength="8">
                            <div class="form-text">8 أحرف على الأقل</div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">تأكيد كلمة المرور الجديدة</label>
                            <input type="password" name="new_password2" class="form-control" required minlength="8">
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-warning fw-bold">
                                <i class="bi bi-check-lg me-1"></i>حفظ كلمة المرور الجديدة
                            </button>
                            <a href="{% url 'core:my_profile' %}" class="btn btn-outline-secondary">
                                <i class="bi bi-x me-1"></i>إلغاء
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
