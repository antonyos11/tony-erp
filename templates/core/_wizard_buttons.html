{# partial: أزرار التنقل في الويزارد #}
<div class="d-flex justify-content-between mt-4 pt-3 border-top">
  {% if step > 1 %}
  <button type="submit" name="action" value="prev" class="btn btn-outline-secondary px-4">
    <i class="bi bi-arrow-right me-1"></i>السابق
  </button>
  {% else %}
  <div></div>
  {% endif %}

  <button type="submit" name="action" value="next" class="btn btn-primary px-5">
    {% if step == total|add:"-1" %}
      <i class="bi bi-check-lg me-1"></i>إنهاء
    {% else %}
      التالي <i class="bi bi-arrow-left ms-1"></i>
    {% endif %}
  </button>
</div>
