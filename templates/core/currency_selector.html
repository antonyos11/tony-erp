<div class="currency-selector">
    <select class="form-select" onchange="changeCurrency(this.value)">
        {% for currency in currencies %}
            <option value="{{ currency.code }}" {% if currency == current_currency %}selected{% endif %}>
                {{ currency.symbol }} - {{ currency.name }}
            </option>
        {% endfor %}
    </select>
</div>

<script>
function changeCurrency(currencyCode) {
    // يمكن إضافة AJAX هنا لتغيير العملة
    console.log('تغيير العملة إلى:', currencyCode);
}
</script>
