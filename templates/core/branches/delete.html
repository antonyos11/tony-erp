{% extends BASE_TEMPLATE %}
{% load i18n %}

{% block title %}حذف الفرع{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-sm border-danger">
                <div class="card-header bg-danger text-white">
                    <h5 class="mb-0"><i class="bi bi-exclamation-triangle me-2"></i>تأكيد الحذف</h5>
                </div>
                <div class="card-body text-center">
                    <i class="bi bi-building display-1 text-danger mb-3"></i>
                    <h4>هل أنت متأكد من حذف الفرع؟</h4>
                    <p class="text-muted mb-4">{{ branch.name }} ({{ branch.code }})</p>
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-center gap-2">
                            <button type="submit" class="btn btn-danger">
                                <i class="bi bi-trash me-1"></i>نعم، احذف
                            </button>
                            <a href="{% url 'core:branch_list' %}" class="btn btn-secondary">
                                <i class="bi bi-x-lg me-1"></i>إلغاء
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
