{% extends BASE_TEMPLATE %}
{% block title %}تأكيد حذف{% endblock %}
{% block content %}
<div class="container" style="max-width:600px;">
  <h1 class="h5 mb-3">{{ title }}</h1>
  <div class="alert alert-warning">هل أنت متأكد من الحذف؟ هذا الإجراء لا يمكن التراجع عنه.</div>
  <form method="post" class="d-flex gap-2">{% csrf_token %}
    <button class="btn btn-danger btn-sm">نعم، حذف</button>
    <a href="javascript:history.back()" class="btn btn-secondary btn-sm">إلغاء</a>
  </form>
</div>
{% endblock %}
