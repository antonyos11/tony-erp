{% extends 'base.html' %}

{% block title %}تعديل {{ location.name }} - Tony ERP{% endblock %}

{% block page_title %}تعديل {{ location.name }}{% endblock %}

{% block content %}
<form method="post">
    {% csrf_token %}
    
    <div class="row">
        <div class="col-lg-8 mb-4">
            <!-- Basic Info -->
            <div class="card mb-4">
                <div class="card-header">
                    <i class="fas fa-info-circle me-2"></i>البيانات الأساسية
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">الاسم <span class="text-danger">*</span></label>
                            <input type="text" name="name" class="form-control" value="{{ location.name }}" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">الكود <span class="text-danger">*</span></label>
                            <input type="text" name="code" class="form-control" value="{{ location.code }}" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">النوع</label>
                            <select name="branch_type" class="form-select">
                                {% for value, label in branch_types %}
                                <option value="{{ value }}" {% if location.branch_type == value %}selected{% endif %}>{{ label }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">الفرع الرئيسي (اختياري)</label>
                        <select name="parent_branch" class="form-select">
                            <option value="">-- بدون فرع رئيسي --</option>
                            {% for branch in parent_branches %}
                            <option value="{{ branch.pk }}" {% if location.parent_branch_id == branch.pk %}selected{% endif %}>
                                {{ branch.name }} ({{ branch.get_branch_type_display }})
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
            </div>
            
            <!-- Location -->
            <div class="card mb-4">
                <div class="card-header">
                    <i class="fas fa-map-marker-alt me-2"></i>الموقع
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">المدينة</label>
                            <input type="text" name="city" class="form-control" value="{{ location.city }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">المنطقة</label>
                            <input type="text" name="region" class="form-control" value="{{ location.region }}">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">العنوان</label>
                        <textarea name="address" class="form-control" rows="2">{{ location.address }}</textarea>
                    </div>
                </div>
            </div>
            
            <!-- Contact -->
            <div class="card mb-4">
                <div class="card-header">
                    <i class="fas fa-phone me-2"></i>التواصل
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">الهاتف</label>
                            <input type="text" name="phone" class="form-control" value="{{ location.phone }}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">الجوال</label>
                            <input type="text" name="mobile" class="form-control" value="{{ location.mobile }}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">البريد الإلكتروني</label>
                            <input type="email" name="email" class="form-control" value="{{ location.email }}">
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Notes -->
            <div class="card">
                <div class="card-header">
                    <i class="fas fa-sticky-note me-2"></i>ملاحظات
                </div>
                <div class="card-body">
                    <textarea name="notes" class="form-control" rows="3">{{ location.notes }}</textarea>
                </div>
            </div>
        </div>
        
        <!-- Sidebar -->
        <div class="col-lg-4 mb-4">
            <div class="card">
                <div class="card-header">الإعدادات</div>
                <div class="card-body">
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" name="is_active" id="is_active" {% if location.is_active %}checked{% endif %}>
                        <label class="form-check-label" for="is_active">نشط</label>
                    </div>
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" name="is_main" id="is_main" {% if location.is_main %}checked{% endif %}>
                        <label class="form-check-label" for="is_main">الفرع الرئيسي</label>
                    </div>
                    <hr>
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" name="can_sell" id="can_sell" {% if location.can_sell %}checked{% endif %}>
                        <label class="form-check-label" for="can_sell">يمكنه البيع</label>
                    </div>
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" name="can_purchase" id="can_purchase" {% if location.can_purchase %}checked{% endif %}>
                        <label class="form-check-label" for="can_purchase">يمكنه الشراء</label>
                    </div>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" name="has_inventory" id="has_inventory" {% if location.has_inventory %}checked{% endif %}>
                        <label class="form-check-label" for="has_inventory">له مخزون خاص</label>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Actions -->
    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">
            <i class="fas fa-save me-1"></i>حفظ التغييرات
        </button>
        <a href="{% url 'branches:location_detail' location.pk %}" class="btn btn-outline-secondary">
            إلغاء
        </a>
    </div>
</form>
{% endblock %}
