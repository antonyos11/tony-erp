{# Dropdown موحد للفروع والمعارض #}
<div class="dropdown location-selector">
    <button class="dropdown-toggle" type="button" data-bs-toggle="dropdown">
        {% if current_location %}
        <i class="{{ current_location.type_icon }} me-1"></i>
        {{ current_location.name }}
        {% else %}
        <i class="fas fa-map-marker-alt me-1"></i>
        اختر الموقع
        {% endif %}
    </button>
    <div class="dropdown-menu dropdown-menu-end">
        <!-- البحث -->
        <div class="search-box">
            <input type="text" class="form-control form-control-sm" id="locationSearch" placeholder="بحث...">
        </div>
        
        <!-- المواقع -->
        <div class="locations-list">
            {% regroup all_locations by get_branch_type_display as grouped_locations %}
            {% for group in grouped_locations %}
            <div class="dropdown-header">
                {{ group.grouper }}
            </div>
            {% for loc in group.list %}
            <form method="post" action="{% url 'branches:set_current_location' %}" class="d-inline w-100">
                {% csrf_token %}
                <input type="hidden" name="location_id" value="{{ loc.pk }}">
                <input type="hidden" name="next" value="{{ request.path }}">
                <button type="submit" class="location-item {% if current_location.pk == loc.pk %}active{% endif %}">
                    <i class="{{ loc.type_icon }} text-{{ loc.type_color }}"></i>
                    <span>{{ loc.name }}</span>
                    {% if current_location.pk == loc.pk %}
                    <i class="fas fa-check text-success ms-auto"></i>
                    {% endif %}
                </button>
            </form>
            {% endfor %}
            {% endfor %}
        </div>
        
        <!-- رابط الإدارة -->
        <div class="dropdown-divider"></div>
        <a class="dropdown-item text-center" href="{% url 'branches:unified_dashboard' %}">
            <i class="fas fa-cog me-1"></i>إدارة المواقع
        </a>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const searchInput = document.getElementById('locationSearch');
    if (searchInput) {
        searchInput.addEventListener('input', function() {
            const filter = this.value.toLowerCase();
            const items = document.querySelectorAll('.location-item');
            items.forEach(function(item) {
                const text = item.textContent.toLowerCase();
                item.style.display = text.includes(filter) ? '' : 'none';
            });
        });
    }
});
</script>
