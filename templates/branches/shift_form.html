{% extends 'base_v2.html' %}
{% load static %}

{% block content %}
<div class="container-fluid">
    <div class="mb-4">
        <h4><i class="bi bi-clock me-2"></i>{{ page_title }}</h4>
    </div>

    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {{ form.as_div }}
                <div class="mt-4">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg me-1"></i>حفظ
                    </button>
                    <a href="{% url 'branches:shift_list' %}" class="btn btn-secondary">إلغاء</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
