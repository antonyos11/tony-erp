{% extends 'base_v2.html' %}{% load i18n %}
{% block title %}{% trans 'فتح جلسة POS' %}{% endblock %}
{% block content %}
<div class="container">
  <h4 class="mb-3">{% trans 'فتح جلسة جديدة' %}</h4>
  <form method="post" class="card p-3 shadow-sm">
    {% csrf_token %}
    <div class="mb-2">
      <label class="form-label small">{% trans 'الرصيد الافتتاحي (نقدية بالخزنة)' %}</label>
      <input type="number" step="0.01" name="opening_balance" class="form-control form-control-sm" placeholder="0.00">
    </div>
    <div class="mb-2">
      <label class="form-label small">{% trans 'المعرض / الفرع' %}</label>
      <select name="location_id" class="form-select form-select-sm">
        {% for loc in locations %}
          <option value="{{ loc.id }}">{{ loc.code }} - {{ loc.name }}</option>
        {% endfor %}
      </select>
    </div>
    <button class="btn btn-primary btn-sm">{% trans 'فتح' %}</button>
    <a href="{% url 'pos:dashboard' %}" class="btn btn-outline-secondary btn-sm">{% trans 'رجوع' %}</a>
  </form>
</div>
{% endblock %}
