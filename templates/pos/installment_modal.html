{% load i18n %}

<!-- Installment Modal -->
<div class="modal fade" id="installmentModal" tabindex="-1" aria-labelledby="installmentModalLabel" aria-hidden="true" data-bs-backdrop="false" data-bs-keyboard="false">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-info text-white">
                <h5 class="modal-title" id="installmentModalLabel">
                    <i class="bi bi-calendar3 me-2"></i>{% trans 'البيع بالتقسيط' %}
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <!-- ملخص المبلغ -->
                <div class="card mb-4 bg-light">
                    <div class="card-body">
                        <div class="row text-center">
                            <div class="col-6">
                                <div class="text-muted small">{% trans 'إجمالي الفاتورة' %}</div>
                                <div class="h3 mb-0 text-primary fw-bold" id="installmentTotal">0.00</div>
                            </div>
                            <div class="col-6">
                                <div class="text-muted small">{% trans 'المبلغ المتبقي' %}</div>
                                <div class="h3 mb-0 text-danger fw-bold" id="remainingAmount">0.00</div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- المقدم -->
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">{% trans 'الدفعة المقدمة' %}</label>
                        <div class="input-group">
                            <input type="number" class="form-control" id="downPayment" 
                                   step="0.01" min="0" value="0">
                            <span class="input-group-text">{% trans 'ج.م' %}</span>
                        </div>
                        <div class="form-text">{% trans 'الحد الأدنى 20% من الإجمالي' %}</div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">{% trans 'عدد الأقساط' %}</label>
                        <select class="form-select" id="installmentCount">
                            <option value="2">2 {% trans 'أقساط' %}</option>
                            <option value="3" selected>3 {% trans 'أقساط' %}</option>
                            <option value="4">4 {% trans 'أقساط' %}</option>
                            <option value="6">6 {% trans 'أقساط' %}</option>
                            <option value="12">12 {% trans 'قسط' %}</option>
                        </select>
                    </div>
                </div>
                
                <!-- تفاصيل الأقساط -->
                <div class="mb-4">
                    <label class="form-label fw-bold">{% trans 'تفاصيل الأقساط' %}</label>
                    <div class="card">
                        <div class="table-responsive">
                            <table class="table table-sm table-hover mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>{% trans 'رقم القسط' %}</th>
                                        <th>{% trans 'تاريخ الاستحقاق' %}</th>
                                        <th>{% trans 'المبلغ' %}</th>
                                        <th>{% trans 'الحالة' %}</th>
                                    </tr>
                                </thead>
                                <tbody id="installmentSchedule">
                                    <!-- يتم ملؤها ديناميكياً -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                
                <!-- معلومات العميل -->
                <div class="mb-4">
                    <label class="form-label fw-bold">{% trans 'بيانات العميل للتقسيط' %}</label>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">{% trans 'رقم الهوية' %}</label>
                            <input type="text" class="form-control" id="customerIdNumber" dir="ltr">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">{% trans 'رقم الجوال' %}</label>
                            <input type="tel" class="form-control" id="customerMobile" dir="ltr">
                        </div>
                        <div class="col-12">
                            <label class="form-label">{% trans 'العنوان' %}</label>
                            <input type="text" class="form-control" id="customerFullAddress">
                        </div>
                    </div>
                </div>
                
                <!-- الكفيل -->
                <div class="mb-3">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="hasGuarantor">
                        <label class="form-check-label" for="hasGuarantor">
                            {% trans 'إضافة كفيل' %}
                        </label>
                    </div>
                    <div id="guarantorSection" class="mt-3" style="display: none;">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">{% trans 'اسم الكفيل' %}</label>
                                <input type="text" class="form-control" id="guarantorName">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">{% trans 'رقم جوال الكفيل' %}</label>
                                <input type="tel" class="form-control" id="guarantorPhone" dir="ltr">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    <i class="bi bi-x-circle me-1"></i>{% trans 'إلغاء' %}
                </button>
                <button type="button" class="btn btn-info btn-lg" id="confirmInstallment">
                    <i class="bi bi-calendar-check me-1"></i>{% trans 'تأكيد التقسيط' %}
                </button>
            </div>
        </div>
    </div>
</div>

<style>
#installmentSchedule tr td:nth-child(3) {
    font-weight: 600;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const downPaymentInput = document.getElementById('downPayment');
    const installmentCountSelect = document.getElementById('installmentCount');
    const scheduleBody = document.getElementById('installmentSchedule');
    const hasGuarantorCheck = document.getElementById('hasGuarantor');
    const guarantorSection = document.getElementById('guarantorSection');
    
    // إظهار/إخفاء قسم الكفيل
    if (hasGuarantorCheck) {
        hasGuarantorCheck.addEventListener('change', function() {
            guarantorSection.style.display = this.checked ? 'block' : 'none';
        });
    }
    
    // تحديث جدول الأقساط
    function updateSchedule() {
        const total = parseFloat(document.getElementById('installmentTotal').textContent) || 0;
        const downPayment = parseFloat(downPaymentInput.value) || 0;
        const count = parseInt(installmentCountSelect.value) || 3;
        const remaining = total - downPayment;
        const monthlyAmount = remaining / count;
        
        document.getElementById('remainingAmount').textContent = remaining.toFixed(2);
        
        let html = '';
        const today = new Date();
        for (let i = 1; i <= count; i++) {
            const dueDate = new Date(today);
            dueDate.setMonth(dueDate.getMonth() + i);
            const dateStr = dueDate.toISOString().split('T')[0];
            
            html += `
                <tr>
                    <td>${i}</td>
                    <td>${dateStr}</td>
                    <td>${monthlyAmount.toFixed(2)} ج.م</td>
                    <td><span class="badge bg-warning">معلق</span></td>
                </tr>
            `;
        }
        scheduleBody.innerHTML = html;
    }
    
    if (downPaymentInput) downPaymentInput.addEventListener('input', updateSchedule);
    if (installmentCountSelect) installmentCountSelect.addEventListener('change', updateSchedule);
    
    // تهيئة أولية
    updateSchedule();
});
</script>
