{% load i18n %}

<!-- Customer Modal -->
<div class="modal fade" id="customerModal" tabindex="-1" aria-labelledby="customerModalLabel" aria-hidden="true" data-bs-backdrop="false" data-bs-keyboard="false">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title" id="customerModalLabel">
                    <i class="bi bi-person-plus me-2"></i>{% trans 'اختيار/إضافة عميل' %}
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <!-- البحث عن عميل -->
                <div class="mb-4">
                    <label class="form-label fw-bold">{% trans 'بحث عن عميل موجود' %}</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input type="text" class="form-control" id="customerSearch" 
                               placeholder="{% trans 'اكتب اسم العميل أو رقم الهاتف...' %}">
                    </div>
                    <div id="customerSearchResults" class="list-group mt-2" style="max-height: 200px; overflow-y: auto;">
                        <!-- نتائج البحث تظهر هنا -->
                    </div>
                </div>
                
                <hr>
                
                <!-- إضافة عميل جديد -->
                <div class="mb-3">
                    <h6 class="fw-bold"><i class="bi bi-person-plus me-1"></i>{% trans 'أو أضف عميل جديد' %}</h6>
                </div>
                
                <form id="newCustomerForm">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">{% trans 'اسم العميل' %} <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="customerName" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">{% trans 'رقم الهاتف' %}</label>
                            <input type="tel" class="form-control" id="customerPhone" dir="ltr">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">{% trans 'البريد الإلكتروني' %}</label>
                            <input type="email" class="form-control" id="customerEmail" dir="ltr">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">{% trans 'العنوان' %}</label>
                            <input type="text" class="form-control" id="customerAddress">
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    <i class="bi bi-x-circle me-1"></i>{% trans 'إلغاء' %}
                </button>
                <button type="button" class="btn btn-success" id="saveNewCustomer">
                    <i class="bi bi-person-plus me-1"></i>{% trans 'حفظ عميل جديد' %}
                </button>
                <button type="button" class="btn btn-primary" id="selectCustomer" disabled>
                    <i class="bi bi-check-circle me-1"></i>{% trans 'اختيار العميل' %}
                </button>
            </div>
        </div>
    </div>
</div>

<style>
.customer-result-item {
    cursor: pointer;
    transition: background-color 0.2s;
}
.customer-result-item:hover {
    background-color: #e9ecef;
}
.customer-result-item.selected {
    background-color: #0d6efd;
    color: white;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const searchInput = document.getElementById('customerSearch');
    const resultsContainer = document.getElementById('customerSearchResults');
    const selectBtn = document.getElementById('selectCustomer');
    let selectedCustomerId = null;
    
    // بحث عن العملاء
    if (searchInput) {
        searchInput.addEventListener('input', function() {
            const query = this.value.trim();
            if (query.length < 2) {
                resultsContainer.innerHTML = '';
                return;
            }
            
            // يمكن استبدال هذا بـ API call حقيقي
            resultsContainer.innerHTML = `
                <div class="list-group-item text-muted text-center">
                    <i class="bi bi-search me-1"></i>جاري البحث...
                </div>
            `;
        });
    }
    
    // حفظ عميل جديد
    const saveNewBtn = document.getElementById('saveNewCustomer');
    if (saveNewBtn) {
        saveNewBtn.addEventListener('click', function() {
            const name = document.getElementById('customerName').value.trim();
            if (!name) {
                alert('يرجى إدخال اسم العميل');
                return;
            }
            // يمكن إضافة API call هنا
            console.log('Saving new customer:', name);
        });
    }
});
</script>
