{% extends 'base_v2.html' %}{% load i18n %}
{% block title %}{% trans 'إغلاق جلسة POS' %}{% endblock %}
{% block content %}
<div class="container">
  <h4 class="mb-3">{% trans 'إغلاق الجلسة' %} #{{ session.id }}</h4>
  <p class="small text-muted">{% trans 'إجمالي المبيعات:' %} {{ session.total_sales }}</p>
  <form method="post" class="card p-3 shadow-sm">
    {% csrf_token %}
    <div class="mb-2">
      <label class="form-label small">{% trans 'الرصيد الختامي' %}</label>
      <input type="number" step="0.01" name="closing_balance" class="form-control form-control-sm" placeholder="0.00">
    </div>
    <button class="btn btn-danger btn-sm">{% trans 'إغلاق الجلسة' %}</button>
    <a href="{% url 'pos:dashboard' %}" class="btn btn-outline-secondary btn-sm">{% trans 'إلغاء' %}</a>
  </form>
</div>
{% endblock %}
