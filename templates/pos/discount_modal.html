{% load i18n %}

<!-- Discount Modal -->
<div class="discount-modal-overlay" id="discountModal" style="display: none;">
    <div class="discount-modal">
        <div class="discount-modal-header">
            <h4><i class="bi bi-percent"></i> {% trans 'إضافة خصم' %}</h4>
            <button type="button" class="discount-modal-close" id="closeDiscountModal">&times;</button>
        </div>
        
        <div class="discount-modal-body">
            <!-- نوع الخصم -->
            <div class="discount-type-tabs">
                <button type="button" class="discount-tab active" data-type="percentage">
                    <i class="bi bi-percent"></i> {% trans 'نسبة مئوية' %}
                </button>
                <button type="button" class="discount-tab" data-type="fixed">
                    <i class="bi bi-cash"></i> {% trans 'مبلغ ثابت' %}
                </button>
            </div>
            
            <!-- قيمة الخصم -->
            <div class="discount-input-section">
                <label id="discountLabel">{% trans 'نسبة الخصم (%)' %}</label>
                <div class="discount-input-wrapper">
                    <input type="number" id="discountValue" min="0" step="0.01" value="0">
                    <span class="discount-symbol" id="discountSymbol">%</span>
                </div>
            </div>
            
            <!-- أزرار سريعة للخصم -->
            <div class="quick-discounts" id="quickDiscounts">
                <button type="button" class="quick-discount-btn" data-value="5">5%</button>
                <button type="button" class="quick-discount-btn" data-value="10">10%</button>
                <button type="button" class="quick-discount-btn" data-value="15">15%</button>
                <button type="button" class="quick-discount-btn" data-value="20">20%</button>
                <button type="button" class="quick-discount-btn" data-value="25">25%</button>
                <button type="button" class="quick-discount-btn" data-value="50">50%</button>
            </div>
            
            <!-- سبب الخصم -->
            <div class="discount-reason-section">
                <label>{% trans 'سبب الخصم (اختياري)' %}</label>
                <select id="discountReason">
                    <option value="">{% trans 'اختر السبب' %}</option>
                    <option value="عميل مميز">{% trans 'عميل مميز' %}</option>
                    <option value="عرض خاص">{% trans 'عرض خاص' %}</option>
                    <option value="تصفية">{% trans 'تصفية' %}</option>
                    <option value="خصم موظف">{% trans 'خصم موظف' %}</option>
                    <option value="خصم الكمية">{% trans 'خصم الكمية' %}</option>
                    <option value="أخرى">{% trans 'أخرى' %}</option>
                </select>
            </div>
            
            <!-- معاينة الخصم -->
            <div class="discount-preview">
                <div class="preview-row">
                    <span>{% trans 'الإجمالي قبل الخصم' %}</span>
                    <span id="previewSubtotal">0.00</span>
                </div>
                <div class="preview-row discount">
                    <span>{% trans 'قيمة الخصم' %}</span>
                    <span id="previewDiscount">- 0.00</span>
                </div>
                <div class="preview-row total">
                    <span>{% trans 'الإجمالي بعد الخصم' %}</span>
                    <span id="previewTotal">0.00</span>
                </div>
            </div>
        </div>
        
        <div class="discount-modal-footer">
            <button type="button" class="btn-remove-discount" id="removeDiscount">
                <i class="bi bi-x-circle"></i> {% trans 'إزالة الخصم' %}
            </button>
            <button type="button" class="btn-apply-discount" id="applyDiscount">
                <i class="bi bi-check-circle"></i> {% trans 'تطبيق الخصم' %}
            </button>
        </div>
    </div>
</div>

<style>
.discount-modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(5px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10000;
}

.discount-modal {
    background: #fff;
    border-radius: 20px;
    width: 90%;
    max-width: 450px;
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
    overflow: hidden;
    animation: slideUp 0.3s ease;
}

@keyframes slideUp {
    from { transform: translateY(30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}

.discount-modal-header {
    background: linear-gradient(135deg, #ef4444, #dc2626);
    color: #fff;
    padding: 20px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.discount-modal-header h4 {
    margin: 0;
    font-size: 1.25rem;
    display: flex;
    align-items: center;
    gap: 10px;
}

.discount-modal-close {
    background: rgba(255, 255, 255, 0.2);
    border: none;
    color: #fff;
    font-size: 1.5rem;
    width: 35px;
    height: 35px;
    border-radius: 50%;
    cursor: pointer;
    transition: all 0.2s;
}

.discount-modal-close:hover {
    background: rgba(255, 255, 255, 0.3);
    transform: rotate(90deg);
}

.discount-modal-body {
    padding: 25px;
}

.discount-type-tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

.discount-tab {
    flex: 1;
    padding: 12px;
    border: 2px solid #e5e7eb;
    border-radius: 12px;
    background: #fff;
    font-size: 0.95rem;
    font-weight: 600;
    color: #6b7280;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}

.discount-tab:hover {
    border-color: #ef4444;
    color: #ef4444;
}

.discount-tab.active {
    background: linear-gradient(135deg, #ef4444, #dc2626);
    border-color: #ef4444;
    color: #fff;
}

.discount-input-section {
    margin-bottom: 20px;
}

.discount-input-section label {
    display: block;
    font-weight: 600;
    color: #374151;
    margin-bottom: 8px;
}

.discount-input-wrapper {
    position: relative;
}

.discount-input-wrapper input {
    width: 100%;
    padding: 15px 50px 15px 20px;
    font-size: 2rem;
    font-weight: 700;
    text-align: center;
    border: 3px solid #e5e7eb;
    border-radius: 15px;
    transition: all 0.2s;
}

.discount-input-wrapper input:focus {
    outline: none;
    border-color: #ef4444;
    box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.1);
}

.discount-symbol {
    position: absolute;
    left: 20px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 1.5rem;
    font-weight: 700;
    color: #ef4444;
}

.quick-discounts {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

.quick-discount-btn {
    flex: 1;
    min-width: 60px;
    padding: 10px;
    border: 2px solid #e5e7eb;
    border-radius: 10px;
    background: #fff;
    font-size: 1rem;
    font-weight: 600;
    color: #374151;
    cursor: pointer;
    transition: all 0.2s;
}

.quick-discount-btn:hover {
    border-color: #ef4444;
    background: #fef2f2;
    color: #ef4444;
}

.discount-reason-section {
    margin-bottom: 20px;
}

.discount-reason-section label {
    display: block;
    font-weight: 600;
    color: #374151;
    margin-bottom: 8px;
}

.discount-reason-section select {
    width: 100%;
    padding: 12px 15px;
    border: 2px solid #e5e7eb;
    border-radius: 10px;
    font-size: 1rem;
    color: #374151;
    cursor: pointer;
}

.discount-reason-section select:focus {
    outline: none;
    border-color: #ef4444;
}

.discount-preview {
    background: #f9fafb;
    border-radius: 15px;
    padding: 15px 20px;
}

.preview-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    color: #6b7280;
}

.preview-row.discount {
    color: #ef4444;
    font-weight: 600;
}

.preview-row.total {
    border-top: 2px solid #e5e7eb;
    margin-top: 8px;
    padding-top: 12px;
    font-size: 1.25rem;
    font-weight: 700;
    color: #111827;
}

.discount-modal-footer {
    display: flex;
    gap: 12px;
    padding: 20px 25px;
    border-top: 1px solid #e5e7eb;
}

.btn-remove-discount,
.btn-apply-discount {
    flex: 1;
    padding: 14px;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.2s;
    border: none;
}

.btn-remove-discount {
    background: #f3f4f6;
    color: #6b7280;
}

.btn-remove-discount:hover {
    background: #e5e7eb;
    color: #374151;
}

.btn-apply-discount {
    background: linear-gradient(135deg, #ef4444, #dc2626);
    color: #fff;
}

.btn-apply-discount:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 20px rgba(239, 68, 68, 0.4);
}
</style>
