{% load i18n %}
{# قسم تقرير الأرباح حسب الفئة #}

<div class="profit-category-section">
    <div class="section-header">
        <h6 class="section-title">
            <i class="bi bi-pie-chart-fill me-2"></i>
            {% trans 'تقرير الأرباح حسب الفئة' %}
        </h6>
        <div class="period-selector">
            <button type="button" class="period-btn" data-period="daily">{% trans 'يومي' %}</button>
            <button type="button" class="period-btn" data-period="monthly">{% trans 'شهري' %}</button>
            <button type="button" class="period-btn active" data-period="yearly">{% trans 'سنوي' %}</button>
        </div>
    </div>
    
    <!-- بطاقات الأرباح -->
    <div class="profit-period-cards">
        <div class="profit-period-card yearly">
            <div class="period-icon">
                <i class="bi bi-calendar-check"></i>
            </div>
            <div class="period-content">
                <span class="period-label">YEARLY</span>
                <span class="period-value" id="yearlyProfit">0.00 ج.م</span>
            </div>
        </div>
        
        <div class="profit-period-card monthly">
            <div class="period-icon">
                <i class="bi bi-calendar3"></i>
            </div>
            <div class="period-content">
                <span class="period-label">MONTHLY</span>
                <span class="period-value" id="monthlyProfit">0.00 ج.م</span>
            </div>
        </div>
        
        <div class="profit-period-card daily">
            <div class="period-icon">
                <i class="bi bi-calendar-day"></i>
            </div>
            <div class="period-content">
                <span class="period-label">DAILY</span>
                <span class="period-value" id="dailyProfit">0.00 ج.م</span>
            </div>
        </div>
    </div>
    
    <!-- رسم بياني -->
    <div class="profit-chart-container">
        <div class="chart-legend">
            <span class="legend-item"><span class="legend-dot" style="background: #22c55e;"></span>{% trans 'صافي الربح' %}</span>
        </div>
        <canvas id="profitByCategoryChart" height="200"></canvas>
    </div>
</div>

<style>
/* ===== تنسيقات تقرير الأرباح حسب الفئة ===== */
.profit-category-section {
    background: #fff;
    border-radius: 12px;
    padding: 1.5rem;
    margin-top: 1rem;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}

html[data-theme='dark'] .profit-category-section {
    background: #1a2942;
}

.section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
    gap: 1rem;
}

.section-title {
    margin: 0;
    font-weight: 700;
    color: #374151;
}

html[data-theme='dark'] .section-title {
    color: #e5e7eb;
}

.period-selector {
    display: flex;
    gap: 0.5rem;
}

.period-btn {
    padding: 0.4rem 1rem;
    border: 1px solid #e5e7eb;
    background: #fff;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: 500;
    color: #6b7280;
    cursor: pointer;
    transition: all 0.2s ease;
}

.period-btn:hover {
    border-color: #3b82f6;
    color: #3b82f6;
}

.period-btn.active {
    background: #3b82f6;
    border-color: #3b82f6;
    color: #fff;
}

html[data-theme='dark'] .period-btn {
    background: #243447;
    border-color: #374151;
    color: #9ca3af;
}

html[data-theme='dark'] .period-btn.active {
    background: #3b82f6;
    color: #fff;
}

/* بطاقات الفترات */
.profit-period-cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1rem;
    margin-bottom: 1.5rem;
}

@media (max-width: 768px) {
    .profit-period-cards {
        grid-template-columns: 1fr;
    }
}

.profit-period-card {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 1.25rem;
    border-radius: 12px;
    color: #fff;
}

.profit-period-card.yearly {
    background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
}

.profit-period-card.monthly {
    background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
}

.profit-period-card.daily {
    background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
}

.period-icon {
    width: 50px;
    height: 50px;
    background: rgba(255,255,255,0.2);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
}

.period-content {
    display: flex;
    flex-direction: column;
}

.period-label {
    font-size: 0.75rem;
    font-weight: 600;
    opacity: 0.9;
    letter-spacing: 1px;
}

.period-value {
    font-size: 1.35rem;
    font-weight: 700;
    margin-top: 0.25rem;
}

/* الرسم البياني */
.profit-chart-container {
    position: relative;
}

.chart-legend {
    display: flex;
    justify-content: flex-end;
    gap: 1rem;
    margin-bottom: 0.5rem;
}

.legend-item {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.85rem;
    color: #6b7280;
}

.legend-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    let profitChart = null;
    
    // تحميل البيانات الأولية
    loadProfitByCategory('yearly');
    loadAllPeriodProfits();
    
    // أزرار الفترات
    document.querySelectorAll('.period-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            loadProfitByCategory(this.dataset.period);
        });
    });
    
    async function loadProfitByCategory(period) {
        try {
            const response = await fetch(`{% url 'core:api_profit_by_category' %}?period=${period}`);
            const result = await response.json();
            
            if (result.success) {
                updateChart(result.data);
            }
        } catch (e) {
            console.error('Error loading profit by category:', e);
        }
    }
    
    async function loadAllPeriodProfits() {
        try {
            // يومي
            const dailyRes = await fetch('{% url "core:api_profit_by_category" %}?period=daily');
            const dailyData = await dailyRes.json();
            if (dailyData.success) {
                document.getElementById('dailyProfit').textContent = 
                    formatNumber(dailyData.data.net_profit) + ' ج.م';
            }
            
            // شهري
            const monthlyRes = await fetch('{% url "core:api_profit_by_category" %}?period=monthly');
            const monthlyData = await monthlyRes.json();
            if (monthlyData.success) {
                document.getElementById('monthlyProfit').textContent = 
                    formatNumber(monthlyData.data.net_profit) + ' ج.م';
            }
            
            // سنوي
            const yearlyRes = await fetch('{% url "core:api_profit_by_category" %}?period=yearly');
            const yearlyData = await yearlyRes.json();
            if (yearlyData.success) {
                document.getElementById('yearlyProfit').textContent = 
                    formatNumber(yearlyData.data.net_profit) + ' ج.م';
            }
        } catch (e) {
            console.error('Error loading period profits:', e);
        }
    }
    
    function updateChart(data) {
        const ctx = document.getElementById('profitByCategoryChart');
        if (!ctx) return;
        
        if (profitChart) {
            profitChart.destroy();
        }
        
        profitChart = new Chart(ctx.getContext('2d'), {
            type: 'line',
            data: {
                labels: data.categories || [],
                datasets: [{
                    label: '{% trans "صافي الربح" %}',
                    data: data.values || [],
                    fill: true,
                    backgroundColor: 'rgba(34, 197, 94, 0.15)',
                    borderColor: '#22c55e',
                    borderWidth: 2,
                    tension: 0.4,
                    pointRadius: 4,
                    pointBackgroundColor: '#22c55e',
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false }
                },
                scales: {
                    x: {
                        display: true,
                        grid: { display: false }
                    },
                    y: {
                        display: true,
                        beginAtZero: true,
                        grid: { color: 'rgba(0,0,0,0.05)' }
                    }
                }
            }
        });
    }
    
    function formatNumber(num) {
        return new Intl.NumberFormat('en-US', {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }).format(num || 0);
    }
});
</script>
