{% extends 'base_v2.html' %}
{% load static %}
{% block title %}طلب تنظيف{% endblock %}
{% block extra_css %}
<style>
    .hero-section{background:linear-gradient(135deg,#11998e,#38ef7d);color:#fff;padding:40px 0;margin:-24px -24px 30px;border-radius:0 0 30px 30px}
    .request-card{background:#fff;border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,.1);padding:30px;max-width:700px;margin:0 auto}
    .step-indicator{display:flex;justify-content:center;gap:30px;margin-bottom:30px}
    .step{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600}
    .step.active{background:linear-gradient(135deg,#11998e,#38ef7d);color:#fff}
    .step.inactive{background:#e9ecef;color:#6c757d}
</style>
{% endblock %}
{% block content %}
<div class="hero-section">
    <div class="container text-center">
        <h1><i class="bi bi-house-heart me-2"></i>طلب خدمة تنظيف</h1>
        <p class="opacity-75 mb-0">احجز موعدك الآن</p>
    </div>
</div>
<div class="container">
    <div class="request-card">
        <div class="step-indicator"><div class="step active">1</div><div class="step inactive">2</div><div class="step inactive">3</div></div>
        <form>
            <h5 class="mb-3">معلومات الخدمة</h5>
            <div class="row g-3">
                <div class="col-md-6"><label class="form-label">نوع الخدمة</label><select class="form-select"><option>تنظيف منزل</option><option>تنظيف مكتب</option><option>تنظيف بعد البناء</option></select></div>
                <div class="col-md-6"><label class="form-label">مساحة المكان</label><select class="form-select"><option>أقل من 100 م²</option><option>100-200 م²</option><option>أكثر من 200 م²</option></select></div>
                <div class="col-md-6"><label class="form-label">التاريخ المفضل</label><input type="date" class="form-control"></div>
                <div class="col-md-6"><label class="form-label">الوقت المفضل</label><select class="form-select"><option>صباحاً (8-12)</option><option>ظهراً (12-4)</option><option>مساءً (4-8)</option></select></div>
                <div class="col-12"><label class="form-label">العنوان</label><textarea class="form-control" rows="2"></textarea></div>
                <div class="col-12"><label class="form-label">ملاحظات إضافية</label><textarea class="form-control" rows="2"></textarea></div>
            </div>
            <div class="text-end mt-4"><button type="submit" class="btn btn-success px-5">التالي <i class="bi bi-arrow-left ms-1"></i></button></div>
        </form>
    </div>
</div>
{% endblock %}
