{% extends 'base_v2.html' %}
{% load static %}
{% block title %}تم إرسال الطلب{% endblock %}
{% block extra_css %}
<style>
    .success-container{max-width:500px;margin:80px auto;text-align:center}
    .success-card{background:#fff;border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,.1);padding:50px 30px}
    .success-icon{width:100px;height:100px;border-radius:50%;background:linear-gradient(135deg,#11998e,#38ef7d);color:#fff;display:flex;align-items:center;justify-content:center;font-size:3rem;margin:0 auto 25px}
    .order-number{background:#f8f9fa;border-radius:12px;padding:15px;margin:25px 0;font-size:1.2rem}
    .order-number strong{color:#11998e}
</style>
{% endblock %}
{% block content %}
<div class="success-container">
    <div class="success-card">
        <div class="success-icon"><i class="bi bi-check-lg"></i></div>
        <h2 class="text-success mb-3">تم إرسال طلبك بنجاح!</h2>
        <p class="text-muted">سنتواصل معك قريباً لتأكيد الموعد</p>
        <div class="order-number">رقم الطلب: <strong>#REQ-2024-1234</strong></div>
        <div class="d-grid gap-2">
            <a href="#" class="btn btn-success"><i class="bi bi-search me-1"></i>تتبع الطلب</a>
            <a href="/" class="btn btn-outline-secondary">العودة للرئيسية</a>
        </div>
    </div>
</div>
{% endblock %}
