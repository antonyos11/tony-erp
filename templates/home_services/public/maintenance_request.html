{% extends 'base_v2.html' %}
{% load static %}
{% block title %}طلب صيانة{% endblock %}
{% block extra_css %}
<style>
    .hero-section{background:linear-gradient(135deg,#ff9a56,#ff6b35);color:#fff;padding:40px 0;margin:-24px -24px 30px;border-radius:0 0 30px 30px}
    .request-card{background:#fff;border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,.1);padding:30px;max-width:700px;margin:0 auto}
    .service-types{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:15px;margin-bottom:25px}
    .service-type{border:2px solid #e9ecef;border-radius:12px;padding:20px;text-align:center;cursor:pointer;transition:all .3s}
    .service-type:hover,.service-type.selected{border-color:#ff6b35;background:#fff5f0}
    .service-icon{font-size:2rem;color:#ff6b35;margin-bottom:10px}
</style>
{% endblock %}
{% block content %}
<div class="hero-section">
    <div class="container text-center">
        <h1><i class="bi bi-tools me-2"></i>طلب خدمة صيانة</h1>
        <p class="opacity-75 mb-0">فنيون محترفون لخدمتك</p>
    </div>
</div>
<div class="container">
    <div class="request-card">
        <h5 class="mb-3">اختر نوع الصيانة</h5>
        <div class="service-types">
            <div class="service-type selected"><div class="service-icon"><i class="bi bi-plug"></i></div><div>كهرباء</div></div>
            <div class="service-type"><div class="service-icon"><i class="bi bi-droplet"></i></div><div>سباكة</div></div>
            <div class="service-type"><div class="service-icon"><i class="bi bi-snow"></i></div><div>تكييف</div></div>
            <div class="service-type"><div class="service-icon"><i class="bi bi-brush"></i></div><div>دهان</div></div>
            <div class="service-type"><div class="service-icon"><i class="bi bi-hammer"></i></div><div>نجارة</div></div>
            <div class="service-type"><div class="service-icon"><i class="bi bi-three-dots"></i></div><div>أخرى</div></div>
        </div>
        <form>
            <div class="row g-3">
                <div class="col-md-6"><label class="form-label">الاسم</label><input type="text" class="form-control"></div>
                <div class="col-md-6"><label class="form-label">الهاتف</label><input type="tel" class="form-control"></div>
                <div class="col-md-6"><label class="form-label">التاريخ المفضل</label><input type="date" class="form-control"></div>
                <div class="col-md-6"><label class="form-label">الوقت</label><select class="form-select"><option>صباحاً</option><option>مساءً</option></select></div>
                <div class="col-12"><label class="form-label">وصف المشكلة</label><textarea class="form-control" rows="3"></textarea></div>
            </div>
            <button type="submit" class="btn btn-warning w-100 mt-4">إرسال الطلب</button>
        </form>
    </div>
</div>
{% endblock %}
