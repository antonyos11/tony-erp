{% extends "base.html" %}
{% block title %}شيك جديد — RITA ERP{% endblock %}
{% block nav_treasury %}active{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="mb-0"><i class="bi bi-receipt me-2 text-primary"></i>إضافة شيك جديد</h4>
    <a href="{% url 'treasury:check_list' %}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-right me-1"></i>رجوع
    </a>
</div>

<div class="card shadow-sm" style="max-width:700px">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="row g-3">
                {% for field in form %}
                <div class="col-md-6">
                    <label class="form-label fw-semibold">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}<div class="text-danger small mt-1">{{ field.errors }}</div>{% endif %}
                </div>
                {% endfor %}
            </div>
            <div class="mt-4">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-save me-1"></i>حفظ الشيك
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
