{% extends 'base.html' %}
{% load humanize %}
{% block title %}{{ title }} — RITA ERP{% endblock %}
{% block breadcrumb_items %}
<li class="breadcrumb-item active">{{ title }}</li>
{% endblock %}
{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold"><i class="bi bi-cash-stack me-2 text-success"></i>{{ title }}</h4>
    </div>
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-success text-white fw-bold">{{ title }}</div>
                <div class="card-body p-4">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3"><label class="form-label fw-semibold">المبلغ <span class="text-danger">*</span></label><input type="number" name="amount" class="form-control" step="0.01" min="0.01" required></div>
                        <div class="mb-3"><label class="form-label fw-semibold">التاريخ</label><input type="date" name="date" class="form-control" value="{% now 'Y-m-d' %}"></div>
                        <div class="mb-4"><label class="form-label fw-semibold">البيان</label><input type="text" name="description" class="form-control" placeholder="وصف العملية"></div>
                        <div class="d-flex gap-2 justify-content-end">
                            <a href="javascript:history.back()" class="btn btn-outline-secondary">إلغاء</a>
                            <button type="submit" class="btn btn-success fw-bold">تنفيذ</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
