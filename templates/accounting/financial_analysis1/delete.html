{% extends 'base.html' %}

{% block title %}حذف تحليل مالي - Tony ERP{% endblock %}
{% block page_title %}حذف تحليل مالي{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-lg-6">
            <div class="card border-danger">
                <div class="card-header bg-danger text-white">
                    <h6 class="mb-0"><i class="fas fa-exclamation-triangle me-2"></i>تأكيد الحذف</h6>
                </div>
                <div class="card-body">
                    <p>هل أنت متأكد من حذف التحليل المالي التالي؟</p>
                    <div class="alert alert-warning">
                        <strong>{{ analysis.code }}</strong> - {{ analysis.name }}
                    </div>
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-danger">
                                <i class="fas fa-trash me-2"></i>نعم، حذف
                            </button>
                            <a href="{% url 'accounting:financial_analysis1_list' %}" class="btn btn-secondary">إلغاء</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
