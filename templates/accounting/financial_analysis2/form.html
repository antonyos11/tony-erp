{% extends 'base.html' %}

{% block title %}{{ title }} - Tony ERP{% endblock %}
{% block page_title %}{{ title }}{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-lg-6">
            <div class="card">
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label">الكود <span class="text-danger">*</span></label>
                            {{ form.code }}
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">الاسم <span class="text-danger">*</span></label>
                            {{ form.name }}
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">التحليل المالي 1 الأب</label>
                            {{ form.parent_analysis }}
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">الوصف</label>
                            {{ form.description }}
                        </div>
                        
                        <div class="form-check mb-3">
                            {{ form.is_active }}
                            <label class="form-check-label">نشط</label>
                        </div>
                        
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-2"></i>حفظ
                            </button>
                            <a href="{% url 'accounting:financial_analysis2_list' %}" class="btn btn-secondary">إلغاء</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
