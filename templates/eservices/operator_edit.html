{% extends "base.html" %}
{% load i18n %}
{% load static %}

{% block title %}تعديل المشغل - {{ operator.name }}{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header">
                    <h5 class="mb-0">
                        <i class="bi bi-pencil-square me-2"></i>
                        {{ page_title }}
                    </h5>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">اسم المشغل <span class="text-danger">*</span></label>
                                <input type="text" name="name" class="form-control" 
                                       value="{{ operator.name }}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">الكود</label>
                                <input type="text" name="code" class="form-control" 
                                       value="{{ operator.code }}">
                            </div>
                        </div>
                        
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">نسبة العمولة (%)</label>
                                <input type="number" name="commission_rate" class="form-control" 
                                       value="{{ operator.commission_rate }}" step="0.01" min="0" max="100">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">الحالة</label>
                                <div class="form-check form-switch mt-2">
                                    <input type="checkbox" name="is_active" class="form-check-input" 
                                           id="is_active" {% if operator.is_active %}checked{% endif %}>
                                    <label class="form-check-label" for="is_active">نشط</label>
                                </div>
                            </div>
                        </div>
                        
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg me-1"></i>
                                حفظ التغييرات
                            </button>
                            <a href="{% url 'eservices:operator_list' %}" class="btn btn-secondary">
                                إلغاء
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
