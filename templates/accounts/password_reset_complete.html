{% load static %}
{% load i18n %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans 'تم تغيير كلمة المرور' %} | Tony ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1e3a5f;
            --secondary-color: #2c5f8d;
            --accent-color: #4a90e2;
            --success-color: #28a745;
            --shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, 'Cairo', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--primary-color) 0%, #0d1b2a 100%);
            display: flex; align-items: center; justify-content: center;
            position: relative; overflow: hidden;
        }
        body::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background-image:
                radial-gradient(circle at 20% 50%, rgba(74, 144, 226, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(44, 95, 141, 0.1) 0%, transparent 50%);
            pointer-events: none;
        }
        .reset-container {
            width: 100%; max-width: 450px; padding: 2rem;
            position: relative; z-index: 1;
        }
        .reset-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px; padding: 3rem 2.5rem;
            box-shadow: var(--shadow); backdrop-filter: blur(10px);
            animation: slideUp 0.5s ease-out; text-align: center;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .success-icon {
            width: 100px; height: 100px;
            background: linear-gradient(135deg, var(--success-color), #20c997);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1.5rem;
            box-shadow: 0 8px 25px rgba(40, 167, 69, 0.3);
            animation: bounceIn 0.6s ease-out 0.3s both;
        }
        @keyframes bounceIn {
            0% { transform: scale(0); }
            60% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        .success-icon i { font-size: 3rem; color: white; }
        .title {
            font-size: 1.6rem; font-weight: 700;
            color: var(--primary-color); margin-bottom: 1rem;
        }
        .description { font-size: 1rem; color: #6c757d; margin-bottom: 2rem; line-height: 1.7; }
        .btn-login {
            display: inline-block; padding: 0.875rem 2.5rem;
            font-size: 1.1rem; font-weight: 600;
            background: linear-gradient(135deg, var(--accent-color), var(--secondary-color));
            border: none; border-radius: 12px; color: white;
            text-decoration: none; transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(74, 144, 226, 0.3);
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(74, 144, 226, 0.4);
            color: white;
        }
        @media (max-width: 576px) {
            .reset-container { padding: 1rem; }
            .reset-card { padding: 2rem 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="reset-card">
            <div class="success-icon">
                <i class="bi bi-check-lg"></i>
            </div>
            <h1 class="title">{% trans 'تم تغيير كلمة المرور بنجاح!' %}</h1>
            <p class="description">
                {% trans 'يمكنك الآن تسجيل الدخول بكلمة المرور الجديدة.' %}
            </p>
            <a href="{% url 'accounts:login' %}" class="btn-login">
                <i class="bi bi-box-arrow-in-left me-1"></i>
                {% trans 'تسجيل الدخول' %}
            </a>
        </div>
    </div>
</body>
</html>
