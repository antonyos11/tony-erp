{% extends 'base_v2.html' %}
{% block content %}
<div class="container-fluid">
    <div class="card shadow-sm">
        <div class="card-body text-center py-5">
            <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size: 3rem;"></i>
            <h4 class="mt-3">{{ page_title }}</h4>
            <p class="text-muted">هل أنت متأكد من حذف صلاحية <strong>{{ perm.user }}</strong> على فرع <strong>{{ perm.branch }}</strong>؟</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger me-2"><i class="bi bi-trash me-1"></i>نعم، احذف</button>
                <a href="{% url 'accounts:permission_list' %}" class="btn btn-secondary">إلغاء</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
