{% load static %}
{% load i18n %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans 'التحقق بخطوتين' %} | Tony ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1e3a5f;
            --secondary-color: #2c5f8d;
            --accent-color: #4a90e2;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--primary-color) 0%, #0d1b2a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .otp-container {
            width: 100%;
            max-width: 450px;
            padding: 2rem;
        }
        
        .otp-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
        }
        
        .otp-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--accent-color), var(--secondary-color));
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
        }
        
        .otp-icon i {
            font-size: 2.5rem;
            color: white;
        }
        
        .otp-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }
        
        .otp-subtitle {
            color: #6c757d;
            margin-bottom: 2rem;
        }
        
        .otp-inputs {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            margin-bottom: 2rem;
        }
        
        .otp-input {
            width: 50px;
            height: 56px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 600;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            transition: all 0.3s;
        }
        
        .otp-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 0.2rem rgba(74, 144, 226, 0.15);
            outline: none;
        }
        
        .btn-verify {
            width: 100%;
            padding: 0.875rem;
            font-size: 1.1rem;
            font-weight: 600;
            background: linear-gradient(135deg, var(--accent-color), var(--secondary-color));
            border: none;
            border-radius: 12px;
            color: white;
            transition: all 0.3s ease;
        }
        
        .btn-verify:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(74, 144, 226, 0.4);
        }
        
        .backup-link {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e9ecef;
        }
        
        .backup-link a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 500;
        }
        
        .backup-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="otp-container">
        <div class="otp-card">
            <div class="otp-icon">
                <i class="bi bi-shield-check"></i>
            </div>
            
            <h1 class="otp-title">{% trans 'التحقق بخطوتين' %}</h1>
            <p class="otp-subtitle">
                {% trans 'أدخل رمز التحقق من تطبيق المصادقة' %}
            </p>
            
            {% if error %}
                <div class="alert alert-danger" role="alert">
                    {% trans 'رمز التحقق غير صحيح. يرجى المحاولة مرة أخرى.' %}
                </div>
            {% endif %}
            
            <form method="post" id="otpForm">
                {% csrf_token %}
                <input type="hidden" name="username" value="{{ username }}">
                
                <div class="otp-inputs">
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" required data-index="0">
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" required data-index="1">
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" required data-index="2">
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" required data-index="3">
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" required data-index="4">
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" required data-index="5">
                </div>
                
                <input type="hidden" name="otp_token" id="otp_token">
                
                <button type="submit" class="btn btn-verify">
                    {% trans 'تحقق' %}
                </button>
            </form>
            
            <div class="backup-link">
                <a href="#" onclick="showBackupCodeInput(); return false;">
                    {% trans 'استخدام رمز احتياطي' %}
                </a>
            </div>
        </div>
    </div>
    
    <script>
        const inputs = document.querySelectorAll('.otp-input');
        const form = document.getElementById('otpForm');
        const hiddenInput = document.getElementById('otp_token');
        
        inputs.forEach((input, index) => {
            input.addEventListener('input', function(e) {
                if (e.target.value.length === 1) {
                    if (index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                }
                updateHiddenInput();
            });
            
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
            
            input.addEventListener('paste', function(e) {
                e.preventDefault();
                const pastedData = e.clipboardData.getData('text').slice(0, 6);
                pastedData.split('').forEach((char, i) => {
                    if (inputs[i]) {
                        inputs[i].value = char;
                    }
                });
                if (pastedData.length === 6) {
                    inputs[5].focus();
                }
                updateHiddenInput();
            });
        });
        
        function updateHiddenInput() {
            const code = Array.from(inputs).map(input => input.value).join('');
            hiddenInput.value = code;
        }
        
        form.addEventListener('submit', function(e) {
            updateHiddenInput();
            if (hiddenInput.value.length !== 6) {
                e.preventDefault();
                alert('{% trans "يرجى إدخال رمز التحقق كاملاً" %}');
            }
        });
        
        function showBackupCodeInput() {
            const backupCode = prompt('{% trans "أدخل الرمز الاحتياطي" %}');
            if (backupCode) {
                hiddenInput.value = backupCode;
                form.submit();
            }
        }
        
        // Auto-focus first input
        inputs[0].focus();
    </script>
</body>
</html>
