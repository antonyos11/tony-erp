{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول — RITA ERP</title>
    <!-- Bootstrap 5 RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #1a237e 0%, #283593 40%, #1565c0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
        }
        .login-logo {
            font-size: 2rem;
            font-weight: 800;
            color: #1a237e;
            letter-spacing: 1px;
        }
        .login-logo span {
            color: #1565c0;
        }
        .form-control:focus {
            border-color: #1565c0;
            box-shadow: 0 0 0 0.2rem rgba(21, 101, 192, 0.25);
        }
        .btn-login {
            background: linear-gradient(135deg, #1a237e, #1565c0);
            border: none;
            border-radius: 8px;
            padding: 0.6rem 1.5rem;
            font-size: 1rem;
            letter-spacing: 0.5px;
            transition: opacity 0.2s;
        }
        .btn-login:hover { opacity: 0.9; }
        .input-group-text { background: #f8f9fa; }
    </style>
</head>
<body>
    <div class="login-card">
        <!-- الشعار -->
        <div class="text-center mb-4">
            <div class="login-logo mb-1">RITA <span>ERP</span></div>
            <p class="text-muted small">نظام إدارة موارد المصنع</p>
        </div>

        <h5 class="fw-bold mb-3 text-center">تسجيل الدخول</h5>

        <!-- رسائل الخطأ -->
        {% if form.errors %}
        <div class="alert alert-danger py-2 small">
            <i class="bi bi-exclamation-triangle me-1"></i>
            اسم المستخدم أو كلمة المرور غير صحيحة.
        </div>
        {% endif %}

        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-{{ message.tags|default:'info' }} py-2 small">{{ message }}</div>
        {% endfor %}
        {% endif %}

        <!-- النموذج -->
        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">

            <div class="mb-3">
                <label for="id_username" class="form-label fw-semibold">اسم المستخدم</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input
                        type="text"
                        name="username"
                        id="id_username"
                        class="form-control"
                        placeholder="أدخل اسم المستخدم"
                        autofocus
                        required
                    >
                </div>
            </div>

            <div class="mb-4">
                <label for="id_password" class="form-label fw-semibold">كلمة المرور</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input
                        type="password"
                        name="password"
                        id="id_password"
                        class="form-control"
                        placeholder="أدخل كلمة المرور"
                        required
                    >
                </div>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-login text-white">
                    <i class="bi bi-box-arrow-in-right me-2"></i>دخول
                </button>
            </div>
        </form>

        <hr class="my-4">
        <p class="text-center text-muted small mb-0">
            RITA ERP &copy; {% now "Y" %}
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
