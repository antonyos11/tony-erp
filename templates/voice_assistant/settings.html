{% extends BASE_TEMPLATE %}
{% load static %}

{% block title %}إعدادات المساعد الصوتي - Tony ERP{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row mb-4">
        <div class="col-12">
            <h2><i class="bi bi-mic text-info me-2"></i>إعدادات المساعد الصوتي</h2>
        </div>
    </div>
    
    <div class="row">
        <div class="col-md-8">
            <form method="post">
                {% csrf_token %}
                
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="bi bi-gear me-2"></i>إعدادات عامة</h5>
                    </div>
                    <div class="card-body">
                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" name="is_enabled" id="isEnabled"
                                   {% if preference.is_enabled %}checked{% endif %}>
                            <label class="form-check-label" for="isEnabled">تفعيل المساعد الصوتي</label>
                        </div>
                        
                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" name="auto_listen" id="autoListen"
                                   {% if preference.auto_listen %}checked{% endif %}>
                            <label class="form-check-label" for="autoListen">الاستماع التلقائي (يبدأ عند قول كلمة التفعيل)</label>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">كلمة التفعيل</label>
                            <input type="text" class="form-control" name="wake_word" 
                                   value="{{ preference.wake_word|default:'يا نظام' }}">
                            <small class="text-muted">الكلمة التي تبدأ بها للتحدث للمساعد</small>
                        </div>
                    </div>
                </div>
                
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="bi bi-volume-up me-2"></i>إعدادات الصوت</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label">نوع الصوت</label>
                            <select class="form-select" name="voice_type">
                                <option value="female_ar" {% if preference.voice_type == 'female_ar' %}selected{% endif %}>أنثى - عربي</option>
                                <option value="male_ar" {% if preference.voice_type == 'male_ar' %}selected{% endif %}>ذكر - عربي</option>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">سرعة الكلام</label>
                            <input type="range" class="form-range" name="speech_rate" 
                                   min="0.5" max="2" step="0.1" value="{{ preference.speech_rate|default:1 }}">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">اللغة</label>
                            <select class="form-select" name="language">
                                <option value="ar-SA" {% if preference.language == 'ar-SA' %}selected{% endif %}>العربية (مصر)</option>
                                <option value="ar-EG" {% if preference.language == 'ar-EG' %}selected{% endif %}>العربية (مصر)</option>
                                <option value="en-US" {% if preference.language == 'en-US' %}selected{% endif %}>English</option>
                            </select>
                        </div>
                        
                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" name="read_responses" id="readResponses"
                                   {% if preference.read_responses %}checked{% endif %}>
                            <label class="form-check-label" for="readResponses">قراءة الردود صوتياً</label>
                        </div>
                    </div>
                </div>
                
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="bi bi-shield-check me-2"></i>الأمان</h5>
                    </div>
                    <div class="card-body">
                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" name="confirm_actions" id="confirmActions"
                                   {% if preference.confirm_actions %}checked{% endif %}>
                            <label class="form-check-label" for="confirmActions">تأكيد الإجراءات قبل التنفيذ</label>
                        </div>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary btn-lg">
                    <i class="bi bi-check-lg me-2"></i>حفظ الإعدادات
                </button>
            </form>
        </div>
        
        <div class="col-md-4">
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0"><i class="bi bi-mic me-2"></i>اختبار</h5>
                </div>
                <div class="card-body text-center">
                    <button class="btn btn-lg btn-primary" onclick="testVoice()">
                        <i class="bi bi-play-fill me-2"></i>اختبار الصوت
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function testVoice() {
    const msg = new SpeechSynthesisUtterance('مرحباً، أنا مساعدك الصوتي');
    msg.lang = 'ar-SA';
    speechSynthesis.speak(msg);
}
</script>
{% endblock %}
