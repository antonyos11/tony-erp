{% extends BASE_TEMPLATE %}
{% block title %}العلاقات العمالية{% endblock %}
{% block content %}
<div class="container">
  <h3 class="mb-3">العلاقات العمالية</h3>
  <div class="row g-3">
    <div class="col-md-6">
      <div class="card">
        <div class="card-body d-flex justify-content-between align-items-center">
          <div>
            <div class="text-muted small">الشكاوى والملاحظات</div>
            <div class="h4 mb-0">{{ complaints_count|default:0 }}</div>
          </div>
          <a class="btn btn-outline-primary btn-sm" href="{% url 'hr:complaint_list' %}">عرض</a>
        </div>
      </div>
    </div>
    <div class="col-md-6">
      <div class="card">
        <div class="card-body d-flex justify-content-between align-items-center">
          <div>
            <div class="text-muted small">المخالفات والجزاءات</div>
            <div class="h4 mb-0">{{ disciplinary_count|default:0 }}</div>
          </div>
          <a class="btn btn-outline-primary btn-sm" href="{% url 'hr:disciplinary_list' %}">عرض</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
