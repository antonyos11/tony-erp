<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>بطاقة هوية - {{ employee.get_full_name }}</title>
    <style>
        @page {
            size: 85.6mm 53.98mm;
            margin: 0;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
        }
        .id-card {
            width: 85.6mm;
            height: 53.98mm;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            padding: 10px;
            color: white;
            box-sizing: border-box;
        }
        .header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .company-name {
            font-size: 12px;
            font-weight: bold;
        }
        .employee-photo {
            width: 50px;
            height: 60px;
            background: white;
            border-radius: 5px;
        }
        .employee-name {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .employee-info {
            font-size: 10px;
        }
        .card-number {
            position: absolute;
            bottom: 10px;
            left: 10px;
            font-size: 9px;
        }
    </style>
</head>
<body>
    <div class="id-card">
        <div class="header">
            <div>
                <div class="company-name">{{ company_name }}</div>
                <div style="font-size: 9px;">بطاقة هوية موظف</div>
            </div>
            <div class="employee-photo">
                {% if employee.photo %}
                <img src="{ employee.photo.url }}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 5px;" alt=""
                {% endif %}
            </div>
        </div>
        
        <div class="employee-name">{{ employee.get_full_name }}</div>
        <div class="employee-info">
            <div>{{ employee.position.name|default:"-" }}</div>
            <div>{{ employee.department.name|default:"-" }}</div>
            <div>الرقم الوظيفي: {{ employee.employee_number }}</div>
        </div>
        
        <div class="card-number">{{ card.card_number }}</div>
    </div>
</body>
</html>
