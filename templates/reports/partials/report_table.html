{# جزئي لعرض جدول تقرير قياسي #}
<div class="table-responsive"><table class="table table-sm table-striped table-hover align-middle">
  <thead class="table-light">
    <tr>
      {% for col in columns %}
        <th scope="col">{{ col }}</th>
      {% endfor %}
    </tr>
  </thead>
  <tbody>
    {% if rows %}
      {% for row in rows %}
        <tr>
          {% for cell in row %}
            <td>{{ cell }}</td>
          {% endfor %}
        </tr>
      {% endfor %}
    {% else %}
      <tr><td colspan="{{ columns|length }}" class="text-center text-muted">لا توجد بيانات</td></tr>
    {% endif %}
  </tbody>
</table></div>
