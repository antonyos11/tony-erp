{# أزرار مشتركة للتقارير: تصدير CSV/XLSX وطباعة #}
<div class="d-flex flex-wrap gap-2 mb-3">
  <a href="?{{ request.GET.urlencode }}{% if request.GET %}&{% endif %}export=csv" class="btn btn-sm btn-outline-secondary">
    <i class="bi bi-filetype-csv"></i> تصدير CSV
  </a>
  <a href="?{{ request.GET.urlencode }}{% if request.GET %}&{% endif %}export=xlsx" class="btn btn-sm btn-outline-success">
    <i class="bi bi-file-earmark-spreadsheet"></i> Excel
  </a>
  <button type="button" class="btn btn-sm btn-outline-dark" onclick="window.print()">
    <i class="bi bi-printer"></i> طباعة
  </button>
</div>
