<!-- فلتر التقارير المشترك -->
<form method="get" class="card border-0 shadow-sm mb-4">
    <div class="card-body">
        <div class="row g-2 align-items-end">
            <div class="col-md-3">
                <label class="form-label small fw-bold">من تاريخ</label>
                <input type="date" name="start_date" class="form-control form-control-sm" value="{{ start_date }}">
            </div>
            <div class="col-md-3">
                <label class="form-label small fw-bold">إلى تاريخ</label>
                <input type="date" name="end_date" class="form-control form-control-sm" value="{{ end_date }}">
            </div>
            {% if branches %}
            <div class="col-md-3">
                <label class="form-label small fw-bold">الفرع</label>
                <select name="branch" class="form-select form-select-sm">
                    <option value="">— الكل —</option>
                    {% for b in branches %}
                    <option value="{{ b.pk }}" {% if selected_branch == b.pk|stringformat:"s" %}selected{% endif %}>{{ b.name }}</option>
                    {% endfor %}
                </select>
            </div>
            {% endif %}
            <div class="col-md-3">
                <button type="submit" class="btn btn-primary btn-sm w-100">
                    <i class="bi bi-funnel me-1"></i>تطبيق الفلتر
                </button>
            </div>
        </div>
        {% block extra_filters %}{% endblock %}
    </div>
</form>
