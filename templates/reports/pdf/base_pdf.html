<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<style>
  @page {
    size: A4;
    margin: 1.5cm;
  }
  body {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 10pt;
    direction: rtl;
    color: #333;
  }
  .header {
    border-bottom: 3px solid #1a73e8;
    padding-bottom: 10px;
    margin-bottom: 15px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .company-name {
    font-size: 18pt;
    font-weight: bold;
    color: #1a73e8;
  }
  .report-title {
    font-size: 14pt;
    font-weight: bold;
    color: #333;
    margin: 5px 0;
  }
  .report-meta {
    font-size: 9pt;
    color: #666;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
    font-size: 9pt;
  }
  th {
    background-color: #1a73e8;
    color: white;
    padding: 6px 8px;
    text-align: center;
    font-weight: bold;
  }
  td {
    padding: 5px 8px;
    text-align: center;
    border-bottom: 1px solid #e0e0e0;
  }
  tr:nth-child(even) td {
    background-color: #f8f9fa;
  }
  .total-row td {
    background-color: #e8f0fe !important;
    font-weight: bold;
    border-top: 2px solid #1a73e8;
  }
  .footer {
    margin-top: 20px;
    border-top: 1px solid #ccc;
    padding-top: 8px;
    font-size: 8pt;
    color: #888;
    text-align: center;
  }
  .summary-box {
    background-color: #f0f7ff;
    border: 1px solid #1a73e8;
    border-radius: 4px;
    padding: 10px 15px;
    margin-bottom: 15px;
  }
  .summary-row {
    display: flex;
    justify-content: space-between;
    padding: 3px 0;
    border-bottom: 1px solid #dde;
  }
  .summary-label { color: #555; }
  .summary-value { font-weight: bold; color: #1a73e8; }
  .highlight { color: #d32f2f; font-weight: bold; }
  .positive { color: #2e7d32; font-weight: bold; }
</style>
</head>
<body>
<div class="header">
  <div>
    <div class="company-name">RITA ERP</div>
    <div class="report-title">{{ title }}</div>
    <div class="report-meta">
      {% if start_date %}الفترة: {{ start_date }} إلى {{ end_date }}{% endif %}
      {% if branch %} | الفرع: {{ branch.name }}{% endif %}
    </div>
  </div>
  <div class="report-meta" style="text-align:left;">
    <div>تاريخ الطباعة:</div>
    <div>{{ now|default:"" }}</div>
  </div>
</div>

{% block content %}{% endblock %}

<div class="footer">
  نظام RITA ERP — تم إنشاؤه تلقائياً — {{ now }}
</div>
</body>
</html>
