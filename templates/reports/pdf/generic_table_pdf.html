<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<style>
@page { size: A4 landscape; margin: 1.5cm; }
body { font-family: Arial, Helvetica, sans-serif; font-size: 9pt; direction: rtl; color: #333; }
.header { border-bottom: 3px solid #1a73e8; padding-bottom: 8px; margin-bottom: 12px; }
.company { font-size: 16pt; font-weight: bold; color: #1a73e8; }
.report-title { font-size: 12pt; font-weight: bold; margin: 4px 0; }
.meta { font-size: 8pt; color: #666; }
table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 8pt; }
th { background-color: #1a73e8; color: white; padding: 5px 6px; text-align: center; font-weight: bold; }
td { padding: 4px 6px; text-align: center; border: 1px solid #ddd; }
tr:nth-child(even) td { background-color: #f8f9fa; }
.footer { margin-top: 15px; border-top: 1px solid #ccc; padding-top: 6px; font-size: 8pt; color: #888; text-align: center; }
</style>
</head>
<body>
<div class="header">
  <div class="company">RITA ERP</div>
  <div class="report-title">{{ title }}</div>
  <div class="meta">
    {% if start_date %}الفترة: {{ start_date }} إلى {{ end_date }}{% endif %}
  </div>
</div>

<table>
  <thead>
    <tr>
      {% for h in headers %}<th>{{ h }}</th>{% endfor %}
    </tr>
  </thead>
  <tbody>
    {% for row in data %}
    <tr>
      {% for cell in row %}<td>{{ cell }}</td>{% endfor %}
    </tr>
    {% empty %}
    <tr><td colspan="{{ headers|length }}">لا توجد بيانات</td></tr>
    {% endfor %}
  </tbody>
</table>

<div class="footer">نظام RITA ERP — تم إنشاؤه تلقائياً</div>
</body>
</html>
