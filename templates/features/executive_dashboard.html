{% extends BASE_TEMPLATE %}
{% load i18n static %}

{% block title %}لوحة القيادة التنفيذية{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row mb-4">
        <div class="col-12">
            <div class="card shadow-sm">
                <div class="card-header bg-gradient-danger text-white">
                    <h3 class="mb-0">
                        <i class="bi bi-speedometer2 me-2"></i>
                        لوحة القيادة التنفيذية
                    </h3>
                </div>
                <div class="card-body">
                    <div class="row mb-4">
                        <!-- KPIs الرئيسية -->
                        <div class="col-md-3 mb-3">
                            <div class="card bg-primary text-white">
                                <div class="card-body">
                                    <h6 class="opacity-75">الإيرادات الشهرية</h6>
                                    <h3 id="monthlyRevenue">-</h3>
                                    <small id="revenueChange"></small>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-3 mb-3">
                            <div class="card bg-success text-white">
                                <div class="card-body">
                                    <h6 class="opacity-75">صافي الربح</h6>
                                    <h3 id="netProfit">-</h3>
                                    <small id="profitChange"></small>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-3 mb-3">
                            <div class="card bg-info text-white">
                                <div class="card-body">
                                    <h6 class="opacity-75">هامش الربح</h6>
                                    <h3 id="profitMargin">-</h3>
                                    <small id="marginChange"></small>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-3 mb-3">
                            <div class="card bg-warning text-dark">
                                <div class="card-body">
                                    <h6 class="opacity-75">معدل النمو</h6>
                                    <h3 id="growthRate">-</h3>
                                    <small id="growthChange"></small>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <div class="card">
                                <div class="card-header">
                                    <h5>الإيرادات حسب المنتج</h5>
                                </div>
                                <div class="card-body">
                                    <canvas id="revenueByProductChart"></canvas>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <div class="card">
                                <div class="card-header">
                                    <h5>اتجاه المبيعات</h5>
                                </div>
                                <div class="card-body">
                                    <canvas id="salesTrendChart"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
// تحميل البيانات عند تحميل الصفحة
document.addEventListener('DOMContentLoaded', function() {
    loadExecutiveData();
});

async function loadExecutiveData() {
    try {
        // هنا يمكن إضافة استدعاء API لجلب البيانات الفعلية
        // عرض بيانات تجريبية للتوضيح
        document.getElementById('monthlyRevenue').textContent = '850,000 ج.م';
        document.getElementById('revenueChange').innerHTML = '<i class="bi bi-arrow-up"></i> 12.5%';
        
        document.getElementById('netProfit').textContent = '215,000 ج.م';
        document.getElementById('profitChange').innerHTML = '<i class="bi bi-arrow-up"></i> 8.3%';
        
        document.getElementById('profitMargin').textContent = '25.3%';
        document.getElementById('marginChange').innerHTML = '<i class="bi bi-arrow-down"></i> 1.2%';
        
        document.getElementById('growthRate').textContent = '18.7%';
        document.getElementById('growthChange').innerHTML = '<i class="bi bi-arrow-up"></i> 3.5%';
    } catch (error) {
        console.error('خطأ في تحميل البيانات:', error);
    }
}
</script>
{% endblock %}
