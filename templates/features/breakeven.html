{% extends BASE_TEMPLATE %}
{% load i18n static %}

{% block title %}تحليل نقطة التعادل{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row mb-4">
        <div class="col-12">
            <div class="card shadow-sm">
                <div class="card-header bg-gradient-warning text-dark">
                    <h3 class="mb-0">
                        <i class="bi bi-graph-up me-2"></i>
                        تحليل نقطة التعادل التلقائي
                    </h3>
                </div>
                <div class="card-body">
                    <p class="text-muted">احسب نقطة التعادل لكل منتج تلقائياً</p>
                    
                    <form id="breakevenForm" class="mt-4">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">المنتج</label>
                                <select name="product_id" class="form-select" required>
                                    <option value="">اختر المنتج...</option>
                                    <!-- سيتم تحميل المنتجات ديناميكياً -->
                                </select>
                            </div>
                            <div class="col-md-6 mb-3 d-flex align-items-end">
                                <button type="submit" class="btn btn-warning w-100">
                                    <i class="bi bi-calculator me-2"></i>
                                    احسب نقطة التعادل
                                </button>
                            </div>
                        </div>
                    </form>
                    
                    <div id="breakevenResult" class="mt-4" style="display: none;">
                        <div class="row">
                            <div class="col-md-4">
                                <div class="card bg-light">
                                    <div class="card-body text-center">
                                        <h6 class="text-muted">نقطة التعادل (وحدات)</h6>
                                        <h3 id="breakevenUnits" class="text-primary">-</h3>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="card bg-light">
                                    <div class="card-body text-center">
                                        <h6 class="text-muted">نقطة التعادل (قيمة)</h6>
                                        <h3 id="breakevenValue" class="text-success">-</h3>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="card bg-light">
                                    <div class="card-body text-center">
                                        <h6 class="text-muted">هامش المساهمة</h6>
                                        <h3 id="contributionMargin" class="text-warning">-</h3>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="mt-3">
                            <canvas id="breakevenChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
document.getElementById('breakevenForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const formData = new FormData(this);
    const productId = formData.get('product_id');
    
    try {
        const response = await fetch(`/accounting/break-even/calculate/?product_id=${productId}`);
        const data = await response.json();
        
        if (data.success) {
            document.getElementById('breakevenUnits').textContent = data.breakeven_units;
            document.getElementById('breakevenValue').textContent = data.breakeven_value + ' ر.س';
            document.getElementById('contributionMargin').textContent = data.contribution_margin + '%';
            document.getElementById('breakevenResult').style.display = 'block';
        } else {
            alert('حدث خطأ في الحساب');
        }
    } catch (error) {
        alert('حدث خطأ في الاتصال');
    }
});
</script>
{% endblock %}
