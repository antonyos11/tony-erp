{% extends 'base.html' %}
{% load i18n %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <i class="fas fa-plus me-2"></i>{{ title }}
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label">{% trans "المعرض" %} *</label>
                            <select name="showroom" class="form-select" required>
                                <option value="">{% trans "اختر المعرض" %}</option>
                                {% for s in showrooms %}
                                <option value="{{ s.pk }}">
                                    {{ s.name_ar|default:s.name }} - {{ s.monthly_rent|floatformat:0 }} ج.م/شهر
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">{% trans "تاريخ الاستحقاق" %} *</label>
                            <input type="date" name="payment_date" class="form-control" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">{% trans "المبلغ" %} *</label>
                            <input type="number" name="amount" class="form-control" step="0.01" min="0" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">{% trans "ملاحظات" %}</label>
                            <textarea name="notes" class="form-control" rows="2"></textarea>
                        </div>
                        
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'showrooms:rent_payments' %}" class="btn btn-secondary">
                                <i class="fas fa-times me-1"></i>{% trans "إلغاء" %}
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-1"></i>{% trans "حفظ" %}
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
