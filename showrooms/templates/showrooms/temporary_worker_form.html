{% extends 'base.html' %}
{% load i18n %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <i class="fas fa-user-plus me-2"></i>{{ title }}
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">{% trans "المعرض" %} *</label>
                                <select name="showroom" class="form-select" required>
                                    <option value="">{% trans "اختر المعرض" %}</option>
                                    {% for s in showrooms %}
                                    <option value="{{ s.pk }}">{{ s.name_ar|default:s.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">{% trans "نوع العامل" %} *</label>
                                <select name="worker_type" class="form-select" required>
                                    <option value="daily">{% trans "يومي" %}</option>
                                    <option value="contract">{% trans "مقاولة" %}</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">{% trans "اسم العامل" %} *</label>
                                <input type="text" name="worker_name" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">{% trans "رقم الهاتف" %}</label>
                                <input type="text" name="worker_phone" class="form-control">
                            </div>
                        </div>
                        
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">{% trans "الرقم القومي" %}</label>
                                <input type="text" name="national_id" class="form-control" maxlength="14">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">{% trans "الوظيفة" %} *</label>
                                <input type="text" name="job_title" class="form-control" required placeholder="{% trans 'مثال: حامل، مساعد، ...' %}">
                            </div>
                        </div>
                        
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">{% trans "الأجر اليومي" %}</label>
                                <input type="number" name="daily_wage" class="form-control" step="0.01" min="0">
                                <small class="text-muted">{% trans "للعمالة اليومية" %}</small>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">{% trans "إجمالي المقاولة" %}</label>
                                <input type="number" name="total_contract_amount" class="form-control" step="0.01" min="0">
                                <small class="text-muted">{% trans "لعقود المقاولة" %}</small>
                            </div>
                        </div>
                        
                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label class="form-label">{% trans "تاريخ البداية" %} *</label>
                                <input type="date" name="start_date" class="form-control" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">{% trans "تاريخ النهاية" %}</label>
                                <input type="date" name="end_date" class="form-control">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">{% trans "أيام العمل" %}</label>
                                <input type="number" name="days_worked" class="form-control" min="0" value="0">
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">{% trans "ملاحظات" %}</label>
                            <textarea name="notes" class="form-control" rows="3"></textarea>
                        </div>
                        
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'showrooms:temporary_workers' %}" class="btn btn-secondary">
                                <i class="fas fa-times me-1"></i>{% trans "إلغاء" %}
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-1"></i>{% trans "حفظ" %}
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
