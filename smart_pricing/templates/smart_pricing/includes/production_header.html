<div class="row mb-4">
    <div class="col">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">

                <li class="breadcrumb-item"><a href="{% url 'smart_pricing:production_line_suggestion' %}">ترشيح خط الإنتاج</a></li>
                <li class="breadcrumb-item active" aria-current="page">{{ title }}</li>
            </ol>
        </nav>
        <h2>{{ title }}</h2>
        <p class="text-muted">{{ subtitle }}</p>
    </div>
</div>

<div class="row mb-4">
    <div class="col">
        <ul class="nav nav-pills bg-white p-2 rounded shadow-sm d-inline-flex">
            <li class="nav-item">
                <a class="nav-link {% if active_tab == 'capacity' %}active{% endif %}" href="{% url 'smart_pricing:production_line_capacity' %}">
                    <i class="fas fa-chart-bar me-2"></i>السعة الإنتاجية
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if active_tab == 'efficiency' %}active{% endif %}" href="{% url 'smart_pricing:production_line_efficiency' %}">
                    <i class="fas fa-tachometer-alt me-2"></i>الكفاءة
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if active_tab == 'ai' %}active{% endif %}" href="{% url 'smart_pricing:production_line_ai' %}">
                    <i class="fas fa-robot me-2"></i>الذكاء الاصطناعي
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if active_tab == 'cost' %}active{% endif %}" href="{% url 'smart_pricing:production_line_cost' %}">
