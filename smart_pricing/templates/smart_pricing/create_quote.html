{% extends "base.html" %}
{% load i18n humanize static %}

{% block title %}{{ title }} | {{ block.super }}{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-md-8">
        <h1 class="h3 gradient-text fw-bold">
            <i class="bi bi-file-earmark-plus me-2"></i>{{ title }}
        </h1>
    </div>
</div>

<div class="card glass-card">
    <div class="card-body">
        <form method="post" class="row g-3">
            {% csrf_token %}
            
            <div class="col-md-6">
                <label for="customer_id" class="form-label">{% trans "العميل" %}</label>
                <select name="customer_id" id="customer_id" class="form-select" required>
                    <option value="">{% trans "--- اختر العميل ---" %}</option>
                    {% for customer in customers %}
                    <option value="{{ customer.id }}">{{ customer.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-md-6">
                <label for="pricing_rule_id" class="form-label">{% trans "قاعدة التسعير" %}</label>
                <select name="pricing_rule_id" id="pricing_rule_id" class="form-select" required>
                    {% for rule in pricing_rules %}
                    <option value="{{ rule.id }}">{{ rule.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-md-12">
                <label for="product_name" class="form-label">{% trans "اسم المنتج / الوصف المختصر" %}</label>
                <input type="text" name="product_name" id="product_name" class="form-control" required>
            </div>

            <div class="col-md-12">
                <label for="description" class="form-label">{% trans "التفاصيل" %}</label>
                <textarea name="description" id="description" class="form-control" rows="3"></textarea>
            </div>

            <div class="col-md-3">
                <label for="quantity" class="form-label">{% trans "الكمية" %}</label>
                <input type="number" name="quantity" id="quantity" class="form-control" value="1" min="1" required>
            </div>

            <div class="col-md-3">
                <label for="size" class="form-label">{% trans "الحجم" %}</label>
                <select name="size" id="size" class="form-select">
                    {% for key, label in sizes %}
                    <option value="{{ key }}" {% if key == 'medium' %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-md-3">
                <label for="complexity" class="form-label">{% trans "التعقيد" %}</label>
                <select name="complexity" id="complexity" class="form-select">
                    {% for key, label in complexities %}
                    <option value="{{ key }}" {% if key == 'medium' %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-md-12">
                <hr>
                <h5>{% trans "الأبعاد (اختياري)" %}</h5>
            </div>

            <div class="col-md-4">
                <label for="width" class="form-label">{% trans "العرض" %}</label>
                <input type="number" step="0.01" name="width" id="width" class="form-control">
            </div>

            <div class="col-md-4">
                <label for="height" class="form-label">{% trans "الارتفاع" %}</label>
                <input type="number" step="0.01" name="height" id="height" class="form-control">
            </div>

            <div class="col-md-4">
                <label for="depth" class="form-label">{% trans "العمق" %}</label>
                <input type="number" step="0.01" name="depth" id="depth" class="form-control">
            </div>

            <div class="col-12 mt-4">
                <button type="submit" class="btn btn-primary px-5">
                    <i class="bi bi-calculator me-2"></i>{% trans "حساب وحفظ العرض" %}
                </button>
                <a href="{% url 'smart_pricing:quotes_list' %}" class="btn btn-outline-secondary ms-2">{% trans "إلغاء" %}</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
