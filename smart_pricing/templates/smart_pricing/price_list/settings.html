{% extends 'base.html' %}
{% load static %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-md-10">
            <div class="card">
                <div class="card-header">
                    <h4><i class="fas fa-cog me-2"></i>{{ title }}</h4>
                </div>
                <div class="card-body">
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        
                        <h5 class="mb-3">معلومات الشركة</h5>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">اسم الشركة (عربي)</label>
                                <input type="text" name="company_name" class="form-control" 
                                       value="{{ settings.company_name }}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">اسم الشركة (إنجليزي)</label>
                                <input type="text" name="company_name_en" class="form-control" 
                                       value="{{ settings.company_name_en }}">
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">الشعار</label>
                                <input type="file" name="logo" class="form-control" accept="image/*">
                                {% if settings.logo %}
                                <div class="mt-2">
                                    <img src="{{ settings.logo.url }}" height="50" alt="الشعار الحالي">
                                </div>
                                {% endif %}
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">العنوان</label>
                                <textarea name="address" class="form-control" rows="2">{{ settings.address }}</textarea>
                            </div>
                        </div>

                        <h5 class="mb-3 mt-4">معلومات التواصل</h5>
                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label class="form-label">الهاتف</label>
                                <input type="text" name="phone" class="form-control" 
                                       value="{{ settings.phone }}">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">البريد الإلكتروني</label>
                                <input type="email" name="email" class="form-control" 
                                       value="{{ settings.email }}">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">الموقع الإلكتروني</label>
                                <input type="url" name="website" class="form-control" 
                                       value="{{ settings.website }}">
                            </div>
                        </div>

                        <h5 class="mb-3 mt-4">إعدادات الضريبة</h5>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">نسبة الضريبة الافتراضية %</label>
                                <input type="number" name="default_tax_rate" class="form-control" 
                                       value="{{ settings.default_tax_rate }}" step="0.01">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">الرقم الضريبي</label>
                                <input type="text" name="tax_registration_number" class="form-control" 
                                       value="{{ settings.tax_registration_number }}">
                            </div>
                        </div>

                        <h5 class="mb-3 mt-4">نصوص قائمة الأسعار</h5>
                        <div class="mb-3">
                            <label class="form-label">نص صلاحية الأسعار</label>
                            <input type="text" name="price_validity_text" class="form-control" 
                                   value="{{ settings.price_validity_text }}">
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">ترويسة قائمة الأسعار</label>
                                <textarea name="price_list_header" class="form-control" rows="3">{{ settings.price_list_header }}</textarea>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">تذييل قائمة الأسعار</label>
                                <textarea name="price_list_footer" class="form-control" rows="3">{{ settings.price_list_footer }}</textarea>
                            </div>
                        </div>

                        <hr>

                        <div class="d-flex justify-content-between">
                            <a href="{% url 'smart_pricing:price_list_dashboard' %}" class="btn btn-secondary">
                                <i class="fas fa-arrow-right me-1"></i> رجوع
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-1"></i> حفظ الإعدادات
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
