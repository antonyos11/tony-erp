{% extends 'base.html' %}
{% load static %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h4>
                        {% if size %}
                        <i class="fas fa-edit me-2"></i>
                        {% else %}
                        <i class="fas fa-plus-circle me-2"></i>
                        {% endif %}
                        {{ title }}
                    </h4>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label class="form-label">العرض (سم) <span class="text-danger">*</span></label>
                                <input type="number" name="width" class="form-control" required min="1"
                                       value="{{ size.width|default:'' }}">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">الطول (سم) <span class="text-danger">*</span></label>
                                <input type="number" name="length" class="form-control" required min="1"
                                       value="{{ size.length|default:'' }}">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">الارتفاع (سم)</label>
                                <input type="number" name="height" class="form-control" min="1"
                                       value="{{ size.height|default:'' }}">
                                <small class="text-muted">اختياري</small>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label class="form-label">معامل السعر</label>
                                <input type="number" name="price_multiplier" class="form-control" 
                                       value="{% if size and size.price_multiplier %}{{ size.price_multiplier }}{% else %}1.000{% endif %}" step="0.001" min="0">
                                <small class="text-muted">يُضرب في السعر الأساسي</small>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">معامل التكلفة</label>
                                <input type="number" name="cost_multiplier" class="form-control" 
                                       value="{% if size and size.cost_multiplier %}{{ size.cost_multiplier }}{% else %}1.000{% endif %}" step="0.001" min="0">
                                <small class="text-muted">يُضرب في التكلفة الأساسية</small>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">ترتيب العرض</label>
                                <input type="number" name="sort_order" class="form-control" 
                                       value="{% if size %}{{ size.sort_order }}{% else %}0{% endif %}" min="0">
                            </div>
                        </div>

                        {% if size %}
                        <div class="mb-3">
                            <div class="form-check">
                                <input type="checkbox" name="is_active" class="form-check-input" id="is_active"
                                       {% if size.is_active %}checked{% endif %}>
                                <label class="form-check-label" for="is_active">نشط</label>
                            </div>
                        </div>
                        {% endif %}

                        <hr>

                        <div class="d-flex justify-content-between">
                            <a href="{% url 'smart_pricing:sizes_list' %}" class="btn btn-secondary">
                                <i class="fas fa-arrow-right me-1"></i> رجوع
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-1"></i> حفظ
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
