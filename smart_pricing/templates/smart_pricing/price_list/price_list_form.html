{% extends 'base.html' %}
{% load static %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h4><i class="fas fa-plus-circle me-2"></i>{{ title }}</h4>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label class="form-label">الكود <span class="text-danger">*</span></label>
                                <input type="text" name="code" class="form-control" required 
                                       placeholder="مثال: RETAIL">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">الاسم <span class="text-danger">*</span></label>
                                <input type="text" name="name" class="form-control" required 
                                       placeholder="مثال: أسعار القطاعي">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">الاسم بالإنجليزية</label>
                                <input type="text" name="name_en" class="form-control" 
                                       placeholder="Retail Prices">
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">نوع القائمة <span class="text-danger">*</span></label>
                                <select name="list_type" class="form-select" required>
                                    {% for value, label in list_types %}
                                    <option value="{{ value }}">{{ label }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">نسبة الخصم %</label>
                                <input type="number" name="discount_percentage" class="form-control" 
                                       value="0" step="0.01">
                                <small class="text-muted">استخدم قيمة سالبة للزيادة</small>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">الوصف</label>
                            <textarea name="description" class="form-control" rows="2"></textarea>
                        </div>

                        <div class="card mb-3">
                            <div class="card-header">
                                <h6 class="mb-0">إعدادات الضريبة</h6>
                            </div>
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="form-check form-switch mb-3">
                                            <input type="checkbox" name="includes_tax" class="form-check-input" 
                                                   id="includes_tax">
                                            <label class="form-check-label" for="includes_tax">
                                                الأسعار شاملة الضريبة
                                            </label>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">نسبة الضريبة %</label>
                                        <input type="number" name="tax_rate" class="form-control" 
                                               value="15" step="0.01" min="0" max="100">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <hr>

                        <div class="d-flex justify-content-between">
                            <a href="{% url 'smart_pricing:price_lists_list' %}" class="btn btn-secondary">
                                <i class="fas fa-arrow-right me-1"></i> رجوع
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-1"></i> حفظ
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
