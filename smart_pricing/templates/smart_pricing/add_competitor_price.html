{% extends "base.html" %}
{% load i18n static %}

{% block title %}{{ title }} | {{ block.super }}{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-md-8">
        <h1 class="h3 gradient-text fw-bold">
            <i class="bi bi-plus-circle me-2"></i>{{ title }}
        </h1>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card glass-card">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="competitor_id" class="form-label">{% trans "المنافس" %}</label>
                        <select name="competitor_id" id="competitor_id" class="form-select" required>
                            <option value="">{% trans "--- اختر المنافس ---" %}</option>
                            {% for competitor in competitors %}
                            <option value="{{ competitor.id }}" {% if request.GET.competitor_id == competitor.id|stringformat:"i" %}selected{% endif %}>
                                {{ competitor.name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="product_name" class="form-label">{% trans "اسم المنتج" %}</label>
                        <input type="text" name="product_name" id="product_name" class="form-control" required list="product-suggestions">
                        <datalist id="product-suggestions">
                            {% for product in products %}
                            <option value="{{ product.name }}">
                            {% endfor %}
                        </datalist>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="price" class="form-label">{% trans "السعر" %}</label>
                            <div class="input-group">
                                <input type="number" step="0.01" name="price" id="price" class="form-control" required>
                                <span class="input-group-text">SAR</span>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label for="source" class="form-label">{% trans "المصدر" %}</label>
                            <select name="source" id="source" class="form-select">
                                {% for key, label in sources %}
                                <option value="{{ key }}">{{ label }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="source_url" class="form-label">{% trans "رابط المصدر (اختياري)" %}</label>
                        <input type="url" name="source_url" id="source_url" class="form-control" placeholder="https://...">
                    </div>

                    <div class="mt-4">
                        <button type="submit" class="btn btn-primary px-5">{% trans "حفظ السعر" %}</button>
                        <a href="{% url 'smart_pricing:competitors_list' %}" class="btn btn-outline-secondary ms-2">{% trans "إلغاء" %}</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
