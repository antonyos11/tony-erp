{% extends BASE_TEMPLATE %}
{% block title %}{{ page_title }}{% endblock %}
{% block content %}
<div class="container-fluid">
    <h2 class="mb-4"><i class="fas fa-balance-scale me-2"></i>{{ page_title }}</h2>
    <div class="row mb-4">
        <div class="col-md-4"><div class="card bg-warning text-dark"><div class="card-body"><h5>كشوف معلقة</h5><h2>{{ pending_statements }}</h2></div></div></div>
        <div class="col-md-4"><div class="card bg-info text-white"><div class="card-body"><h5>قيد المطابقة</h5><h2>{{ in_progress }}</h2></div></div></div>
        <div class="col-md-4"><div class="card bg-success text-white"><div class="card-body"><h5>مكتملة</h5><h2>{{ completed }}</h2></div></div></div>
    </div>
    <div class="row mb-4"><div class="col-12"><div class="card"><div class="card-body">
        <a href="{% url 'bank_reconciliation:statement_upload' %}" class="btn btn-primary"><i class="fas fa-upload"></i> رفع كشف</a>
        <a href="{% url 'bank_reconciliation:statement_list' %}" class="btn btn-outline-primary"><i class="fas fa-list"></i> الكشوف</a>
        <a href="{% url 'bank_reconciliation:reconciliation_create' %}" class="btn btn-success"><i class="fas fa-plus"></i> مطابقة جديدة</a>
    </div></div></div></div>
</div>
{% endblock %}
