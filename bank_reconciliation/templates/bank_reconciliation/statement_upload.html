{% extends 'base.html' %}
{% block content %}
<div class="container"><h2 class="mb-4">{{ page_title }}</h2><div class="card"><div class="card-body">
<form method="post" enctype="multipart/form-data">{% csrf_token %}
<div class="row">
<div class="col-md-6 mb-3"><label>الحساب البنكي</label>{{ form.bank_account }}</div>
<div class="col-md-6 mb-3"><label>تاريخ الكشف</label>{{ form.statement_date }}</div>
<div class="col-md-6 mb-3"><label>من تاريخ</label>{{ form.start_date }}</div>
<div class="col-md-6 mb-3"><label>إلى تاريخ</label>{{ form.end_date }}</div>
<div class="col-md-6 mb-3"><label>الرصيد الافتتاحي</label>{{ form.opening_balance }}</div>
<div class="col-md-6 mb-3"><label>الرصيد الختامي</label>{{ form.closing_balance }}</div>
<div class="col-12 mb-3"><label>الملف</label>{{ form.file }}</div>
<div class="col-12 mb-3"><label>ملاحظات</label>{{ form.notes }}</div>
</div>
<button type="submit" class="btn btn-primary"><i class="fas fa-upload"></i> رفع</button>
</form></div></div></div>
{% endblock %}
