repos:
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        language_version: python3.13
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        args: [-q, -r, api, core, sales, inventory, partners, users]
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        additional_dependencies: [flake8-bugbear]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        additional_dependencies: [django-stubs, djangorestframework-stubs]
        files: '^((api|core|sales|inventory|partners|users)/|manage.py)'
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.15.2
    hooks:
      - id: pyupgrade
        args: [--py311-plus]
  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        args: [--ignore-words-list=teh,ba]
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
  - repo: local
    hooks:
      - id: emoji-scan
        name: Emoji / symbol scan
        entry: python tools/check_no_emojis.py
        language: system
        pass_filenames: false
      - id: django-check
        name: Django system check
        entry: python manage.py check --deploy --fail-level WARNING
        language: system
        pass_filenames: false
      - id: scan-untranslated
        name: Scan untranslated Arabic template strings
        entry: python tools/scan_untranslated_templates.py
        language: system
        pass_filenames: false
      - id: scan-untranslated-py
        name: Scan untranslated Arabic Python strings
        entry: python tools/scan_untranslated_python_strings.py
        language: system
        pass_filenames: false
