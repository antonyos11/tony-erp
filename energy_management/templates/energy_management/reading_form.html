{% extends 'base.html' %}
{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-plus-circle me-2"></i>{{ page_title }}</h2>
        <a href="{% url 'energy_management:reading_list' %}" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> العودة
        </a>
    </div>

    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">العداد *</label>
                        <select name="meter" class="form-select" required>
                            <option value="">اختر العداد</option>
                            {% for m in meters %}
                            <option value="{{ m.id }}">{{ m.meter_number }} - {{ m.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label class="form-label">تاريخ القراءة *</label>
                        <input type="date" name="reading_date" class="form-control" required>
                    </div>
                </div>
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">القراءة *</label>
                        <input type="number" name="reading_value" class="form-control" step="0.01" required>
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label class="form-label">الاستهلاك</label>
                        <input type="number" name="consumption" class="form-control" step="0.01" value="0">
                    </div>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">ملاحظات</label>
                    <textarea name="notes" class="form-control" rows="3"></textarea>
                </div>
                
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-circle"></i> حفظ القراءة
                    </button>
                    <a href="{% url 'energy_management:reading_list' %}" class="btn btn-secondary">
                        <i class="bi bi-x-circle"></i> إلغاء
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
