{% extends 'base.html' %}
{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-{% if meter %}pencil{% else %}plus-circle{% endif %} me-2"></i>{{ page_title }}</h2>
        <a href="{% url 'energy_management:meter_list' %}" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> العودة
        </a>
    </div>

    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">رقم العداد *</label>
                        <input type="text" name="meter_number" class="form-control" 
                               value="{{ meter.meter_number|default:'' }}" required>
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label class="form-label">نوع العداد *</label>
                        <select name="meter_type" class="form-select" required>
                            <option value="electricity" {% if meter.meter_type == 'electricity' %}selected{% endif %}>كهرباء</option>
                            <option value="water" {% if meter.meter_type == 'water' %}selected{% endif %}>مياه</option>
                            <option value="gas" {% if meter.meter_type == 'gas' %}selected{% endif %}>غاز</option>
                        </select>
                    </div>
                </div>
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">الاسم *</label>
                        <input type="text" name="name" class="form-control" 
                               value="{{ meter.name|default:'' }}" required>
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label class="form-label">الموقع</label>
                        <input type="text" name="location" class="form-control" 
                               value="{{ meter.location|default:'' }}">
                    </div>
                </div>
                
                {% if meter %}
                <div class="mb-3 form-check">
                    <input type="checkbox" name="is_active" class="form-check-input" id="is_active" {% if meter.is_active %}checked{% endif %}>
                    <label class="form-check-label" for="is_active">نشط</label>
                </div>
                {% endif %}
                
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-circle"></i> 
                        {% if meter %}تحديث{% else %}حفظ{% endif %}
                    </button>
                    <a href="{% url 'energy_management:meter_list' %}" class="btn btn-secondary">
                        <i class="bi bi-x-circle"></i> إلغاء
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
