{% extends 'base.html' %}
{% block content %}
<div class="container"><div class="card"><div class="card-body">
<h3>الموافقة على التحويل {{ transfer.transfer_number }}</h3>
<form method="post">{% csrf_token %}
<button type="submit" name="action" value="approve" class="btn btn-success"><i class="fas fa-check"></i> موافقة</button>
<button type="submit" name="action" value="reject" class="btn btn-danger"><i class="fas fa-times"></i> رفض</button>
<a href="{% url 'branches:transfer_detail' transfer.pk %}" class="btn btn-secondary">إلغاء</a>
<div class="mt-3"><label>سبب الرفض (اختياري)</label><textarea name="rejection_reason" class="form-control"></textarea></div>
</form>
</div></div></div>
{% endblock %}
