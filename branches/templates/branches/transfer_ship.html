{% extends 'base.html' %}
{% block content %}
<div class="container"><div class="card"><div class="card-body">
<h3>شحن التحويل {{ transfer.transfer_number }}</h3>
<form method="post">{% csrf_token %}
<div class="mb-3"><label>رقم التتبع</label><input type="text" name="tracking_number" class="form-control"></div>
<div class="mb-3"><label>شركة الشحن</label><input type="text" name="carrier_name" class="form-control"></div>
<button type="submit" class="btn btn-info"><i class="fas fa-truck"></i> تأكيد الشحن</button>
<a href="{% url 'branches:transfer_detail' transfer.pk %}" class="btn btn-secondary">إلغاء</a>
</form>
</div></div></div>
{% endblock %}
