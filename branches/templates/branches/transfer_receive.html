{% extends 'base.html' %}
{% block content %}
<div class="container"><div class="card"><div class="card-body">
<h3>استلام التحويل {{ transfer.transfer_number }}</h3>
<form method="post">{% csrf_token %}
<div class="table-responsive"><table class="table"><thead><tr><th>المنتج</th><th>الكمية المطلوبة</th><th>الكمية المستلمة</th></tr></thead>
<tbody>{% for item in items %}<tr><td>{{ item.product.name }}</td><td>{{ item.quantity }}</td><td><input type="number" name="received_{{ item.id }}" value="{{ item.quantity }}" step="0.001" class="form-control" style="width:120px"></td></tr>{% endfor %}</tbody></table></div>
<button type="submit" class="btn btn-primary"><i class="fas fa-box"></i> تأكيد الاستلام</button>
<a href="{% url 'branches:transfer_detail' transfer.pk %}" class="btn btn-secondary">إلغاء</a>
</form>
</div></div></div>
{% endblock %}
