# Tony ERP Production Docker Compose
# Complete production deployment stack

version: '3.8'

services:
  # ========================================
  # Django Application
  # ========================================
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.prod
    container_name: tony_erp_web
    restart: unless-stopped
    environment:
      - DEBUG=False
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - SECRET_KEY=${SECRET_KEY}
      - FERNET_KEYS=${FERNET_KEYS}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - SITE_URL=${SITE_URL}
      # Payment gateways
      - PAYMOB_API_KEY=${PAYMOB_API_KEY}
      - PAYMOB_INTEGRATION_ID=${PAYMOB_INTEGRATION_ID}
      - PAYMOB_IFRAME_ID=${PAYMOB_IFRAME_ID}
      - PAYMOB_HMAC_SECRET=${PAYMOB_HMAC_SECRET}
      - FAWRY_MERCHANT_CODE=${FAWRY_MERCHANT_CODE}
      - FAWRY_SECURITY_KEY=${FAWRY_SECURITY_KEY}
      # Email
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      # Analytics
      - GA4_MEASUREMENT_ID=${GA4_MEASUREMENT_ID}
      - FB_PIXEL_ID=${FB_PIXEL_ID}
      # Monitoring
      - SENTRY_DSN=${SENTRY_DSN}
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/var/log/tony_erp
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tony_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ========================================
  # Celery Worker
  # ========================================
  celery:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.prod
    container_name: tony_erp_celery
    restart: unless-stopped
    command: celery -A accountant_pro worker -l info --concurrency=4
    environment:
      - DEBUG=False
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - SECRET_KEY=${SECRET_KEY}
      - FERNET_KEYS=${FERNET_KEYS}
    volumes:
      - logs_volume:/var/log/tony_erp
    depends_on:
      - web
      - redis
    networks:
      - tony_network

  # ========================================
  # Celery Beat (Scheduler)
  # ========================================
  celery-beat:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.prod
    container_name: tony_erp_celery_beat
    restart: unless-stopped
    command: celery -A accountant_pro beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      - DEBUG=False
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      - celery
    networks:
      - tony_network

  # ========================================
  # PostgreSQL Database
  # ========================================
  db:
    image: postgres:15-alpine
    container_name: tony_erp_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - tony_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================
  # Redis Cache & Message Broker
  # ========================================
  redis:
    image: redis:7-alpine
    container_name: tony_erp_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - tony_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================
  # Nginx Reverse Proxy
  # ========================================
  nginx:
    image: nginx:alpine
    container_name: tony_erp_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/var/www/tony_erp/staticfiles:ro
      - media_volume:/var/www/tony_erp/media:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
      - ./errors:/var/www/tony_erp/staticfiles/errors:ro
    depends_on:
      - web
    networks:
      - tony_network

  # ========================================
  # Certbot for SSL
  # ========================================
  certbot:
    image: certbot/certbot
    container_name: tony_erp_certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  # ========================================
  # Backup Service
  # ========================================
  backup:
    image: postgres:15-alpine
    container_name: tony_erp_backup
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - PGHOST=db
    volumes:
      - ./backups:/backups
      - ./backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "-c", "while true; do /backup.sh; sleep 86400; done"]
    depends_on:
      - db
    networks:
      - tony_network

# ========================================
# Volumes
# ========================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local
  logs_volume:
    driver: local
  certbot_www:
    driver: local
  certbot_certs:
    driver: local

# ========================================
# Networks
# ========================================
networks:
  tony_network:
    driver: bridge
