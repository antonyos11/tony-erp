# Tony ERP - Nginx Production Configuration
# ============================================================
# Copy to:   sudo cp deploy/nginx/tony_erp.conf /etc/nginx/sites-available/tony_erp
# Enable:    sudo ln -sf /etc/nginx/sites-available/tony_erp /etc/nginx/sites-enabled/
# Test:      sudo nginx -t
# Reload:    sudo systemctl reload nginx
# ============================================================

upstream tony_erp_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name 72.62.176.249;

    # Health check without redirect (for monitoring/load balancers)
    location /health/ {
        proxy_pass http://tony_erp_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name 72.62.176.249;

    # SSL
    ssl_certificate /etc/ssl/certs/tony_erp.crt;
    ssl_certificate_key /etc/ssl/private/tony_erp.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    # Limits
    client_max_body_size 25M;
    client_body_timeout 60s;
    client_header_timeout 60s;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml text/javascript image/svg+xml;

    # Static Files (served by nginx directly)
    location /static/ {
        alias /var/www/tony_erp/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /media/ {
        alias /var/www/tony_erp/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /favicon.ico {
        alias /var/www/tony_erp/staticfiles/favicon.ico;
        access_log off;
        log_not_found off;
        expires 30d;
    }

    # WebSocket support
    location /ws/ {
        proxy_pass http://tony_erp_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Health Check (no rate limiting)
    location /health/ {
        proxy_pass http://tony_erp_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        access_log off;
    }

    # Heartbeat (lightweight)
    location /heartbeat/ {
        proxy_pass http://tony_erp_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
        access_log off;
    }

    # API
    location /api/ {
        proxy_pass http://tony_erp_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }

    # Main Application
    location / {
        proxy_pass http://tony_erp_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Error Pages
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /var/www/tony_erp/templates/errors/;
        internal;
    }
}
