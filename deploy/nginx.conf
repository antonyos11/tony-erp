# Tony ERP Production Nginx Configuration
# /etc/nginx/sites-available/tony_erp

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

# Upstream for Django/Gunicorn
upstream tony_erp {
    server 127.0.0.1:8000 fail_timeout=0;
    keepalive 32;
}

# HTTP redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name tonyerp.com www.tonyerp.com;
    
    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tonyerp.com www.tonyerp.com;
    
    # SSL certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/tonyerp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tonyerp.com/privkey.pem;
    
    # SSL configuration
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    
    # Modern SSL protocols
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    
    # HSTS
    add_header Strict-Transport-Security "max-age=63072000" always;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://www.google-analytics.com https://accept.paymob.com;" always;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;
    
    # Root directory
    root /var/www/tony_erp;
    
    # Logging
    access_log /var/log/nginx/tony_erp_access.log;
    error_log /var/log/nginx/tony_erp_error.log;
    
    # Max body size for file uploads
    client_max_body_size 50M;
    
    # Static files
    location /static/ {
        alias /var/www/tony_erp/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        
        # Gzip static files
        gzip_static on;
        
        # CORS for fonts
        location ~* \.(eot|ttf|woff|woff2)$ {
            add_header Access-Control-Allow-Origin *;
        }
    }
    
    # Media files
    location /media/ {
        alias /var/www/tony_erp/media/;
        expires 7d;
        add_header Cache-Control "public";
    }
    
    # Favicon
    location = /favicon.ico {
        alias /var/www/tony_erp/staticfiles/favicon.ico;
        expires 30d;
        access_log off;
        log_not_found off;
    }
    
    # Robots.txt
    location = /robots.txt {
        alias /var/www/tony_erp/staticfiles/robots.txt;
        expires 1d;
        access_log off;
    }
    
    # Sitemap
    location = /sitemap.xml {
        alias /var/www/tony_erp/staticfiles/sitemap.xml;
        expires 1d;
    }
    
    # PWA manifest
    location = /manifest.json {
        alias /var/www/tony_erp/staticfiles/ecommerce/manifest.json;
        default_type application/manifest+json;
        expires 1d;
    }
    
    # Service worker (no cache)
    location = /sw.js {
        alias /var/www/tony_erp/staticfiles/ecommerce/sw.js;
        default_type application/javascript;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    
    # API endpoints with rate limiting
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        
        proxy_pass http://tony_erp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Disable buffering for SSE/WebSocket
        proxy_buffering off;
    }
    
    # Login/auth endpoints with stricter rate limiting
    location ~ ^/(api/ecommerce/auth|login|admin/login) {
        limit_req zone=login_limit burst=5 nodelay;
        
        proxy_pass http://tony_erp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Webhooks (no rate limiting, but log everything)
    location /api/ecommerce/webhooks/ {
        proxy_pass http://tony_erp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Log webhook requests
        access_log /var/log/nginx/tony_erp_webhooks.log;
    }
    
    # Admin area
    location /admin/ {
        # Optional: IP whitelist for admin
        # allow 192.168.1.0/24;
        # deny all;
        
        proxy_pass http://tony_erp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Django app
    location / {
        proxy_pass http://tony_erp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /var/www/tony_erp/staticfiles/errors/;
        internal;
    }
    
    # Block common attacks
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~* \.(sql|bak|inc|old|swp|tmp)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
