{% extends 'base.html' %}
{% load static %}

{% block title %}إعدادات الإشعارات الصوتية{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row">
        <div class="col-12">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">
                        <i class="fas fa-volume-up me-2"></i>
                        إعدادات الإشعارات الصوتية
                    </h5>
                </div>
                <div class="card-body">
                    <form method="post" id="soundSettingsForm">
                        {% csrf_token %}
                        
                        <!-- التفعيل العام -->
                        <div class="row mb-4">
                            <div class="col-md-6">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="is_enabled" 
                                           name="is_enabled" {% if preferences.is_enabled %}checked{% endif %}>
                                    <label class="form-check-label" for="is_enabled">
                                        <strong>تفعيل الإشعارات الصوتية</strong>
                                    </label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="do_not_disturb" 
                                           name="do_not_disturb" {% if preferences.do_not_disturb %}checked{% endif %}>
                                    <label class="form-check-label" for="do_not_disturb">
                                        <i class="fas fa-moon me-1"></i>
                                        <strong>وضع عدم الإزعاج</strong>
                                    </label>
                                </div>
                            </div>
                        </div>
                        
                        <!-- مستوى الصوت -->
                        <div class="mb-4">
                            <label for="master_volume" class="form-label">
                                <i class="fas fa-sliders-h me-1"></i>
                                مستوى الصوت العام: <span id="volumeValue">{{ preferences.master_volume }}%</span>
                            </label>
                            <input type="range" class="form-range" id="master_volume" name="master_volume"
                                   min="0" max="100" value="{{ preferences.master_volume }}">
                        </div>
                        
                        <!-- اختيار السمة -->
                        <div class="mb-4">
                            <label for="theme" class="form-label">
                                <i class="fas fa-palette me-1"></i>
                                سمة الأصوات
                            </label>
                            <select class="form-select" id="theme" name="theme">
                                <option value="">-- افتراضي --</option>
                                {% for theme in themes %}
                                <option value="{{ theme.id }}" 
                                        {% if preferences.theme_id == theme.id %}selected{% endif %}>
                                    {{ theme.name }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <!-- تفعيل أنواع الأصوات -->
                        <div class="card mb-4">
                            <div class="card-header">
                                <h6 class="mb-0">تخصيص الأصوات حسب النوع</h6>
                            </div>
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-md-4 mb-3">
                                        <div class="form-check form-switch">
                                            <input class="form-check-input" type="checkbox" id="enable_new_order" 
                                                   name="enable_new_order" {% if preferences.enable_new_order %}checked{% endif %}>
                                            <label class="form-check-label" for="enable_new_order">
                                                <i class="fas fa-shopping-cart me-1 text-success"></i>
                                                الطلبات الجديدة
                                            </label>
                                            <button type="button" class="btn btn-sm btn-outline-primary ms-2 test-sound" 
                                                    data-type="new_order">
                                                <i class="fas fa-play"></i>
                                            </button>
                                        </div>
                                    </div>
                                    <div class="col-md-4 mb-3">
                                        <div class="form-check form-switch">
                                            <input class="form-check-input" type="checkbox" id="enable_payment" 
                                                   name="enable_payment" {% if preferences.enable_payment %}checked{% endif %}>
                                            <label class="form-check-label" for="enable_payment">
                                                <i class="fas fa-money-bill me-1 text-success"></i>
                                                المدفوعات
                                            </label>
                                            <button type="button" class="btn btn-sm btn-outline-primary ms-2 test-sound" 
                                                    data-type="payment_received">
                                                <i class="fas fa-play"></i>
                                            </button>
                                        </div>
                                    </div>
                                    <div class="col-md-4 mb-3">
                                        <div class="form-check form-switch">
                                            <input class="form-check-input" type="checkbox" id="enable_low_stock" 
                                                   name="enable_low_stock" {% if preferences.enable_low_stock %}checked{% endif %}>
                                            <label class="form-check-label" for="enable_low_stock">
                                                <i class="fas fa-exclamation-triangle me-1 text-warning"></i>
                                                تنبيهات المخزون
                                            </label>
                                            <button type="button" class="btn btn-sm btn-outline-primary ms-2 test-sound" 
                                                    data-type="low_stock">
                                                <i class="fas fa-play"></i>
                                            </button>
                                        </div>
                                    </div>
                                    <div class="col-md-4 mb-3">
                                        <div class="form-check form-switch">
                                            <input class="form-check-input" type="checkbox" id="enable_approval" 
                                                   name="enable_approval" {% if preferences.enable_approval %}checked{% endif %}>
                                            <label class="form-check-label" for="enable_approval">
                                                <i class="fas fa-check-circle me-1 text-info"></i>
                                                طلبات الموافقة
                                            </label>
                                            <button type="button" class="btn btn-sm btn-outline-primary ms-2 test-sound" 
                                                    data-type="approval_needed">
                                                <i class="fas fa-play"></i>
                                            </button>
                                        </div>
                                    </div>
                                    <div class="col-md-4 mb-3">
                                        <div class="form-check form-switch">
                                            <input class="form-check-input" type="checkbox" id="enable_tasks" 
                                                   name="enable_tasks" {% if preferences.enable_tasks %}checked{% endif %}>
                                            <label class="form-check-label" for="enable_tasks">
                                                <i class="fas fa-tasks me-1 text-primary"></i>
                                                المهام
                                            </label>
                                            <button type="button" class="btn btn-sm btn-outline-primary ms-2 test-sound" 
                                                    data-type="task_assigned">
                                                <i class="fas fa-play"></i>
                                            </button>
                                        </div>
                                    </div>
                                    <div class="col-md-4 mb-3">
                                        <div class="form-check form-switch">
                                            <input class="form-check-input" type="checkbox" id="enable_messages" 
                                                   name="enable_messages" {% if preferences.enable_messages %}checked{% endif %}>
                                            <label class="form-check-label" for="enable_messages">
                                                <i class="fas fa-envelope me-1 text-secondary"></i>
                                                الرسائل
                                            </label>
                                            <button type="button" class="btn btn-sm btn-outline-primary ms-2 test-sound" 
                                                    data-type="message_received">
                                                <i class="fas fa-play"></i>
                                            </button>
                                        </div>
                                    </div>
                                    <div class="col-md-4 mb-3">
                                        <div class="form-check form-switch">
                                            <input class="form-check-input" type="checkbox" id="enable_reminders" 
                                                   name="enable_reminders" {% if preferences.enable_reminders %}checked{% endif %}>
                                            <label class="form-check-label" for="enable_reminders">
                                                <i class="fas fa-bell me-1 text-warning"></i>
                                                التذكيرات
                                            </label>
                                            <button type="button" class="btn btn-sm btn-outline-primary ms-2 test-sound" 
                                                    data-type="reminder">
                                                <i class="fas fa-play"></i>
                                            </button>
                                        </div>
                                    </div>
                                    <div class="col-md-4 mb-3">
                                        <div class="form-check form-switch">
                                            <input class="form-check-input" type="checkbox" id="enable_chat" 
                                                   name="enable_chat" {% if preferences.enable_chat %}checked{% endif %}>
                                            <label class="form-check-label" for="enable_chat">
                                                <i class="fas fa-comments me-1 text-success"></i>
                                                الدردشة
                                            </label>
                                            <button type="button" class="btn btn-sm btn-outline-primary ms-2 test-sound" 
                                                    data-type="chat">
                                                <i class="fas fa-play"></i>
                                            </button>
                                        </div>
                                    </div>
                                    <div class="col-md-4 mb-3">
                                        <div class="form-check form-switch">
                                            <input class="form-check-input" type="checkbox" id="enable_calls" 
                                                   name="enable_calls" {% if preferences.enable_calls %}checked{% endif %}>
                                            <label class="form-check-label" for="enable_calls">
                                                <i class="fas fa-phone me-1 text-danger"></i>
                                                المكالمات
                                            </label>
                                            <button type="button" class="btn btn-sm btn-outline-primary ms-2 test-sound" 
                                                    data-type="call">
                                                <i class="fas fa-play"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="d-flex justify-content-between">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-1"></i>
                                حفظ الإعدادات
                            </button>
                            <button type="button" class="btn btn-secondary" id="testAllSounds">
                                <i class="fas fa-volume-up me-1"></i>
                                اختبار جميع الأصوات
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Audio Element for Testing -->
<audio id="testAudio" preload="none"></audio>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Volume slider
    const volumeSlider = document.getElementById('master_volume');
    const volumeValue = document.getElementById('volumeValue');
    volumeSlider.addEventListener('input', function() {
        volumeValue.textContent = this.value + '%';
    });
    
    // Test sound buttons
    const testButtons = document.querySelectorAll('.test-sound');
    const audio = document.getElementById('testAudio');
    
    testButtons.forEach(btn => {
        btn.addEventListener('click', function() {
            const soundType = this.dataset.type;
            fetch(`{% url 'sound_notifications:test_sound' 'placeholder' %}`.replace('placeholder', soundType))
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        audio.src = data.url;
                        audio.volume = data.volume;
                        audio.play();
                    } else {
                        alert(data.message || 'لم يتم العثور على صوت');
                    }
                });
        });
    });
});
</script>
{% endblock %}
