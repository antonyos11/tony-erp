##############################################
# RITA ERP — Nginx Configuration
# Copy to: /etc/nginx/sites-available/rita-erp
# Enable:  ln -s /etc/nginx/sites-available/rita-erp /etc/nginx/sites-enabled/
##############################################

server {
    listen 80;
    server_name your-domain.com;

    # Redirect HTTP → HTTPS (uncomment after SSL setup)
    # return 301 https://$host$request_uri;

    # ── Static Files ──────────────────────────────
    location /static/ {
        alias /var/www/rita-erp/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Media Files ───────────────────────────────
    location /media/ {
        alias /var/www/rita-erp/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── Gunicorn Proxy ────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout  120s;
        proxy_connect_timeout 10s;

        # Buffer settings
        proxy_buffering    on;
        proxy_buffer_size  16k;
        proxy_buffers      8 16k;
    }

    # ── Security Headers ──────────────────────────
    add_header X-Content-Type-Options  nosniff;
    add_header X-Frame-Options         DENY;
    add_header X-XSS-Protection        "1; mode=block";
    add_header Referrer-Policy         "strict-origin-when-cross-origin";

    # ── Logging ───────────────────────────────────
    access_log /var/log/nginx/rita-erp_access.log;
    error_log  /var/log/nginx/rita-erp_error.log;

    # ── File Upload Limit ─────────────────────────
    client_max_body_size 20M;
}

