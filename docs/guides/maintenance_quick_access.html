<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الصيانة - وصول سريع</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .quick-access-card {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .btn-maintenance {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            border: none;
            color: white;
            padding: 15px 30px;
            margin: 10px;
            border-radius: 10px;
            transition: all 0.3s ease;
        }
        .btn-maintenance:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="quick-access-card text-center">
                    <h1 class="mb-4">
                        <i class="fas fa-wrench text-primary"></i>
                        نظام الصيانة والمعدات
                    </h1>
                    <p class="lead mb-4">إدارة شاملة للماكينات وقطع الغيار وعمليات الصيانة</p>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <a href="http://localhost:8000/maintenance/" class="btn btn-maintenance w-100">
                                <i class="fas fa-tachometer-alt me-2"></i>
                                لوحة تحكم الصيانة
                            </a>
                        </div>
                        <div class="col-md-6 mb-3">
                            <a href="http://localhost:8000/maintenance/machines/" class="btn btn-maintenance w-100">
                                <i class="fas fa-industry me-2"></i>
                                الماكينات
                            </a>
                        </div>
                        <div class="col-md-6 mb-3">
                            <a href="http://localhost:8000/maintenance/spare-parts/" class="btn btn-maintenance w-100">
                                <i class="fas fa-cogs me-2"></i>
                                قطع الغيار
                            </a>
                        </div>
                        <div class="col-md-6 mb-3">
                            <a href="http://localhost:8000/maintenance/requests/" class="btn btn-maintenance w-100">
                                <i class="fas fa-clipboard-list me-2"></i>
                                طلبات الصيانة
                            </a>
                        </div>
                    </div>
                    
                    <hr class="my-4">
                    
                    <div class="row">
                        <div class="col-md-6">
                            <a href="http://localhost:8000/" class="btn btn-outline-primary w-100">
                                <i class="fas fa-home me-2"></i>
                                العودة للرئيسية
                            </a>
                        </div>
                        <div class="col-md-6">
                            <a href="http://localhost:8000/admin/" class="btn btn-outline-secondary w-100">
                                <i class="fas fa-cog me-2"></i>
                                لوحة الإدارة
                            </a>
                        </div>
                    </div>
                    
                    <div class="mt-4">
                        <small class="text-muted">
                            <i class="fas fa-info-circle me-1"></i>
                            تم إنشاء البيانات التجريبية بنجاح - يمكنك الآن استخدام النظام
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
