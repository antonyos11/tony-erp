# ====================================================================
# Tony ERP - Enterprise Docker Compose
# للشركات الكبيرة - High Availability & Scalability
# ====================================================================

version: '3.8'

services:
  # ====================================================================
  # 🗄️ PostgreSQL Primary
  # ====================================================================
  db:
    image: postgres:16-alpine
    container_name: tony_erp_db_primary
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-tony_erp}
      POSTGRES_USER: ${DB_USER:-tony_erp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tony_erp} -d ${DB_NAME:-tony_erp}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    networks:
      - tony_network

  # ====================================================================
  # ⚡ Redis Cluster (Primary)
  # ====================================================================
  redis:
    image: redis:7-alpine
    container_name: tony_erp_redis
    restart: always
    command: >
      redis-server
      --appendonly yes
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --tcp-backlog 511
      --timeout 0
      --tcp-keepalive 300
      --save 900 1
      --save 300 10
      --save 60 10000
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
    networks:
      - tony_network

  # ====================================================================
  # 🌐 Django Web Application (Scalable)
  # ====================================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tony_erp_web
    restart: always
    environment:
      - DJANGO_SETTINGS_MODULE=accountant_pro.settings_enterprise
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY required}
      - DB_NAME=${DB_NAME:-tony_erp}
      - DB_USER=${DB_USER:-tony_erp}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD required}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      - EMAIL_HOST=${EMAIL_HOST:-smtp.gmail.com}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
    ports:
      - "8000:8000"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
      - ./backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 2
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 1G
    command: >
      sh -c "
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput &&
        gunicorn accountant_pro.wsgi:application
          --bind 0.0.0.0:8000
          --workers 4
          --threads 2
          --worker-class gthread
          --worker-connections 1000
          --max-requests 5000
          --max-requests-jitter 500
          --timeout 30
          --keep-alive 5
          --access-logfile -
          --error-logfile -
      "
    networks:
      - tony_network

  # ====================================================================
  # 🔄 Celery Worker (Background Tasks)
  # ====================================================================
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tony_erp_celery_worker
    restart: always
    environment:
      - DJANGO_SETTINGS_MODULE=accountant_pro.settings_enterprise
      - SECRET_KEY=${SECRET_KEY}
      - DB_NAME=${DB_NAME:-tony_erp}
      - DB_USER=${DB_USER:-tony_erp}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    volumes:
      - media_volume:/app/media
      - logs_volume:/app/logs
    depends_on:
      - db
      - redis
      - web
    deploy:
      mode: replicated
      replicas: 2
      resources:
        limits:
          cpus: '2'
          memory: 2G
    command: >
      celery -A accountant_pro worker
        --loglevel=info
        --concurrency=4
        --queues=default,reports,notifications
        --max-tasks-per-child=1000
    networks:
      - tony_network

  # ====================================================================
  # ⏰ Celery Beat (Scheduled Tasks)
  # ====================================================================
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tony_erp_celery_beat
    restart: always
    environment:
      - DJANGO_SETTINGS_MODULE=accountant_pro.settings_enterprise
      - SECRET_KEY=${SECRET_KEY}
      - DB_NAME=${DB_NAME:-tony_erp}
      - DB_USER=${DB_USER:-tony_erp}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - CELERY_BROKER_URL=redis://redis:6379/1
    volumes:
      - logs_volume:/app/logs
    depends_on:
      - db
      - redis
      - celery_worker
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    command: celery -A accountant_pro beat --loglevel=info
    networks:
      - tony_network

  # ====================================================================
  # 🌸 Flower (Celery Monitoring)
  # ====================================================================
  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tony_erp_flower
    restart: always
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
      - FLOWER_BASIC_AUTH=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-admin}
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - celery_worker
    command: celery -A accountant_pro flower --port=5555
    networks:
      - tony_network

  # ====================================================================
  # 🌐 Nginx (Load Balancer & Reverse Proxy)
  # ====================================================================
  nginx:
    image: nginx:alpine
    container_name: tony_erp_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    networks:
      - tony_network

  # ====================================================================
  # 📊 pgAdmin (Database Management)
  # ====================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tony_erp_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@company.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db
    networks:
      - tony_network
    profiles:
      - admin  # Only start with: docker-compose --profile admin up

  # ====================================================================
  # 📈 Prometheus (Metrics Collection)
  # ====================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: tony_erp_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - tony_network
    profiles:
      - monitoring

  # ====================================================================
  # 📉 Grafana (Metrics Visualization)
  # ====================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: tony_erp_grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-piechart-panel
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - tony_network
    profiles:
      - monitoring

# ====================================================================
# 💾 Volumes
# ====================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local
  logs_volume:
    driver: local
  pgadmin_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# ====================================================================
# 🌐 Networks
# ====================================================================
networks:
  tony_network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
